<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .messenger {
            width: 1400px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }
        .icon-bar {
            width: 80px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
            z-index: 10;
        }
        .icon-item {
            width: 50px;
            height: 50px;
            background: rgba(0,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .icon-item:hover { background: rgba(0,255,255,0.3); transform: scale(1.05); box-shadow: 0 0 10px cyan; }
        .icon-item.active { background: #0af; color: black; box-shadow: 0 0 15px cyan; }
        .content-panel {
            width: 340px;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
        }
        .search-header { padding: 16px; border-bottom: 1px solid #0af; }
        .search-header input { width: 100%; padding: 10px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; outline: none; }
        .section-header { padding: 12px 16px; border-bottom: 1px solid rgba(0,255,255,0.2); font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #0af; }
        .list-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            background: rgba(0,255,255,0.05);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .list-item:hover { background: rgba(0,255,255,0.15); border: 1px solid #0af; }
        .list-avatar { width: 44px; height: 44px; background: #0af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; background-size: cover; background-position: center; }
        .list-info { flex: 1; }
        .list-title { font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .list-sub { font-size: 11px; opacity: 0.6; }
        .unread-badge {
            background: #ff3333;
            color: white;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 8px;
        }
        .unread-badge.muted { background: #666; }
        .request-badge { background: #ff6600; border-radius: 20px; padding: 2px 8px; font-size: 10px; margin-left: 8px; }
        .empty-state { text-align: center; padding: 20px; opacity: 0.5; }
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            margin: 12px;
            font-size: 14px;
        }
        .add-btn:hover { background: rgba(0,200,255,0.4); }
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: rgba(6,12,24,0.4); }
        .chat-header { padding: 16px 20px; border-bottom: 1px solid #0af; display: flex; justify-content: space-between; align-items: center; background: rgba(2,8,18,0.7); cursor: pointer; }
        .chat-title { font-size: 18px; font-weight: bold; }
        .chat-header-dots { background: none; border: none; color: cyan; font-size: 28px; cursor: pointer; padding: 4px 12px; }
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .search-bar-container {
            position: sticky;
            top: 0;
            background: rgba(6,12,24,0.95);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            margin-bottom: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .search-bar-container input { flex: 1; padding: 8px 16px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; outline: none; }
        .search-nav { display: flex; gap: 8px; align-items: center; }
        .search-nav button { background: #0af; border: none; border-radius: 20px; padding: 6px 12px; cursor: pointer; }
        .message {
            max-width: 70%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            transition: 0.2s;
        }
        .message.highlight { background: #ffcc00 !important; color: black !important; box-shadow: 0 0 10px #ffcc00; }
        .message.current-highlight { background: #ff9900 !important; color: black !important; box-shadow: 0 0 15px #ff9900; border: 1px solid white; }
        .message-avatar { width: 36px; height: 36px; background: #0af; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; background-size: cover; cursor: pointer; flex-shrink: 0; }
        .message-content { flex: 1; }
        .my-message { align-self: flex-end; background: #0af; color: black; }
        .message-actions { display: none; gap: 12px; margin-top: 6px; font-size: 12px; justify-content: flex-end; }
        .message:hover .message-actions { display: flex; }
        .message-actions span { cursor: pointer; opacity: 0.7; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 16px; }
        .message-actions span:hover { opacity: 1; background: cyan; color: black; }
        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input { flex: 1; padding: 10px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; outline: none; }
        .chat-input button { background: none; border: none; font-size: 24px; cursor: pointer; color: #0af; padding: 0 10px; }
        .reply-indicator { font-size: 12px; opacity: 0.7; margin-bottom: 4px; border-left: 2px solid cyan; padding-left: 8px; }
        .voice-recording { display: flex; align-items: center; gap: 12px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; padding: 8px 16px; flex: 1; }
        .voice-wave { flex: 1; height: 30px; background: rgba(0,255,255,0.2); border-radius: 20px; overflow: hidden; }
        .voice-wave-fill { width: 0%; height: 100%; background: cyan; transition: width 0.1s linear; }
        .modal-confirm {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 320px;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 0 40px rgba(0,255,255,0.3);
        }
        .modal-confirm h3 { margin-bottom: 20px; }
        .modal-confirm-buttons { display: flex; gap: 16px; justify-content: center; margin-top: 20px; }
        .modal-confirm-buttons button { padding: 8px 24px; background: #0af; border: none; border-radius: 40px; cursor: pointer; font-weight: bold; }
        .modal-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 280px;
            text-align: center;
            z-index: 2000;
        }
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 380px;
            text-align: center;
        }
        .modal-box input, .modal-box textarea { width: 100%; padding: 12px; margin: 12px 0; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 10px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        .profile-card {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 340px;
            text-align: center;
        }
        .member-list { max-height: 200px; overflow-y: auto; margin-top: 12px; text-align: left; }
        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 20px;
            background: rgba(0,255,255,0.05);
            margin-bottom: 8px;
            cursor: pointer;
        }
        .member-item:hover { background: rgba(0,255,255,0.2); }
        .emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0; font-size: 28px; }
        .emoji-option { cursor: pointer; padding: 4px 8px; border-radius: 12px; }
        .emoji-option:hover { background: #0af; }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea { width: 100%; padding: 12px; margin: 10px 0; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .auth-btn { background: #0af; border: none; border-radius: 40px; padding: 12px; cursor: pointer; font-weight: bold; }
        .burger-btn { display: none; }
        body.mobile-mode .messenger { width: 100%; height: 100vh; border-radius: 0; }
        body.mobile-mode .content-panel {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            transform: translateX(-100%);
            z-index: 1000;
            transition: transform 0.2s;
        }
        body.mobile-mode .content-panel.open { transform: translateX(0); }
        body.mobile-mode .burger-btn { display: block; position: fixed; top: 15px; left: 15px; z-index: 1001; background: #0af; border: none; border-radius: 50%; width: 45px; height: 45px; font-size: 24px; cursor: pointer; color: black; }
        .chat-menu {
            position: fixed;
            background: #0a1428;
            border: 1px solid #0af;
            border-radius: 16px;
            padding: 8px;
            z-index: 200;
        }
        .chat-menu div { padding: 8px 16px; cursor: pointer; border-radius: 12px; }
        .chat-menu div:hover { background: #0af; color: black; }
        .media-content { max-width: 200px; max-height: 150px; border-radius: 12px; cursor: pointer; }
        .file-content { display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
            position: relative;
        }
        .friends-icon .friend-request-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3333;
            color: white;
            border-radius: 50%;
            min-width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 1px solid white;
        }
        .subgroup-item { margin-left: 28px; padding: 6px; font-size: 13px; border-radius: 16px; background: rgba(0,255,255,0.05); cursor: pointer; }
        .subgroup-item:hover { background: rgba(0,255,255,0.15); }
        .prefix-input {
            display: flex;
            align-items: center;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 0 12px;
            margin: 12px 0;
        }
        .prefix-input span { color: #0af; font-size: 16px; font-weight: bold; margin-right: 4px; }
        .prefix-input input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let subgroups = JSON.parse(localStorage.getItem('subgroups') || '{}');
    let friends = [];
    let friendRequests = [];
    let groupJoinRequests = [];
    let groups = [];
    let channels = [];
    let replyTo = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentMatches = [];
    let currentMatchIndex = -1;
    let activeLeftTab = 'profile';
    let allUsersList = [];
    let unreadData = {};

    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveSubgroups() { localStorage.setItem('subgroups', JSON.stringify(subgroups)); }

    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }

    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.innerHTML = `<h3>${msg}</h3><button onclick="this.parentElement.remove()" class="auth-btn">ОК</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function showConfirmDialog(title, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'modal-confirm';
        modal.innerHTML = `
            <h3>${title}</h3>
            <div class="modal-confirm-buttons">
                <button id="confirmYes">Да</button>
                <button id="confirmNo">Нет</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('confirmYes').onclick = () => { onConfirm(); modal.remove(); };
        document.getElementById('confirmNo').onclick = () => modal.remove();
    }

    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn" class="auth-btn">Вход</button>
                        <button id="showRegBtn" class="auth-btn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        const authForm = document.getElementById('authForm');
        if (!authForm) return;
        authForm.innerHTML = `
            <input type="text" id="login" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button id="doLogin" class="auth-btn">Войти</button>
        `;
        const doLoginBtn = document.getElementById('doLogin');
        if (doLoginBtn) {
            doLoginBtn.onclick = async () => {
                const login = document.getElementById('login').value;
                const password = document.getElementById('password').value;
                const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password }) });
                const data = await res.json();
                if (data.error) showToast(data.error);
                else { 
                    currentUser = data.login; 
                    currentUserData = data.user; 
                    localStorage.setItem('authToken', data.user.token);
                    startMessenger(); 
                }
            };
        }
    }

    function showRegister() {
        const authForm = document.getElementById('authForm');
        if (!authForm) return;
        authForm.innerHTML = `
            <input type="text" id="regLogin" placeholder="Логин">
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="date" id="regBirthdate">
            <textarea id="regAbout" rows="2" placeholder="О себе"></textarea>
            <button id="doReg" class="auth-btn">Зарегистрироваться</button>
        `;
        const doRegBtn = document.getElementById('doReg');
        if (doRegBtn) {
            doRegBtn.onclick = async () => {
                const login = document.getElementById('regLogin').value;
                const password = document.getElementById('regPassword').value;
                const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password, name: login, surname: '', birthdate: document.getElementById('regBirthdate').value, about: document.getElementById('regAbout').value, favoriteGames: [] }) });
                const data = await res.json();
                if (data.error) showToast(data.error);
                else { 
                    showToast('Регистрация успешна! Войдите'); 
                    localStorage.setItem('authToken', data.token);
                    showLogin(); 
                }
            };
        }
    }

    async function loadAllData() {
        await Promise.all([
            fetch('/users').then(r => r.json()).then(data => { allUsersList = data.filter(u => u.login !== currentUser); }),
            fetch('/chats').then(r => r.json()).then(data => { 
                allChats = data; 
                groups = data.filter(c => c.isGroup === true); 
                channels = data.filter(c => c.isChannel === true); 
            }),
            fetch(`/friends/${currentUser}`).then(r => r.json()).then(data => { friends = data.friends || []; }),
            fetch(`/friend-requests/${currentUser}`).then(r => r.json()).then(data => { friendRequests = data.requests || []; }),
            fetch(`/group-requests/${currentUser}`).then(r => r.json()).then(data => { groupJoinRequests = data.requests || []; }),
            fetch(`/unread/${currentUser}`).then(r => r.json()).then(data => { unreadData = data.unread || {}; })
        ]);
        updateFriendRequestBadge();
        renderLeftPanelContent();
        renderJoinRequestsInMenu();
    }

    function updateFriendRequestBadge() {
        const friendIcon = document.getElementById('friendsIcon');
        if (!friendIcon) return;
        let badge = friendIcon.querySelector('.friend-request-count');
        const count = friendRequests.length;
        if (!badge) {
            badge = document.createElement('div');
            badge.className = 'friend-request-count';
            friendIcon.appendChild(badge);
        }
        if (count > 0) {
            badge.innerText = count > 9 ? '9+' : count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }

    function getUnreadCount(chatId) {
        const count = unreadData[chatId] || 0;
        const isMuted = mutedChats[chatId];
        if (count === 0) return '';
        return `<span class="unread-badge ${isMuted ? 'muted' : ''}">${count}</span>`;
    }

    function renderJoinRequestsInMenu() {
        const container = document.getElementById('joinRequestsContainer');
        if (!container) return;
        if (groupJoinRequests.length === 0) {
            container.innerHTML = '<div class="empty-state" style="padding:8px;">Нет заявок в группы</div>';
            return;
        }
        container.innerHTML = groupJoinRequests.map(req => `
            <div class="list-item" style="margin-bottom:8px;">
                <div class="list-avatar">👤</div>
                <div class="list-info">
                    <div class="list-title">${req.fromUser}</div>
                    <div class="list-sub">хочет вступить в группу</div>
                    <div style="display:flex; gap:8px; margin-top:6px;">
                        <button class="accept-group" data-group="${req.groupId}" data-user="${req.fromUser}" style="background:#0af; border:none; border-radius:20px; padding:4px 12px;">✅ Принять</button>
                        <button class="decline-group" data-group="${req.groupId}" data-user="${req.fromUser}" style="background:#ff6600; border:none; border-radius:20px; padding:4px 12px;">❌ Отклонить</button>
                    </div>
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.accept-group').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                const groupId = btn.dataset.group;
                const fromUser = btn.dataset.user;
                await fetch('/respond-group-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ groupId, fromUser, toUser: currentUser, accept: true }) });
                await loadAllData();
                showToast(`Пользователь ${fromUser} принят в группу`);
            };
        });
        document.querySelectorAll('.decline-group').forEach(btn => {
            btn.onclick = async (e) => {
                e.stopPropagation();
                const groupId = btn.dataset.group;
                const fromUser = btn.dataset.user;
                await fetch('/respond-group-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ groupId, fromUser, toUser: currentUser, accept: false }) });
                await loadAllData();
                showToast(`Заявка от ${fromUser} отклонена`);
            };
        });
    }

    function renderLeftPanelContent() {
        const container = document.getElementById('listContainer');
        const query = document.getElementById('leftSearchInput')?.value.toLowerCase() || '';
        if (!container) return;

        if (activeLeftTab === 'profile') {
            document.getElementById('contentTitle').innerText = '👤 Мой профиль';
            const avatarUrl = userAvatars[currentUser] || null;
            container.innerHTML = `
                <div class="list-item" onclick="window.showMyProfile()">
                    <div class="list-avatar" style="${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                    <div class="list-info"><div class="list-title">${currentUser}</div><div class="list-sub">Нажмите для просмотра</div></div>
                </div>
                <div class="section-header" style="margin-top:16px;">👥 Друзья</div>
            `;
            renderFriendsListInPanel(container);
            container.innerHTML += `<div class="section-header">💬 ЧАТЫ</div>`;
            renderChatsListInPanel(container, query);

    function renderChatsListInPanel(container, query) {
        const myChats = allChats.filter(chat => {
            if (chat.id === 'favorites') return true;
            if (chat.isGroup && chat.members?.includes(currentUser)) return true;
            if (chat.isChannel && chat.members?.includes(currentUser)) return true;
            if (!chat.isGroup && !chat.isChannel && chat.members?.includes(currentUser)) return true;
            return false;
        });
        const filteredChats = myChats.filter(chat => !query || chat.name.toLowerCase().includes(query));
        if (filteredChats.length === 0) {
            container.innerHTML += '<div class="empty-state">Нет чатов</div>';
        } else {
            filteredChats.forEach(chat => {
                let displayName = chat.name;
                let avatar = chat.avatar || '💬';
                if (!chat.isGroup && !chat.isChannel && chat.id !== 'favorites') {
                    const otherUser = chat.members?.find(m => m !== currentUser);
                    if (otherUser) {
                        displayName = otherUser;
                        const otherAvatar = userAvatars[otherUser];
                        if (otherAvatar) avatar = `<div class="list-avatar" style="background-image:url(${otherAvatar}); background-size:cover;"></div>`;
                        else avatar = `<div class="list-avatar">👤</div>`;
                    }
                }
                const unreadHtml = getUnreadCount(chat.id);
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = (typeof avatar === 'string' && avatar.startsWith('<')) ? avatar : `<div class="list-avatar" style="display:flex; align-items:center; justify-content:center;">${avatar}</div>`;
                div.innerHTML += `<div class="list-info"><div class="list-title">${displayName} ${unreadHtml}</div><div class="list-sub">${chat.isGroup ? 'Группа' : (chat.isChannel ? 'Канал' : 'Личный чат')}</div></div>`;
                div.onclick = () => {
                    currentChat = chat.id;
                    currentChatName = displayName;
                    document.getElementById('chatTitle').innerText = displayName;
                    loadMessages();
                    socket.emit('join', currentChat);
                    socket.emit('markRead', { chatId: currentChat, user: currentUser });
                    unreadData[currentChat] = 0;
                    renderLeftPanelContent();
                };
                container.appendChild(div);
            });
        }
    }

    function showEditProfileModal() {

            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';

                const file = e.target.files[0];
                if (file && file.size <= 4*1024*1024) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        userAvatars[currentUser] = ev.target.result;

                        document.getElementById('avatarPreview').style.backgroundSize = 'cover';

            currentUserData = { ...currentUserData, birthdate: document.getElementById('editBirthdate').value, about: document.getElementById('editAbout').value };

    window.showUserProfile = function(login, parentModalToClose = null) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { showToast('Пользователь не найден'); return; }
                const avatar = userAvatars[login] || null;
                const isFriend = friends?.includes(login);
                const requestSent = friendRequests?.includes(login);
                const modalDiv = document.createElement('div');
                modalDiv.className = 'modal';
                modalDiv.innerHTML = `
                    <div class="profile-card">
                        <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div>
                        <h2>${data.login}</h2>
                        <div><strong>📅 Дата рождения:</strong> ${data.birthdate || 'не указана'}</div>
                        <div><strong>📝 О себе:</strong> ${data.about || 'не указано'}</div>
                        <button id="friendBtn" class="auth-btn">${isFriend ? '❌ Удалить из друзей' : (requestSent ? '⏳ Заявка отправлена' : '➕ Добавить в друзья')}</button>
                        <button id="msgBtn" class="auth-btn">💬 Написать сообщение</button>
                        <button id="closeProfileBtn" class="auth-btn">Закрыть</button>
                    </div>
                `;
                document.body.appendChild(modalDiv);
                document.getElementById('friendBtn').onclick = async () => {
                    if (!isFriend && !requestSent) {
                        await fetch('/add-friend', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from: currentUser, to: login }) });
                        showToast(`Заявка в друзья отправлена пользователю ${login}`);
                        modalDiv.remove();
                        if (parentModalToClose) parentModalToClose.remove();
                        await loadAllData();
                    } else if (isFriend) {
                        showToast('Удаление друга пока не реализовано');
                    } else {
                        showToast('Заявка уже отправлена');
                    }
                };
                document.getElementById('msgBtn').onclick = async () => {
                    let chat = allChats.find(c => c.members && c.members.includes(currentUser) && c.members.includes(login) && !c.isGroup && !c.isChannel);
                    if (!chat) {
                        const res = await fetch('/create-chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: login, avatar: '💬', creator: currentUser, members: [currentUser, login], isGroup: false, isChannel: false }) });
                        const data = await res.json();
                        await loadAllData();
                        chat = allChats.find(c => c.id === data.chatId);
                    }
                    if (chat) {
                        currentChat = chat.id;
                        currentChatName = login;
                        document.getElementById('chatTitle').innerText = login;
                        loadMessages();
                        socket.emit('join', currentChat);
                    }
                    modalDiv.remove();
                    if (parentModalToClose) parentModalToClose.remove();
                };
                document.getElementById('closeProfileBtn').onclick = () => {
                    modalDiv.remove();
                    if (parentModalToClose) parentModalToClose.remove();
                };
            });
    };

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        const msgs = messagesData[currentChat] || [];
        if (msgs.length === 0) {
            container.innerHTML = '<div class="search-bar-container" id="searchBar" style="display:none;"><input type="text" id="messageSearchInput" placeholder="Поиск в чате..."><div class="search-nav"><span id="searchCount">0</span><button id="searchPrevBtn">▲</button><button id="searchNextBtn">▼</button><button id="searchCloseBtn">✖</button></div></div><div style="text-align:center; opacity:0.5;">💬 Начните общение</div>';

        container.innerHTML = `<div class="search-bar-container" id="searchBar" style="display:none;"><input type="text" id="messageSearchInput" placeholder="Поиск в чате..."><div class="search-nav"><span id="searchCount">0</span><button id="searchPrevBtn">▲</button><button id="searchNextBtn">▼</button><button id="searchCloseBtn">✖</button></div></div>` + msgs.map((msg, idx) => {
            const avatarHtml = getAvatarForUser(msg.from);

                    <div class="message-avatar" onclick="window.showUserProfile('${msg.from}')">${avatarHtml}</div>

                        <small>${msg.time}</small>
                        <div class="message-actions">
                            <span class="reply-action">↩️ Ответить</span>
                            <span class="forward-action">📤 Переслать</span>
                            ${msg.from === currentUser ? '<span class="delete-action">🗑️ Удалить</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

                    });

            };
        });
        const searchMsgInput = document.getElementById('messageSearchInput');
        if (searchMsgInput) searchMsgInput.oninput = performSearchInMessages;
        document.getElementById('searchPrevBtn')?.addEventListener('click', () => navigateSearch(-1));

    function performSearchInMessages() {
        const query = document.getElementById('messageSearchInput')?.value.toLowerCase();
        const searchCountSpan = document.getElementById('searchCount');
        if (!query) {
            clearAllHighlights();
            if (searchCountSpan) searchCountSpan.innerText = '0';
            return;
        }
        const messages = document.querySelectorAll('.chat-messages .message');
        clearAllHighlights();
        currentMatches = [];
        messages.forEach(msg => {
            const text = msg.innerText.toLowerCase();
            if (text.includes(query)) {
                msg.classList.add('highlight');
                currentMatches.push(msg);
            }
        });
        if (searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
        if (currentMatches.length > 0) {
            currentMatchIndex = 0;
            highlightCurrentMatch();
        } else currentMatchIndex = -1;
    }

    function clearAllHighlights() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => {
            msg.classList.remove('highlight', 'current-highlight');
        });
        currentMatches = [];
        currentMatchIndex = -1;
    }

    function highlightCurrentMatch() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => msg.classList.remove('current-highlight'));
        if (currentMatchIndex >= 0 && currentMatches[currentMatchIndex]) {
            const currentMsg = currentMatches[currentMatchIndex];
            currentMsg.classList.add('current-highlight');
            currentMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const searchCountSpan = document.getElementById('searchCount');
            if (searchCountSpan) searchCountSpan.innerText = `${currentMatchIndex + 1}/${currentMatches.length}`;
        } else if (currentMatches.length > 0 && searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
    }

    function navigateSearch(delta) {
        if (currentMatches.length === 0) return;
        currentMatchIndex += delta;
        if (currentMatchIndex < 0) currentMatchIndex = currentMatches.length - 1;
        if (currentMatchIndex >= currentMatches.length) currentMatchIndex = 0;
        highlightCurrentMatch();
    }

    function openSearch() { document.getElementById('searchBar').style.display = 'flex'; document.getElementById('messageSearchInput').focus(); }
    function closeSearch() { document.getElementById('searchBar').style.display = 'none'; clearAllHighlights(); document.getElementById('messageSearchInput').value = ''; document.getElementById('searchCount').innerText = '0'; }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        let text = input.value.trim();
        if (replyTo) {
            text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`;
            replyTo = null;
            document.getElementById('replyIndicator').innerHTML = '<span></span><button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>';
        }
        if (text) {
            if (currentChat === 'favorites') saveFavoriteMessage(text);
            else socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text, time: getFormattedTime() });
            input.value = '';
        }
    }

    function sendFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            let html = '';
            if (file.type.startsWith('image/')) html = `<img src="${e.target.result}" class="media-content" onclick="viewMedia('${e.target.result}', 'image')" style="max-width:200px; border-radius:12px; cursor:pointer;">`;
            else if (file.type.startsWith('video/')) html = `<video src="${e.target.result}" class="media-content" controls style="max-width:200px; border-radius:12px;"></video>`;
            else html = `<div class="file-content" onclick="downloadFile('${e.target.result}', '${file.name}')">📎 ${file.name}</div>`;
            socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: html, time: getFormattedTime() });
        };
        reader.readAsDataURL(file);
    }

    function startVoiceRecording() {
        if (isRecording) {
            if (mediaRecorder) { mediaRecorder.stop(); isRecording = false; }
            document.getElementById('voiceRecBar').style.display = 'none';
            document.getElementById('msgInput').style.display = 'block';
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = e => {
                        socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<audio src="${e.target.result}" controls style="max-width:200px;"></audio>`, time: getFormattedTime() });
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('msgInput').style.display = 'none';
                document.getElementById('voiceRecBar').style.display = 'flex';
                let elapsed = 0;
                const interval = setInterval(() => {
                    if (!isRecording) { clearInterval(interval); return; }
                    elapsed += 0.1;
                    document.getElementById('voiceWaveFill').style.width = Math.min(100, (elapsed / 60) * 100) + '%';
                }, 100);
            })
            .catch(() => showToast('Нет доступа к микрофону'));
    }

    function cancelVoiceRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('voiceRecBar').style.display = 'none';
            document.getElementById('msgInput').style.display = 'block';
        }
    }

                chat.members = chat.members.filter(m => m !== currentUser);

        document.getElementById('burgerBtn').onclick = () => document.getElementById('contentPanel').classList.toggle('open');
        document.getElementById('emojiBtn').onclick = showEmojiPicker;
        document.getElementById('attachBtn').onclick = () => { const input = document.createElement('input'); input.type = 'file'; input.onchange = (e) => e.target.files[0] && sendFile(e.target.files[0]); input.click(); };
        document.getElementById('voiceBtn').onclick = startVoiceRecording;
        document.getElementById('cancelVoiceBtn').onclick = cancelVoiceRecording;
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('cancelReplyBtn').onclick = () => { replyTo = null; document.getElementById('replyIndicator').innerHTML = '<span></span><button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>'; };
        document.getElementById('msgInput').addEventListener('keypress', (e) => e.key === 'Enter' && sendMessage());
        document.getElementById('chatMenuBtn').onclick = (e) => { e.stopPropagation(); showChatMenu(); };
        document.getElementById('chatHeader').onclick = async () => {
            const chat = allChats.find(c => c.id === currentChat);
            if (!chat || currentChat === 'favorites') return showToast('Избранное — личные заметки');
            if (chat.isChannel) {
                window.showChannelProfile(chat.id);
            } else if (chat.isGroup) {
                window.showGroupProfile(chat.id);
            } else {
                const otherUser = chat.members?.find(m => m !== currentUser);
                if (otherUser) window.showUserProfile(otherUser);
                else showToast('Профиль чата');
            }
        };

        renderLeftPanelContent();
        loadMessages();
        socket.emit('join', currentChat);
    }

    const token = localStorage.getItem('authToken');
    if (token) {
        fetch('/auto-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    currentUser = data.login;
                    currentUserData = data.user;
                    startMessenger();
                } else renderAuth();
            })
            .catch(() => renderAuth());
    } else {
        renderAuth();
    }
</script>
</body>
</html>
