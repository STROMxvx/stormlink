<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .messenger {
            width: 1300px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        /* ПК-версия (по умолчанию) */
        .sidebar {
            width: 300px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
            transition: all 0.3s;
        }

        /* Мобильный режим (когда окно узкое или включена мобильная версия) */
        .mobile-mode .sidebar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            transform: translateX(-100%);
            z-index: 1000;
            border-radius: 0;
        }
        .mobile-mode .sidebar.open {
            transform: translateX(0);
        }
        .mobile-mode .burger-btn {
            display: block;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        .mobile-mode .messenger {
            border-radius: 0;
        }

        /* ПК-режим: бургер скрыт */
        .burger-btn {
            display: none;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.1);
            border-radius: 40px;
            cursor: pointer;
        }
        .user-info:hover { background: rgba(0,255,255,0.2); }
        .avatar {
            width: 48px;
            height: 48px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background-size: cover;
            background-position: center;
        }
        .search-player {
            background: rgba(0,255,255,0.05);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
        }
        .search-player input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }
        .search-player button {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
        }
        .chats-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .chat-item {
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .chat-item:hover { background: rgba(0,255,255,0.15); }
        .chat-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }
        .subgroup-item {
            margin-left: 28px;
            padding: 6px;
            font-size: 13px;
            border-radius: 16px;
            background: rgba(0,255,255,0.05);
            cursor: pointer;
            width: calc(100% - 28px);
        }
        .subgroup-item:hover { background: rgba(0,255,255,0.15); }
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(6,12,24,0.4);
        }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-title {
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 60%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            word-wrap: break-word;
            position: relative;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
            cursor: pointer;
            flex-shrink: 0;
        }
        .message-content { flex: 1; }
        .my-message {
            align-self: flex-end;
            background: #0af;
            color: black;
        }
        .message-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            justify-content: flex-end;
        }
        .message:hover .message-actions { display: flex; }
        .message-actions span {
            cursor: pointer;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 16px;
        }
        .message-actions span:hover { opacity: 1; background: cyan; color: black; }
        .chat-input {
            display: flex;
            padding: 16px;
            gap: 12px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 16px;
        }
        .chat-input button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #0af;
            padding: 0 12px;
            transition: 0.2s;
        }
        .chat-input button:hover { transform: scale(1.1); }
        .reply-indicator {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
        }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #0af;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322; border:2px solid #0af; border-radius:28px;
            padding:24px; width:320px; text-align:center;
        }
        .modal-box input, .modal-box textarea {
            width:100%; padding:10px; margin:12px 0; background:#010a1a;
            border:1px solid #0af; border-radius:40px; color:white;
        }
        .modal-buttons { display:flex; gap:12px; margin-top:16px; }
        .modal-buttons button { flex:1; padding:8px; background:#0af; border:none; border-radius:40px; cursor:pointer; }
        .profile-card {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0c1322; border: 2px solid #0af; border-radius: 28px;
            padding: 24px; width: 320px; z-index: 1001; text-align: center;
            max-height: 80vh; overflow-y: auto;
        }
        .profile-card button { margin-top: 12px; padding: 8px 16px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        .friends-list {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #0c1322; border: 2px solid #0af; border-radius: 28px;
            padding: 20px; width: 320px; z-index: 1001; text-align: center;
            max-height: 70vh; overflow-y: auto;
        }
        .friend-item {
            display: flex; align-items: center; gap: 12px; padding: 8px;
            border-radius: 20px; background: rgba(0,255,255,0.05); margin-bottom: 8px; cursor: pointer;
        }
        .friend-item:hover { background: rgba(0,255,255,0.2); }
        .emoji-picker {
            display: flex; gap: 8px; flex-wrap: wrap;
            justify-content: center; margin: 12px 0; font-size: 28px;
        }
        .emoji-option { cursor: pointer; padding: 4px 8px; border-radius: 12px; }
        .emoji-option:hover { background: #0af; }
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: cyan;
            margin-right: 8px;
        }
        /* Автоматическое переключение при узком окне */
        @media (max-width: 768px) {
            body.mobile-auto .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 280px;
                transform: translateX(-100%);
                z-index: 1000;
            }
            body.mobile-auto .sidebar.open {
                transform: translateX(0);
            }
            body.mobile-auto .burger-btn {
                display: block;
            }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let subgroups = JSON.parse(localStorage.getItem('subgroups') || '{}');
    let friends = JSON.parse(localStorage.getItem('friends') || '{}');
    let replyTo = null;
    let isMobileMode = false;

    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveSubgroups() { localStorage.setItem('subgroups', JSON.stringify(subgroups)); }
    function saveFriends() { localStorage.setItem('friends', JSON.stringify(friends)); }

    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }

    function toggleMobileMode() {
        const body = document.body;
        isMobileMode = !isMobileMode;
        if (isMobileMode) {
            body.classList.add('mobile-mode');
            body.classList.remove('mobile-auto');
            document.getElementById('modeToggleBtn').innerHTML = '🖥️';
        } else {
            body.classList.remove('mobile-mode');
            body.classList.add('mobile-auto');
            document.getElementById('modeToggleBtn').innerHTML = '📱';
            // Закрываем сайдбар при выходе из мобильного режима
            const sidebar = document.querySelector('.sidebar');
            if (sidebar) sidebar.classList.remove('open');
        }
        localStorage.setItem('mobileMode', isMobileMode);
    }

    function toggleSidebar() {
        const sidebar = document.querySelector('.sidebar');
        if (sidebar) sidebar.classList.toggle('open');
    }

    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn">Вход</button>
                        <button id="showRegBtn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `<input type="text" id="login" placeholder="Логин"><input type="password" id="password" placeholder="Пароль"><button id="doLogin">Войти</button>`;
        document.getElementById('doLogin').onclick = async () => {
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('password').value }) });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { currentUser = data.login; currentUserData = data.user; startMessenger(); }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `<input type="text" id="regLogin" placeholder="Логин"><input type="password" id="regPassword" placeholder="Пароль"><input type="text" id="regName" placeholder="Имя"><input type="text" id="regSurname" placeholder="Фамилия"><input type="date" id="regBirthdate"><textarea id="regAbout" rows="2" placeholder="О себе"></textarea><button id="doReg">Зарегистрироваться</button>`;
        document.getElementById('doReg').onclick = async () => {
            const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: document.getElementById('regLogin').value, password: document.getElementById('regPassword').value, name: document.getElementById('regName').value, surname: document.getElementById('regSurname').value, birthdate: document.getElementById('regBirthdate').value, about: document.getElementById('regAbout').value, favoriteGames: [] }) });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { alert('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    function getAvatarForUser(login) {
        const avatar = userAvatars[login];
        if (avatar) return `<div class="message-avatar" style="background-image:url(${avatar}); background-size:cover;"></div>`;
        return `<div class="message-avatar">⚡</div>`;
    }

    function showUserProfile(login) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { alert('Пользователь не найден'); return; }
                const avatar = userAvatars[login] || null;
                const isFriend = friends[currentUser] && friends[currentUser].includes(login);
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="profile-card">
                        <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div>
                        <h2>${data.name || login} ${data.surname || ''}</h2>
                        <p>@${data.login}</p>
                        <hr style="margin:12px 0;">
                        <div><strong>📅 Дата рождения:</strong> ${data.birthdate || 'не указана'}</div>
                        <div><strong>📝 О себе:</strong> ${data.about || 'не указано'}</div>
                        <button id="friendBtn">${isFriend ? '❌ Удалить из друзей' : '➕ Добавить в друзья'}</button>
                        <button id="msgBtn">💬 Написать сообщение</button>
                        <button id="closeBtn">Закрыть</button>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.querySelector('#friendBtn').onclick = () => {
                    if (!friends[currentUser]) friends[currentUser] = [];
                    if (isFriend) {
                        friends[currentUser] = friends[currentUser].filter(f => f !== login);
                        alert('Удалён из друзей');
                    } else {
                        friends[currentUser].push(login);
                        alert('Добавлен в друзья');
                    }
                    saveFriends();
                    modal.remove();
                };
                modal.querySelector('#msgBtn').onclick = () => {
                    const chatId = `chat_${Date.now()}`;
                    allChats.push({ id: chatId, name: login, avatar: '💬', members: [currentUser, login] });
                    messagesData[chatId] = [];
                    renderChats();
                    currentChat = chatId;
                    currentChatName = login;
                    document.getElementById('chatTitle').innerText = login;
                    renderMessages();
                    socket.emit('join', currentChat);
                    modal.remove();
                };
                modal.querySelector('#closeBtn').onclick = () => modal.remove();
            });
    }

    function showFriendsList() {
        const userFriends = friends[currentUser] || [];
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="friends-list"><h3>👥 Друзья</h3><div id="friendsContainer"></div><button id="closeFriends">Закрыть</button></div>`;
        document.body.appendChild(modal);
        const container = modal.querySelector('#friendsContainer');
        if (userFriends.length === 0) container.innerHTML = '<p>Нет друзей</p>';
        else {
            userFriends.forEach(login => {
                const div = document.createElement('div');
                div.className = 'friend-item';
                const avatar = userAvatars[login] || null;
                div.innerHTML = `<div class="avatar" style="width:36px; height:36px; font-size:18px; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div><div><strong>${login}</strong><br>@${login}</div>`;
                div.onclick = () => { modal.remove(); showUserProfile(login); };
                container.appendChild(div);
            });
        }
        modal.querySelector('#closeFriends').onclick = () => modal.remove();
    }

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        const msgs = messagesData[currentChat] || [];
        if (msgs.length === 0) {
            container.innerHTML = '<div style="text-align:center; opacity:0.5;">💬 Начните общение</div>';
            return;
        }
        container.innerHTML = msgs.map((msg, idx) => {
            const avatarHtml = getAvatarForUser(msg.from);
            return `
                <div class="message ${msg.from === currentUser ? 'my-message' : ''}" data-msg-idx="${idx}">
                    <div class="message-avatar" onclick="showUserProfile('${msg.from}')">${avatarHtml}</div>
                    <div class="message-content">
                        <strong>${msg.from}:</strong> ${msg.text}<br>
                        <small>${msg.time}</small>
                        <div class="message-actions">
                            <span class="reply-action">↩️ Ответить</span>
                            <span class="forward-action">📤 Переслать</span>
                            ${msg.from === currentUser ? '<span class="delete-action">🗑️ Удалить</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        document.querySelectorAll('.reply-action').forEach(el => {
            el.onclick = (e) => {
                const msgDiv = el.closest('.message');
                const idx = msgDiv.dataset.msgIdx;
                const msg = msgs[idx];
                if (msg) {
                    replyTo = { text: msg.text, from: msg.from };
                    document.getElementById('msgInput').focus();
                    const indicator = document.getElementById('replyIndicator');
                    if (indicator) indicator.innerText = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0, 40)}"`;
                }
            };
        });
        document.querySelectorAll('.forward-action').forEach(el => { el.onclick = () => alert('Пересылка в разработке'); });
        document.querySelectorAll('.delete-action').forEach(el => {
            el.onclick = () => {
                const msgDiv = el.closest('.message');
                const idx = msgDiv.dataset.msgIdx;
                const msg = msgs[idx];
                if (msg && msg.from === currentUser && confirm('Удалить сообщение?')) {
                    socket.emit('deleteMessage', { chatId: currentChat, messageIndex: idx });
                }
            };
        });
        container.scrollTop = container.scrollHeight;
    }

    function showProfile() {
        const avatarUrl = userAvatars[currentUser] || null;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                <h2>${currentUserData?.name || currentUser} ${currentUserData?.surname || ''}</h2>
                <p>@${currentUser}</p>
                <hr style="margin:12px 0;">
                <div><strong>📝 О себе:</strong> ${currentUserData?.about || 'не указано'}</div>
                <div><strong>📅 Дата рождения:</strong> ${currentUserData?.birthdate || 'не указана'}</div>
                <button id="editProfileBtn">✏️ Редактировать</button>
                <button id="changeLoginBtn">✏️ Сменить логин</button>
                <button id="closeProfileBtn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#editProfileBtn').onclick = () => { modal.remove(); showEditProfileModal(); };
        modal.querySelector('#changeLoginBtn').onclick = () => { modal.remove(); showChangeLoginModal(); };
        modal.querySelector('#closeProfileBtn').onclick = () => modal.remove();
    }

    function showEditProfileModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        const avatarUrl = userAvatars[currentUser] || null;
        modal.innerHTML = `
            <div class="modal-box">
                <h3>✏️ Редактировать профиль</h3>
                <div style="display:flex; justify-content:center; margin:10px;"><div id="avatarPreview" class="avatar" style="width:80px; height:80px; font-size:40px; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div></div>
                <button id="changeAvatarBtn">📷 Сменить фото</button>
                <input type="text" id="editName" placeholder="Имя" value="${currentUserData?.name || ''}">
                <input type="text" id="editSurname" placeholder="Фамилия" value="${currentUserData?.surname || ''}">
                <input type="date" id="editBirthdate" value="${currentUserData?.birthdate || ''}">
                <textarea id="editAbout" rows="3" placeholder="О себе">${currentUserData?.about || ''}</textarea>
                <div class="modal-buttons"><button id="saveProfileBtn">💾 Сохранить</button><button id="cancelEditBtn">Отмена</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#changeAvatarBtn').onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file && file.size <= 4*1024*1024) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        userAvatars[currentUser] = ev.target.result;
                        saveAvatars();
                        const preview = modal.querySelector('#avatarPreview');
                        preview.style.backgroundImage = `url(${ev.target.result})`;
                        preview.style.backgroundSize = 'cover';
                        preview.innerHTML = '';
                    };
                    reader.readAsDataURL(file);
                } else alert('Файл больше 4 МБ');
            };
            input.click();
        };
        modal.querySelector('#saveProfileBtn').onclick = async () => {
            const updatedData = { name: modal.querySelector('#editName').value, surname: modal.querySelector('#editSurname').value, birthdate: modal.querySelector('#editBirthdate').value, about: modal.querySelector('#editAbout').value };
            currentUserData = { ...currentUserData, ...updatedData };
            await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: currentUser, ...updatedData }) });
            alert('Профиль обновлен');
            modal.remove();
        };
        modal.querySelector('#cancelEditBtn').onclick = () => modal.remove();
    }

    function showChangeLoginModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-box"><h3>Сменить логин</h3><input type="text" id="newLogin" placeholder="Новый логин" value="${currentUser}"><div class="modal-buttons"><button id="saveLoginBtn">Сохранить</button><button id="cancelLoginBtn">Отмена</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#saveLoginBtn').onclick = async () => {
            const newLogin = modal.querySelector('#newLogin').value.trim();
            if (!newLogin) return alert('Введите логин');
            const res = await fetch('/change-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ oldLogin: currentUser, newLogin }) });
            const data = await res.json();
            if (data.success) { alert('Логин изменён! Перезагрузка'); location.reload(); }
            else alert(data.error);
        };
        modal.querySelector('#cancelLoginBtn').onclick = () => modal.remove();
    }

    function showEmojiPicker() {
        const emojis = ['😀','😂','😍','😎','🔥','⭐','🎮','⚡','💀','❤️','👍'];
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-box"><h3>Эмодзи</h3><div class="emoji-picker" id="emojiGrid"></div><button id="closeEmoji">Закрыть</button></div>`;
        document.body.appendChild(modal);
        const grid = modal.querySelector('#emojiGrid');
        emojis.forEach(emoji => {
            const span = document.createElement('span');
            span.className = 'emoji-option';
            span.innerText = emoji;
            span.onclick = () => {
                const input = document.getElementById('msgInput');
                input.value += emoji;
                modal.remove();
            };
            grid.appendChild(span);
        });
        modal.querySelector('#closeEmoji').onclick = () => modal.remove();
    }

    function showAddSubgroupModal(groupId, groupName) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-box">
                <h3>➕ Добавить подгруппу в "${groupName}"</h3>
                <input type="text" id="subgroupName" placeholder="Название подгруппы">
                <input type="text" id="subgroupAvatar" placeholder="Аватар (эмодзи)" value="📌">
                <div class="modal-buttons">
                    <button id="confirmCreate">Создать</button>
                    <button id="cancelCreate">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#confirmCreate').onclick = () => {
            const name = modal.querySelector('#subgroupName').value.trim();
            const avatar = modal.querySelector('#subgroupAvatar').value.trim() || '📌';
            if (!name) return alert('Введите название');
            if (!subgroups[groupId]) subgroups[groupId] = [];
            subgroups[groupId].push({ id: Date.now(), name: name, avatar: avatar });
            saveSubgroups();
            renderChats();
            modal.remove();
            alert(`Подгруппа "${name}" создана`);
        };
        modal.querySelector('#cancelCreate').onclick = () => modal.remove();
    }

    function showCreateGroupModal() {
        let selectedEmoji = '👥';
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-box">
                <h3>👥 Создать группу</h3>
                <div class="emoji-picker">
                    <span class="emoji-option">👥</span><span class="emoji-option">🎮</span><span class="emoji-option">🔥</span>
                    <span class="emoji-option">⭐</span><span class="emoji-option">💬</span>
                </div>
                <input type="text" id="groupName" placeholder="Название группы">
                <input type="text" id="groupLogin" placeholder="@логин_группы">
                <input type="text" id="groupTheme" placeholder="Тематика">
                <div class="modal-buttons">
                    <button id="confirmCreate">Создать</button>
                    <button id="cancelCreate">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        document.querySelectorAll('.emoji-option').forEach(el => { el.onclick = () => selectedEmoji = el.innerText; });
        modal.querySelector('#confirmCreate').onclick = async () => {
            const name = modal.querySelector('#groupName').value.trim();
            const login = modal.querySelector('#groupLogin').value.trim().replace('@', '');
            if (!name) return alert('Введите название');
            await fetch('/create-chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, avatar: selectedEmoji, theme: modal.querySelector('#groupTheme').value, creator: currentUser, members: [currentUser], login: login, isGroup: true }) });
            await loadChats();
            renderChats();
            modal.remove();
            alert(`Группа "${name}" создана`);
        };
        modal.querySelector('#cancelCreate').onclick = () => modal.remove();
    }

    function showCreateChannelModal() {
        let selectedEmoji = '📢';
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-box">
                <h3>📢 Создать канал</h3>
                <div class="emoji-picker">
                    <span class="emoji-option">📢</span><span class="emoji-option">🎮</span><span class="emoji-option">🔥</span>
                    <span class="emoji-option">⭐</span><span class="emoji-option">💬</span>
                </div>
                <input type="text" id="channelName" placeholder="Название канала">
                <input type="text" id="channelLogin" placeholder="@логин_канала">
                <input type="text" id="channelTheme" placeholder="Тематика">
                <div class="modal-buttons">
                    <button id="confirmCreate">Создать</button>
                    <button id="cancelCreate">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        document.querySelectorAll('.emoji-option').forEach(el => { el.onclick = () => selectedEmoji = el.innerText; });
        modal.querySelector('#confirmCreate').onclick = async () => {
            const name = modal.querySelector('#channelName').value.trim();
            const login = modal.querySelector('#channelLogin').value.trim().replace('@', '');
            if (!name) return alert('Введите название');
            await fetch('/create-chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, avatar: selectedEmoji, theme: modal.querySelector('#channelTheme').value, creator: currentUser, members: [currentUser], login: login, isChannel: true }) });
            await loadChats();
            renderChats();
            modal.remove();
            alert(`Канал "${name}" создан`);
        };
        modal.querySelector('#cancelCreate').onclick = () => modal.remove();
    }

    function showChatMenu() {
        const menu = document.createElement('div');
        menu.className = 'chat-menu';
        const isMuted = mutedChats[currentChat];
        const isFavorites = currentChat === 'favorites';
        const currentChatObj = allChats.find(c => c.id === currentChat);
        const isGroup = currentChatObj?.isGroup === true;
        const isCreator = isGroup && currentChatObj?.creator === currentUser;
        let html = `<div id="menuClear">🧹 Очистить чат</div>`;
        if (isGroup && isCreator) html += `<div id="menuAddSubgroup">➕ Добавить подгруппу</div>`;
        html += `<div id="menuSearch">🔍 Поиск</div><div id="menuNotifications">${isMuted ? '🔔 Вкл уведомления' : '🔕 Выкл уведомления'}</div>`;
        if (!isFavorites) html += `<div id="menuDelete">🗑 Удалить</div>`;
        menu.innerHTML = html;
        document.body.appendChild(menu);
        const rect = document.querySelector('.chat-header-dots').getBoundingClientRect();
        menu.style.position = 'fixed'; menu.style.background = '#0a1428'; menu.style.border = '1px solid #0af'; menu.style.borderRadius = '16px'; menu.style.padding = '8px'; menu.style.zIndex = '200';
        menu.style.left = rect.left - 120 + 'px'; menu.style.top = rect.bottom + 5 + 'px';
        menu.querySelector('#menuClear').onclick = () => { if (confirm(`Очистить чат "${currentChatName}"?`)) { if (messagesData[currentChat]) messagesData[currentChat] = []; if (currentChat === currentChat) renderMessages(); } menu.remove(); };
        if (isGroup && isCreator && menu.querySelector('#menuAddSubgroup')) menu.querySelector('#menuAddSubgroup').onclick = () => { showAddSubgroupModal(currentChat, currentChatName); menu.remove(); };
        menu.querySelector('#menuSearch').onclick = () => { alert('Поиск сообщений в разработке'); menu.remove(); };
        menu.querySelector('#menuNotifications').onclick = () => {
            if (mutedChats[currentChat]) delete mutedChats[currentChat]; else mutedChats[currentChat] = true;
            saveMuted(); renderChats(); menu.remove();
        };
        if (!isFavorites && menu.querySelector('#menuDelete')) menu.querySelector('#menuDelete').onclick = () => { deleteChat(currentChat, currentChatName); menu.remove(); };
        setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 10);
    }

    function deleteChat(chatId, chatName) {
        if (chatId === 'favorites') { alert('Избранное нельзя удалить'); return; }
        if (confirm(`Удалить чат "${chatName}"?`)) {
            allChats = allChats.filter(c => c.id !== chatId);
            delete messagesData[chatId];
            delete subgroups[chatId];
            saveSubgroups();
            renderChats();
            if (currentChat === chatId) { currentChat = 'favorites'; currentChatName = 'Избранное'; document.getElementById('chatTitle').innerText = 'Избранное'; renderMessages(); socket.emit('join', currentChat); }
        }
    }

    async function startMessenger() {
        await loadChats();
        socket = io();
        socket.on('newMessage', (msg) => {
            if (!messagesData[currentChat]) messagesData[currentChat] = [];
            messagesData[currentChat].push(msg);
            renderMessages();
            if (!mutedChats[currentChat] && msg.from !== currentUser) {
                const audio = new Audio('/sounds/notifica.mp3');
                audio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
                document.title = '🔔 Новое сообщение';
                setTimeout(() => document.title = 'StormLink', 3000);
            }
        });
        socket.on('messageDeleted', ({ chatId, messageIndex }) => {
            if (messagesData[chatId]) { messagesData[chatId].splice(messageIndex, 1); if (chatId === currentChat) renderMessages(); }
        });
        document.getElementById('app').innerHTML = `
            <button class="burger-btn" id="burgerBtn">☰</button>
            <div class="messenger">
                <div class="sidebar" id="sidebar">
                    <div class="user-info" id="profileBtn">
                        <div id="userAvatar" class="avatar">⚡</div>
                        <div><strong>${currentUser}</strong></div>
                    </div>
                    <div class="search-player">
                        <input type="text" id="chatSearchInput" placeholder="Поиск чатов...">
                        <button id="searchBtn">🔍</button>
                    </div>
                    <div class="chats-list" id="chatsList"></div>
                    <div class="add-btn" id="createGroupBtn">👥 Создать группу</div>
                    <div class="add-btn" id="createChannelBtn">📢 Создать канал</div>
                </div>
                <div class="chat-area">
                    <div class="chat-header">
                        <span class="chat-title" id="chatTitle">${currentChatName}</span>
                        <div>
                            <button class="icon-btn" id="modeToggleBtn" onclick="toggleMobileMode()">📱</button>
                            <button class="chat-header-dots" id="headerDotsBtn">⋯</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="messagesList"></div>
                    <div id="replyIndicator" style="padding:0 16px; font-size:12px; opacity:0.7;"></div>
                    <div class="chat-input">
                        <button id="emojiBtn">😀</button>
                        <button id="attachBtn">📎</button>
                        <input type="text" id="msgInput" placeholder="Введите сообщение...">
                        <button id="sendBtn">➤</button>
                    </div>
                </div>
            </div>
            <button class="friends-icon" id="friendsIcon">👥</button>
        `;
        if (userAvatars[currentUser]) {
            const avatarDiv = document.getElementById('userAvatar');
            avatarDiv.style.backgroundImage = `url(${userAvatars[currentUser]})`;
            avatarDiv.style.backgroundSize = 'cover';
            avatarDiv.innerHTML = '';
        }
        renderChats();
        renderMessages();
        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (replyTo) {
                text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`;
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
            }
            if (text) {
                socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text, time: getFormattedTime() });
                input.value = '';
            }
        };
        document.getElementById('msgInput').addEventListener('input', (e) => {});
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('sendBtn').click(); } });
        document.getElementById('profileBtn').onclick = showProfile;
        document.getElementById('createGroupBtn').onclick = showCreateGroupModal;
        document.getElementById('createChannelBtn').onclick = showCreateChannelModal;
        document.getElementById('headerDotsBtn').onclick = showChatMenu;
        document.getElementById('emojiBtn').onclick = showEmojiPicker;
        document.getElementById('attachBtn').onclick = () => alert('Файлы в разработке');
        document.getElementById('searchBtn').onclick = () => filterChats();
        document.getElementById('chatSearchInput').oninput = () => filterChats();
        document.getElementById('chatTitle').onclick = () => alert(`Профиль чата: ${currentChatName}`);
        document.getElementById('friendsIcon').onclick = showFriendsList;
        document.getElementById('burgerBtn').onclick = () => {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        };
        // Восстанавливаем сохранённый режим
        const savedMode = localStorage.getItem('mobileMode');
        if (savedMode === 'true') {
            isMobileMode = true;
            document.body.classList.add('mobile-mode');
            document.body.classList.remove('mobile-auto');
            document.getElementById('modeToggleBtn').innerHTML = '🖥️';
        } else if (window.innerWidth <= 768) {
            document.body.classList.add('mobile-auto');
        } else {
            document.body.classList.add('mobile-auto');
        }
        socket.emit('join', currentChat);
    }

    function filterChats() {
        const query = document.getElementById('chatSearchInput')?.value.toLowerCase() || '';
        const container = document.getElementById('chatsList');
        if (!container) return;
        const items = container.querySelectorAll('.chat-item');
        items.forEach(item => {
            const name = item.querySelector('.chat-info span:last-child')?.innerText.toLowerCase() || '';
            item.style.display = name.includes(query) || query === '' ? 'flex' : 'none';
        });
    }

    async function loadChats() {
        const res = await fetch('/chats');
        let chats = await res.json();
        allChats = chats.filter(c => c.name !== 'Новости ST_Link' && !deletedChats.includes(c.id));
        if (!allChats.find(c => c.id === 'favorites')) allChats.unshift({ id: 'favorites', name: 'Избранное', avatar: '⭐', isPrivate: true });
    }

    function renderChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        container.innerHTML = '';
        allChats.forEach(chat => {
            const isMuted = mutedChats[chat.id];
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="chat-info"><span>${chat.avatar || '💬'}</span><span>${chat.name} ${isMuted ? '🔇' : ''}</span></div>`;
            div.onclick = () => {
                currentChat = chat.id;
                currentChatName = chat.name;
                document.getElementById('chatTitle').innerText = chat.name;
                loadMessages();
                socket.emit('join', chat.id);
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
            };
            container.appendChild(div);
            if (subgroups[chat.id] && subgroups[chat.id].length > 0) {
                subgroups[chat.id].forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'subgroup-item';
                    subDiv.innerHTML = `<div class="chat-info"><span>${sub.avatar || '📌'}</span><span>${sub.name}</span></div>`;
                    subDiv.onclick = (e) => {
                        e.stopPropagation();
                        currentChat = `sub_${sub.id}`;
                        currentChatName = sub.name;
                        document.getElementById('chatTitle').innerText = sub.name;
                        if (!messagesData[currentChat]) messagesData[currentChat] = [];
                        renderMessages();
                        socket.emit('join', currentChat);
                    };
                    container.appendChild(subDiv);
                });
            }
        });
        filterChats();
    }

    async function loadMessages() {
        const res = await fetch(`/messages/${currentChat}`);
        messagesData[currentChat] = await res.json();
        renderMessages();
    }

    renderAuth();
</script>
</body>
</html>
