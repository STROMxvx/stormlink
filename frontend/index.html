<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .messenger {
            width: 1300px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        /* Левая панель с иконками */
        .icon-bar {
            width: 80px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
        }

        .icon-item {
            width: 50px;
            height: 50px;
            background: rgba(0,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-item:hover {
            background: rgba(0,255,255,0.3);
            transform: scale(1.05);
            box-shadow: 0 0 10px cyan;
        }

        .icon-item.active {
            background: #0af;
            color: black;
            box-shadow: 0 0 15px cyan;
        }

        /* Центральная область (списки) */
        .content-area {
            width: 350px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(0,255,255,0.3);
            background: rgba(2,8,18,0.5);
        }

        .search-header {
            padding: 16px;
            border-bottom: 1px solid #0af;
        }

        .search-header input {
            width: 100%;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
        }

        .content-header {
            padding: 12px 16px;
            border-bottom: 1px solid #0af;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background: rgba(0,255,255,0.05);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .list-item:hover {
            background: rgba(0,255,255,0.15);
            border: 1px solid #0af;
        }

        .list-avatar {
            width: 44px;
            height: 44px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
            background-position: center;
        }

        .list-info {
            flex: 1;
        }

        .list-title {
            font-size: 16px;
            font-weight: bold;
        }

        .list-sub {
            font-size: 11px;
            opacity: 0.6;
        }

        /* Правая область (чат) */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(6,12,24,0.4);
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }

        .chat-title {
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 70%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            background-size: cover;
            cursor: pointer;
        }

        .my-message {
            align-self: flex-end;
            background: #0af;
            color: black;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            border-top: 1px solid #0af;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
        }

        .chat-input button {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: #0af;
            padding: 0 10px;
        }

        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 340px;
            text-align: center;
        }

        .profile-card {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 320px;
            text-align: center;
        }

        .auth-btn {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
        }

        .member-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            border-bottom: 1px solid rgba(0,255,255,0.1);
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChatId = null;
    let currentChatName = '';
    let activeTab = 'profile';
    let allUsers = [];
    let allChannels = [];
    let allGroups = [];
    let messagesData = {};
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let friends = JSON.parse(localStorage.getItem('friends') || '{}');
    let joinedGroups = JSON.parse(localStorage.getItem('joinedGroups') || '[]');
    let subscribedChannels = JSON.parse(localStorage.getItem('subscribedChannels') || '[]');
    let replyTo = null;

    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveFriends() { localStorage.setItem('friends', JSON.stringify(friends)); }
    function saveJoinedGroups() { localStorage.setItem('joinedGroups', JSON.stringify(joinedGroups)); }
    function saveSubscribedChannels() { localStorage.setItem('subscribedChannels', JSON.stringify(subscribedChannels)); }

    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }

    function showToast(msg) { alert(msg); }

    // ========== ЗАГРУЗКА ДАННЫХ С СЕРВЕРА ==========
    async function loadUsers() {
        const res = await fetch('/users');
        const data = await res.json();
        allUsers = data.filter(u => u.login !== currentUser);
        renderList();
    }

    async function loadChannels() {
        const res = await fetch('/chats');
        const chats = await res.json();
        allChannels = chats.filter(c => c.isChannel === true);
        renderList();
    }

    async function loadGroups() {
        const res = await fetch('/chats');
        const chats = await res.json();
        allGroups = chats.filter(c => c.isGroup === true);
        renderList();
    }

    // ========== ОТРИСОВКА ЛЕВОГО СПИСКА ==========
    function renderList() {
        const container = document.getElementById('listContainer');
        const query = document.getElementById('searchInput')?.value.toLowerCase() || '';
        if (!container) return;

        if (activeTab === 'profile') {
            document.getElementById('contentTitle').innerText = 'Мой профиль';
            container.innerHTML = `
                <div class="list-item" onclick="showMyProfile()">
                    <div class="list-avatar" style="${userAvatars[currentUser] ? `background-image:url(${userAvatars[currentUser]}); background-size:cover;` : ''}">${!userAvatars[currentUser] ? '⚡' : ''}</div>
                    <div class="list-info"><div class="list-title">${currentUser}</div><div class="list-sub">Нажмите, чтобы открыть</div></div>
                </div>
            `;
            return;
        }

        let items = [];
        if (activeTab === 'users') {
            document.getElementById('contentTitle').innerText = 'Пользователи';
            items = allUsers.filter(u => !query || u.login.toLowerCase().includes(query));
            container.innerHTML = items.length ? items.map(u => `
                <div class="list-item" onclick="showUserProfile('${u.login}')">
                    <div class="list-avatar" style="${userAvatars[u.login] ? `background-image:url(${userAvatars[u.login]}); background-size:cover;` : ''}">${!userAvatars[u.login] ? '👤' : ''}</div>
                    <div class="list-info"><div class="list-title">${u.login}</div></div>
                </div>
            `).join('') : '<div class="empty-state">Нет пользователей</div>';
        } else if (activeTab === 'channels') {
            document.getElementById('contentTitle').innerText = 'Каналы';
            items = allChannels.filter(c => !query || c.name.toLowerCase().includes(query) || (c.login && c.login.toLowerCase().includes(query)));
            container.innerHTML = items.length ? items.map(c => `
                <div class="list-item" onclick="showChannelProfile('${c.id}')">
                    <div class="list-avatar" style="display:flex; align-items:center; justify-content:center;">${c.avatar || '📢'}</div>
                    <div class="list-info"><div class="list-title">${c.name}</div><div class="list-sub">@${c.login || ''}</div></div>
                </div>
            `).join('') : '<div class="empty-state">Нет каналов</div>';
        } else if (activeTab === 'groups') {
            document.getElementById('contentTitle').innerText = 'Группы';
            items = allGroups.filter(g => !query || g.name.toLowerCase().includes(query) || (g.login && g.login.toLowerCase().includes(query)));
            container.innerHTML = items.length ? items.map(g => `
                <div class="list-item" onclick="showGroupProfile('${g.id}')">
                    <div class="list-avatar" style="display:flex; align-items:center; justify-content:center;">${g.avatar || '👥'}</div>
                    <div class="list-info"><div class="list-title">${g.name}</div><div class="list-sub">@${g.login || ''}</div></div>
                </div>
            `).join('') : '<div class="empty-state">Нет групп</div>';
        }
    }

    // ========== ПРОФИЛИ ==========
    function showMyProfile() {
        const avatarUrl = userAvatars[currentUser] || null;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                <h2>${currentUser}</h2>
                <div><strong>📅 Дата рождения:</strong> ${currentUserData?.birthdate || 'не указана'}</div>
                <div><strong>📝 О себе:</strong> ${currentUserData?.about || 'не указано'}</div>
                <button id="editProfileBtn" class="auth-btn">✏️ Редактировать</button>
                <button id="closeProfileBtn" class="auth-btn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('editProfileBtn').onclick = () => { modal.remove(); showEditProfileModal(); };
        document.getElementById('closeProfileBtn').onclick = () => modal.remove();
    }

    function showEditProfileModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        const avatarUrl = userAvatars[currentUser] || null;
        modal.innerHTML = `
            <div class="modal-box">
                <h3>✏️ Редактировать профиль</h3>
                <div style="display:flex; justify-content:center; margin:10px;"><div id="avatarPreview" class="avatar" style="width:80px; height:80px; font-size:40px; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div></div>
                <button id="changeAvatarBtn" class="auth-btn">📷 Сменить фото</button>
                <input type="date" id="editBirthdate" value="${currentUserData?.birthdate || ''}">
                <textarea id="editAbout" rows="3" placeholder="О себе">${currentUserData?.about || ''}</textarea>
                <div class="modal-buttons"><button id="saveProfileBtn" class="auth-btn">💾 Сохранить</button><button id="cancelEditBtn" class="auth-btn">Отмена</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('changeAvatarBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file && file.size <= 4 * 1024 * 1024) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        userAvatars[currentUser] = ev.target.result;
                        saveAvatars();
                        const preview = document.getElementById('avatarPreview');
                        preview.style.backgroundImage = `url(${ev.target.result})`;
                        preview.style.backgroundSize = 'cover';
                        preview.innerHTML = '';
                        showToast('Фото обновлено');
                    };
                    reader.readAsDataURL(file);
                } else showToast('Файл больше 4 МБ');
            };
            input.click();
        };
        document.getElementById('saveProfileBtn').onclick = async () => {
            const updatedData = { birthdate: document.getElementById('editBirthdate').value, about: document.getElementById('editAbout').value };
            currentUserData = { ...currentUserData, ...updatedData };
            await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: currentUser, ...updatedData }) });
            showToast('Профиль обновлён');
            modal.remove();
        };
        document.getElementById('cancelEditBtn').onclick = () => modal.remove();
    }

    function showUserProfile(login) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { showToast('Пользователь не найден'); return; }
                const avatar = userAvatars[login] || null;
                const isFriend = friends[currentUser]?.includes(login);
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="profile-card">
                        <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div>
                        <h2>${data.login}</h2>
                        <div><strong>📅 Дата рождения:</strong> ${data.birthdate || 'не указана'}</div>
                        <div><strong>📝 О себе:</strong> ${data.about || 'не указано'}</div>
                        <button id="friendBtn" class="auth-btn">${isFriend ? '❌ Удалить из друзей' : '➕ Добавить в друзья'}</button>
                        <button id="msgBtn" class="auth-btn">💬 Написать сообщение</button>
                        <button id="closeBtn" class="auth-btn">Закрыть</button>
                    </div>
                `;
                document.body.appendChild(modal);
                document.getElementById('friendBtn').onclick = () => {
                    if (!friends[currentUser]) friends[currentUser] = [];
                    if (isFriend) friends[currentUser] = friends[currentUser].filter(f => f !== login);
                    else friends[currentUser].push(login);
                    saveFriends();
                    modal.remove();
                    showToast(isFriend ? 'Удалён из друзей' : 'Добавлен в друзья');
                };
                document.getElementById('msgBtn').onclick = () => {
                    startPrivateChat(login);
                    modal.remove();
                };
                document.getElementById('closeBtn').onclick = () => modal.remove();
            });
    }

    // ========== КАНАЛЫ И ГРУППЫ ==========
    function showChannelProfile(channelId) {
        const channel = allChannels.find(c => c.id == channelId);
        if (!channel) return;
        const isSubscribed = subscribedChannels.includes(channel.id);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div style="font-size:64px;">${channel.avatar || '📢'}</div>
                <h2>${channel.name}</h2>
                <p>@${channel.login}</p>
                <div><strong>🎮 Тематика:</strong> ${channel.theme || 'не указана'}</div>
                ${!isSubscribed ? '<button id="joinBtn" class="auth-btn">➕ Подписаться</button>' : '<button id="openBtn" class="auth-btn">💬 Открыть канал</button>'}
                <button id="closeBtn" class="auth-btn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        if (!isSubscribed) {
            document.getElementById('joinBtn').onclick = () => {
                subscribedChannels.push(channel.id);
                saveSubscribedChannels();
                showToast(`Вы подписались на канал ${channel.name}`);
                modal.remove();
                renderList();
            };
        } else {
            document.getElementById('openBtn').onclick = () => {
                openChat(`channel_${channel.id}`, channel.name);
                modal.remove();
            };
        }
        document.getElementById('closeBtn').onclick = () => modal.remove();
    }

    function showGroupProfile(groupId) {
        const group = allGroups.find(g => g.id == groupId);
        if (!group) return;
        const isJoined = joinedGroups.includes(group.id);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card" style="width:340px;">
                <div style="font-size:64px;">${group.avatar || '👥'}</div>
                <h2>${group.name}</h2>
                <p>@${group.login}</p>
                <div><strong>🎮 Тематика:</strong> ${group.theme || 'не указана'}</div>
                <div><strong>👥 Участники:</strong> ${group.members?.length || 0}</div>
                ${!isJoined ? '<button id="joinBtn" class="auth-btn">➕ Вступить</button>' : '<button id="openBtn" class="auth-btn">💬 Открыть чат</button>'}
                <button id="closeBtn" class="auth-btn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        if (!isJoined) {
            document.getElementById('joinBtn').onclick = () => {
                joinedGroups.push(group.id);
                saveJoinedGroups();
                showToast(`Вы вступили в группу ${group.name}`);
                modal.remove();
                renderList();
            };
        } else {
            document.getElementById('openBtn').onclick = () => {
                openChat(`group_${group.id}`, group.name);
                modal.remove();
            };
        }
        document.getElementById('closeBtn').onclick = () => modal.remove();
    }

    function startPrivateChat(login) {
        openChat(login, login);
    }

    function openChat(chatId, chatName) {
        currentChatId = chatId;
        currentChatName = chatName;
        if (!messagesData[currentChatId]) messagesData[currentChatId] = [];
        renderChatInterface();
        loadMessages();
        socket.emit('join', currentChatId);
    }

    function renderChatInterface() {
        const container = document.getElementById('chatContainer');
        if (!container) return;
        container.innerHTML = `
            <div class="chat-header">
                <span class="chat-title">${currentChatName}</span>
                <button class="chat-header-dots" style="background:none; border:none; color:cyan; font-size:28px; cursor:pointer;" id="chatMenuBtn">⋯</button>
            </div>
            <div class="chat-messages" id="messagesList"></div>
            <div id="replyIndicator" style="padding:0 16px; font-size:12px; display:flex; justify-content:space-between;">
                <span></span>
                <button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>
            </div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Введите сообщение...">
                <button id="sendMsgBtn">➤</button>
            </div>
        `;
        document.getElementById('sendMsgBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (replyTo) {
                text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`;
                replyTo = null;
                document.getElementById('replyIndicator').innerHTML = '<span></span><button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>';
            }
            if (text) {
                socket.emit('sendMessage', { chatId: currentChatId, from: currentUser, text, time: getFormattedTime() });
                input.value = '';
            }
        };
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('sendMsgBtn').click(); });
        document.getElementById('cancelReplyBtn')?.addEventListener('click', () => {
            replyTo = null;
            document.getElementById('replyIndicator').innerHTML = '<span></span><button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>';
        });
        document.getElementById('chatMenuBtn').onclick = () => alert('Меню чата (очистить, уведомления)');
    }

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        const msgs = messagesData[currentChatId] || [];
        if (msgs.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; opacity:0.5;">💬 Начните общение</div>';
            return;
        }
        container.innerHTML = msgs.map(msg => `
            <div class="message ${msg.from === currentUser ? 'my-message' : ''}">
                <div class="message-avatar" style="${userAvatars[msg.from] ? `background-image:url(${userAvatars[msg.from]}); background-size:cover;` : ''}">${!userAvatars[msg.from] ? '⚡' : ''}</div>
                <div class="message-content">
                    <strong>${msg.from}:</strong> ${msg.text}<br>
                    <small>${msg.time}</small>
                </div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }

    async function loadMessages() {
        const res = await fetch(`/messages/${currentChatId}`);
        messagesData[currentChatId] = await res.json();
        renderMessages();
    }

    // ========== АВТОРИЗАЦИЯ ==========
    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons"><button id="showLoginBtn" class="auth-btn">Вход</button><button id="showRegBtn" class="auth-btn">Регистрация</button></div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `<input type="text" id="login" placeholder="Логин"><input type="password" id="password" placeholder="Пароль"><button id="doLogin" class="auth-btn">Войти</button>`;
        document.getElementById('doLogin').onclick = async () => {
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('password').value }) });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { currentUser = data.login; currentUserData = data.user; startMessenger(); }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `<input type="text" id="regLogin" placeholder="Логин"><input type="password" id="regPassword" placeholder="Пароль"><input type="date" id="regBirthdate"><textarea id="regAbout" rows="2" placeholder="О себе"></textarea><button id="doReg" class="auth-btn">Зарегистрироваться</button>`;
        document.getElementById('doReg').onclick = async () => {
            const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: document.getElementById('regLogin').value, password: document.getElementById('regPassword').value, name: document.getElementById('regLogin').value, surname: '', birthdate: document.getElementById('regBirthdate').value, about: document.getElementById('regAbout').value, favoriteGames: [] }) });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { alert('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    async function startMessenger() {
        await loadUsers();
        await loadChannels();
        await loadGroups();
        socket = io();
        socket.on('newMessage', (msg) => {
            if (!messagesData[currentChatId]) messagesData[currentChatId] = [];
            messagesData[currentChatId].push(msg);
            if (currentChatId === msg.chatId) renderMessages();
        });
        document.getElementById('app').innerHTML = `
            <div class="messenger">
                <div class="icon-bar">
                    <div class="icon-item" id="tabProfile">👤</div>
                    <div class="icon-item" id="tabUsers">👥</div>
                    <div class="icon-item" id="tabChannels">📢</div>
                    <div class="icon-item" id="tabGroups">👥</div>
                </div>
                <div class="content-area">
                    <div class="search-header"><input type="text" id="searchInput" placeholder="Поиск..."></div>
                    <div class="content-header"><h3 id="contentTitle">Мой профиль</h3></div>
                    <div class="list-container" id="listContainer"></div>
                </div>
                <div class="chat-area" id="chatContainer">
                    <div style="display:flex; align-items:center; justify-content:center; height:100%; opacity:0.5;">Выберите чат</div>
                </div>
            </div>
        `;
        document.getElementById('tabProfile').onclick = () => { activeTab = 'profile'; renderList(); };
        document.getElementById('tabUsers').onclick = () => { activeTab = 'users'; renderList(); };
        document.getElementById('tabChannels').onclick = () => { activeTab = 'channels'; renderList(); };
        document.getElementById('tabGroups').onclick = () => { activeTab = 'groups'; renderList(); };
        document.getElementById('searchInput').addEventListener('input', () => renderList());
        renderList();
    }

    renderAuth();
</script>
</body>
</html>
