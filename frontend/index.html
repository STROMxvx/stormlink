<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            padding: 8px;
        }
        .messenger {
            width: 1400px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }
        .icon-bar {
            width: 80px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
            z-index: 10;
        }
        .icon-item {
            width: 50px;
            height: 50px;
            background: rgba(0,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .icon-item:hover { background: rgba(0,255,255,0.3); transform: scale(1.05); box-shadow: 0 0 10px cyan; }
        .icon-item.active { background: #0af; color: black; box-shadow: 0 0 15px cyan; }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #2ecc71;
            border-radius: 50%;
            border: 2px solid #0a0f1e;
            display: none;
        }
        .online-dot.online { display: block; }
        .content-panel {
            width: 340px;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }
        .search-header { padding: 16px; border-bottom: 1px solid #0af; }
        .search-header input {
            width: 100%;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .search-header input::placeholder { color: rgba(255,255,255,0.4); }
        .section-header {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(0,255,255,0.2);
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #0af;
        }
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .list-item {
            background: rgba(0,255,255,0.05);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .list-item:hover { background: rgba(0,255,255,0.15); border: 1px solid #0af; }
        .list-avatar {
            width: 44px;
            height: 44px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .list-info { flex: 1; }
        .list-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .list-sub { font-size: 11px; opacity: 0.6; }
        .unread-badge { background: #ff3333; border-radius: 20px; padding: 2px 8px; font-size: 10px; font-weight: bold; }
        .unread-badge.muted { background: #666; }
        .request-badge { background: #ff6600; border-radius: 20px; padding: 2px 8px; font-size: 10px; margin-left: 8px; }
        .empty-state { text-align: center; padding: 20px; opacity: 0.5; font-size: 13px; }
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            margin: 12px;
            font-size: 13px;
            transition: 0.2s;
        }
        .add-btn:hover { background: rgba(0,200,255,0.4); }
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: rgba(6,12,24,0.4); }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
            cursor: pointer;
        }
        .chat-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .chat-header-dots { background: none; border: none; color: cyan; font-size: 28px; cursor: pointer; padding: 4px 12px; }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-search-bar {
            position: sticky;
            top: 0;
            background: rgba(2,8,18,0.95);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            margin-bottom: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .chat-search-bar input {
            flex: 1;
            padding: 8px 16px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 13px;
        }
        .chat-search-bar input::placeholder { color: rgba(255,255,255,0.4); }
        .chat-search-nav { display: flex; gap: 8px; align-items: center; }
        .chat-search-nav button {
            background: #0af;
            border: none;
            border-radius: 20px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            color: black;
        }
        .message {
            max-width: 70%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            transition: 0.2s;
            position: relative;
        }
        .message.pinned { border: 2px solid #ffcc00; background: rgba(255,204,0,0.1); }
        .message.editing { background: rgba(255,100,0,0.3); border: 1px solid #ff6600; }
        .message.highlight { background: #ffcc00 !important; color: black !important; box-shadow: 0 0 10px #ffcc00; }
        .message.current-highlight { background: #ff9900 !important; color: black !important; box-shadow: 0 0 15px #ff9900; }
        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        .message-content { flex: 1; }
        .my-message { align-self: flex-end; background: #0af; color: black; }
        .pin-badge {
            position: absolute;
            top: -8px;
            right: 8px;
            background: #ffcc00;
            color: black;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 10px;
            font-weight: bold;
        }
        .message-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            font-size: 11px;
            justify-content: flex-end;
        }
        .message:hover .message-actions { display: flex; }
        .message-actions span {
            cursor: pointer;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 16px;
        }
        .message-actions span:hover { opacity: 1; background: cyan; color: black; }
        .edit-input {
            width: 100%;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 20px;
            padding: 6px 10px;
            color: white;
            outline: none;
            margin-top: 4px;
            font-size: 13px;
        }
        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .chat-input input::placeholder { color: rgba(255,255,255,0.4); }
        .chat-input button {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #0af;
            padding: 0 10px;
        }
        .reply-indicator {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
            margin: 0 16px;
        }
        .voice-recording {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            flex: 1;
        }
        .voice-wave { flex: 1; height: 30px; background: rgba(0,255,255,0.2); border-radius: 20px; overflow: hidden; }
        .voice-wave-fill { width: 0%; height: 100%; background: cyan; transition: width 0.1s linear; }
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 380px;
            max-width: 90%;
            text-align: center;
        }
        .modal-box input, .modal-box textarea, .modal-box select {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button, .auth-btn {
            flex: 1;
            padding: 12px;
            background: #0af;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .modal-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 20px;
            width: 260px;
            text-align: center;
            z-index: 2000;
        }
        .modal-toast h3 { font-size: 16px; margin-bottom: 12px; }
        .modal-confirm {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 300px;
            text-align: center;
            z-index: 2000;
        }
        .modal-confirm h3 { font-size: 16px; margin-bottom: 16px; }
        .modal-confirm-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
        .modal-confirm-buttons button { padding: 8px 20px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            max-width: 90%;
            text-align: center;
        }
        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .profile-card {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 340px;
            max-width: 90%;
            text-align: center;
        }
        .profile-card .avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            background-size: cover;
            background-position: center;
        }
        .member-list { max-height: 200px; overflow-y: auto; margin-top: 12px; text-align: left; }
        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px;
            border-radius: 20px;
            background: rgba(0,255,255,0.05);
            margin-bottom: 8px;
        }
        .member-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .member-role { font-size: 10px; background: #0af; border-radius: 12px; padding: 2px 8px; }
        .member-role.admin { background: #ff6600; }
        .member-role.owner { background: gold; color: black; }
        .member-actions button { background: none; border: none; cursor: pointer; font-size: 16px; margin-left: 8px; }
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .friend-request-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3333;
            color: white;
            border-radius: 50%;
            min-width: 22px;
            height: 22px;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0; font-size: 28px; }
        .emoji-option { cursor: pointer; padding: 4px 8px; border-radius: 12px; transition: 0.1s; }
        .emoji-option:hover { background: #0af; transform: scale(1.1); }
        .chat-menu {
            position: fixed;
            background: #0a1428;
            border: 1px solid #0af;
            border-radius: 16px;
            padding: 8px;
            z-index: 200;
        }
        .chat-menu div { padding: 8px 16px; cursor: pointer; border-radius: 12px; font-size: 13px; }
        .chat-menu div:hover { background: #0af; color: black; }
        .progress-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #0af; transition: width 0.1s; }
        .cancel-upload {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff3333;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        .prefix-input {
            display: flex;
            align-items: center;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 0 12px;
            margin: 12px 0;
        }
        .prefix-input span { color: #0af; font-size: 16px; font-weight: bold; margin-right: 4px; }
        .prefix-input input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
        .hidden-chats-section { border-top: 1px solid rgba(0,255,255,0.2); margin-top: 8px; }
        .hidden-chats-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #0af;
            font-size: 12px;
        }
        .hidden-chats-list { display: none; padding: 0 12px 12px 12px; flex-direction: column; gap: 8px; }
        .hidden-chats-list.show { display: flex; }
        .burger-btn {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        .mobile-back-btn { display: none; background: none; border: none; color: cyan; font-size: 24px; cursor: pointer; padding: 4px 12px; }
        @media (max-width: 768px) {
            body { padding: 0; }
            .messenger { width: 100%; height: 100vh; border-radius: 0; margin: 0; }
            .burger-btn { display: block; }
            .content-panel {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 85%;
                max-width: 300px;
                transform: translateX(-100%);
                z-index: 1000;
                background: rgba(2,8,18,0.98);
                transition: transform 0.2s ease;
                border-radius: 0;
            }
            .content-panel.open { transform: translateX(0); box-shadow: 2px 0 20px rgba(0,170,255,0.3); }
            .icon-bar {
                position: absolute;
                bottom: 80px;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                flex-direction: row;
                background: rgba(2,8,18,0.95);
                backdrop-filter: blur(10px);
                border-radius: 50px;
                padding: 8px 20px;
                gap: 20px;
                border: 1px solid #0af;
                z-index: 100;
            }
            .icon-item { width: 44px; height: 44px; font-size: 24px; }
            .chat-panel { width: 100%; }
            .mobile-back-btn { display: block; }
            .chat-header { padding-left: 60px; }
            .friends-icon { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 24px; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = null;
    let currentChatName = '';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let hiddenChats = JSON.parse(localStorage.getItem('hiddenChats') || '[]');
    let pinnedChats = JSON.parse(localStorage.getItem('pinnedChats') || '[]');
    let friends = [];
    let friendRequests = [];
    let sentFriendRequests = JSON.parse(localStorage.getItem('sentFriendRequests') || '[]');
    let groupJoinRequests = [];
    let groups = [];
    let channels = [];
    let replyTo = null;
    let mediaRecorder = null;
    let videoRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let isRecording = false;
    let isVideoRecording = false;
    let currentMatches = [];
    let currentMatchIndex = -1;
    let activeLeftTab = 'profile';
    let allUsersList = [];
    let unreadData = {};
    let onlineUsers = JSON.parse(localStorage.getItem('onlineUsers') || '{}');
    let editingMessage = null;
    let pinnedMessages = JSON.parse(localStorage.getItem('pinnedMessages') || '{}');
    let chatSettings = JSON.parse(localStorage.getItem('chatSettings') || '{}');
    let currentTheme = localStorage.getItem('currentTheme') || 'dark';
    let groupRoles = JSON.parse(localStorage.getItem('groupRoles') || '{}');
    let groupBlacklist = JSON.parse(localStorage.getItem('groupBlacklist') || '{}');
    let fileUploads = {};
    let offlineMessages = JSON.parse(localStorage.getItem('offlineMessages') || '{}');
    let currentVideoBlob = null;
    let currentVideoStream = null;
    let currentFacingMode = 'user';
    let typingTimeouts = {};
    let messageLoadPage = {};
    
    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveHiddenChats() { localStorage.setItem('hiddenChats', JSON.stringify(hiddenChats)); }
    function savePinnedChats() { localStorage.setItem('pinnedChats', JSON.stringify(pinnedChats)); }
    function saveSentFriendRequests() { localStorage.setItem('sentFriendRequests', JSON.stringify(sentFriendRequests)); }
    function saveOnlineUsers() { localStorage.setItem('onlineUsers', JSON.stringify(onlineUsers)); }
    function savePinnedMessages() { localStorage.setItem('pinnedMessages', JSON.stringify(pinnedMessages)); }
    function saveChatSettings() { localStorage.setItem('chatSettings', JSON.stringify(chatSettings)); }
    function saveGroupRoles() { localStorage.setItem('groupRoles', JSON.stringify(groupRoles)); }
    function saveGroupBlacklist() { localStorage.setItem('groupBlacklist', JSON.stringify(groupBlacklist)); }
    function saveOfflineMessages() { localStorage.setItem('offlineMessages', JSON.stringify(offlineMessages)); }
    
    function applyTheme() {
        const themesColors = {
            dark: { bg: 'radial-gradient(circle, #0a0f1e, #03050a)', border: '#0af', accent: '#0af', msgBg: 'rgba(0,255,255,0.1)' },
            light: { bg: 'radial-gradient(circle, #e0e0e0, #f5f5f5)', border: '#0af', accent: '#0af', msgBg: 'rgba(0,0,0,0.05)' },
            blue: { bg: 'radial-gradient(circle, #001a4a, #000a1a)', border: '#0af', accent: '#0af', msgBg: 'rgba(0,170,255,0.1)' },
            green: { bg: 'radial-gradient(circle, #0a2a1a, #031005)', border: '#0f0', accent: '#0f0', msgBg: 'rgba(0,255,0,0.1)' },
            purple: { bg: 'radial-gradient(circle, #2a0a3a, #150520)', border: '#a0a', accent: '#a0a', msgBg: 'rgba(170,0,170,0.1)' }
        };
        const theme = themesColors[currentTheme] || themesColors.dark;
        document.body.style.background = theme.bg;
        const msgDivs = document.querySelectorAll('.message:not(.my-message)');
        msgDivs.forEach(el => el.style.background = theme.msgBg);
    }
    
    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }
    
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.style.background = isError ? '#ff3333' : '#0c1322';
        toast.innerHTML = `<h3>${msg}</h3><button onclick="this.parentElement.remove()" class="auth-btn" style="background:#0af; border:none; padding:8px 16px; margin-top:8px;">OK</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function showConfirmDialog(title, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'modal-confirm';
        modal.innerHTML = `<h3>${title}</h3><div class="modal-confirm-buttons"><button id="confirmYes">Да</button><button id="confirmNo">Нет</button></div>`;
        document.body.appendChild(modal);
        document.getElementById('confirmYes').onclick = () => { onConfirm(); modal.remove(); };
        document.getElementById('confirmNo').onclick = () => modal.remove();
    }
    
    function showTypingIndicator(chatId, user) {
        const indicator = document.getElementById('typingIndicator');
        if (indicator && currentChat === chatId) {
            indicator.innerHTML = `✍️ ${user} печатает...`;
            indicator.style.display = 'block';
            clearTimeout(typingTimeouts[user]);
            typingTimeouts[user] = setTimeout(() => {
                if (indicator) indicator.style.display = 'none';
            }, 2000);
        }
    }

    function showLogin() {
        const authForm = document.getElementById('authForm');
        if (!authForm) return;
        authForm.innerHTML = `
            <input type="text" id="login" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">

            const data = await res.json();
            if (data.error) showToast(data.error, true);
            else { 
                currentUser = data.login; 
                currentUserData = data.user; 
                localStorage.setItem('authToken', data.user.token);
                startMessenger();

    function showRegister() {
        const authForm = document.getElementById('authForm');
        if (!authForm) return;
        authForm.innerHTML = `
            <input type="text" id="regLogin" placeholder="Логин">
            <input type="password" id="regPassword" placeholder="Пароль">

        // ========== ЗАГРУЗКА ДАННЫХ ==========
    async function loadAllData() {
        await Promise.all([
            fetch('/users').then(r => r.json()).then(data => { allUsersList = data.filter(u => u.login !== currentUser); }),
            fetch('/chats').then(r => r.json()).then(data => { 
                allChats = data; 
                groups = data.filter(c => c.isGroup === true); 
                channels = data.filter(c => c.isChannel === true); 
            }),
            fetch(`/friends/${currentUser}`).then(r => r.json()).then(data => { friends = data.friends || []; }),
            fetch(`/friend-requests/${currentUser}`).then(r => r.json()).then(data => { friendRequests = data.requests || []; }),
            fetch(`/group-requests/${currentUser}`).then(r => r.json()).then(data => { groupJoinRequests = data.requests || []; }),
            fetch(`/unread/${currentUser}`).then(r => r.json()).then(data => { unreadData = data.unread || {}; })
        ]);
        
        const favoritesId = `favorites_${currentUser}`;
        if (!allChats.find(c => c.id === favoritesId)) {
            allChats.unshift({ id: favoritesId, name: '⭐ Избранное', avatar: '⭐', isGroup: false, isChannel: false, members: [currentUser], isFavorites: true });
        }
        
        updateFriendRequestBadge();
        renderLeftPanelContent();
        renderJoinRequestsInMenu();
        applyTheme();
    }
    
    function updateFriendRequestBadge() {
        const friendIcon = document.getElementById('friendsIcon');
        if (!friendIcon) return;
        let badge = friendIcon.querySelector('.friend-request-count');
        const count = friendRequests.length;
        if (!badge) { 
            badge = document.createElement('div'); 
            badge.className = 'friend-request-count'; 
            friendIcon.appendChild(badge); 
        }
        if (count > 0) { 
            badge.innerText = count > 9 ? '9+' : count; 
            badge.style.display = 'flex'; 
        } else { 
            badge.style.display = 'none'; 
        }
    }
    
    function getUnreadCount(chatId) {
        const count = unreadData[chatId] || 0;
        const isMuted = mutedChats[chatId];
        if (count === 0) return '';
        return `<span class="unread-badge ${isMuted ? 'muted' : ''}">${count}</span>`;
    }

                    buttonHtml = `<button class="cancel-friend-request-btn" data-login="${u.login}" style="background:#ff6600; border:none; border-radius:20px; padding:4px 12px; margin-top:6px; cursor:pointer;">✖ Отменить</button>`;

                    buttonHtml = `<span class="request-badge" style="background:#0af;">✅ друг</span>`;
                }
                return `
                    <div class="list-item" data-login="${u.login}">
                        <div class="list-avatar" style="${userAvatars[u.login] ? `background-image:url(${userAvatars[u.login]}); background-size:cover;` : ''}">${!userAvatars[u.login] ? '👤' : ''}<div class="online-dot ${onlineUsers[u.login] ? 'online' : ''}"></div></div>

                    saveSentFriendRequests();
                    showToast(`📨 Заявка отправлена пользователю ${login}`);

    function renderPinnedChatsList(container, query) {
        const pinnedChatsList = allChats.filter(chat => pinnedChats.includes(chat.id) && !hiddenChats.includes(chat.id));
        if (pinnedChatsList.length === 0) {
            container.innerHTML += '<div class="empty-state" style="padding:8px;">Нет закреплённых</div>';
            return;
        }
        pinnedChatsList.forEach(chat => {
            renderChatItem(container, chat, query);
        });
    }
    
    function renderChatItem(container, chat, query, isHidden = false) {
        let displayName = chat.name;
        let avatar = chat.avatar || '💬';
        let subtitle = chat.isGroup ? 'Группа' : (chat.isChannel ? 'Канал' : 'Личный чат');
        
        if (chat.id === `favorites_${currentUser}`) {
            displayName = '⭐ Избранное';
            avatar = '⭐';
            subtitle = 'Личные заметки';
        } else if (!chat.isGroup && !chat.isChannel) {
            const otherUser = chat.members?.find(m => m !== currentUser);
            if (otherUser) {
                displayName = otherUser;
                subtitle = 'Личный чат';
                const otherAvatar = userAvatars[otherUser];
                if (otherAvatar) avatar = `<div class="list-avatar" style="background-image:url(${otherAvatar}); background-size:cover;"><div class="online-dot ${onlineUsers[otherUser] ? 'online' : ''}"></div></div>`;
                else avatar = `<div class="list-avatar">👤<div class="online-dot ${onlineUsers[otherUser] ? 'online' : ''}"></div></div>`;
            }
        }
        
        const unreadHtml = getUnreadCount(chat.id);
        const div = document.createElement('div');
        div.className = 'list-item';
        div.setAttribute('data-chat-id', chat.id);
        div.innerHTML = (typeof avatar === 'string' && avatar.startsWith('<')) ? avatar : `<div class="list-avatar" style="display:flex; align-items:center; justify-content:center;">${avatar}</div>`;
        div.innerHTML += `<div class="list-info"><div class="list-title">${displayName} ${unreadHtml}</div><div class="list-sub">${subtitle}</div></div>`;
        
        if (!isHidden && chat.id !== `favorites_${currentUser}` && !chat.isChannel && !chat.isGroup) {
            div.innerHTML += `<button class="hide-chat-btn" data-chat-id="${chat.id}" style="background:none; border:none; color:#666; cursor:pointer; font-size:16px; margin-left:8px;" title="Скрыть чат">📁</button>`;
        }
        
        if (!isHidden && chat.id !== `favorites_${currentUser}`) {
            const isPinned = pinnedChats.includes(chat.id);
            div.innerHTML += `<button class="pin-chat-btn" data-chat-id="${chat.id}" style="background:none; border:none; color:${isPinned ? '#ffcc00' : '#666'}; cursor:pointer; font-size:16px; margin-left:4px;" title="${isPinned ? 'Открепить' : 'Закрепить'}">📌</button>`;
        }
        
        div.onclick = (e) => {
            if (e.target.classList.contains('hide-chat-btn') || e.target.classList.contains('pin-chat-btn')) return;
            currentChat = chat.id;
            currentChatName = displayName;
            document.getElementById('chatTitle').innerHTML = `<span>${currentChatName}</span>`;
            loadMessages();
            socket.emit('join', currentChat);
            socket.emit('markRead', { chatId: currentChat, user: currentUser });
            unreadData[currentChat] = 0;
            renderLeftPanelContent();
            if (window.innerWidth <= 768) document.getElementById('contentPanel').classList.remove('open');
        };
        
        container.appendChild(div);
        
        const hideBtn = div.querySelector('.hide-chat-btn');
        if (hideBtn) {
            hideBtn.onclick = (e) => {
                e.stopPropagation();
                if (!hiddenChats.includes(chat.id)) {
                    hiddenChats.push(chat.id);
                    saveHiddenChats();
                    renderLeftPanelContent();
                    showToast(`📁 Чат "${displayName}" скрыт`);
                }
            };
        }
        
        const pinBtn = div.querySelector('.pin-chat-btn');
        if (pinBtn) {
            pinBtn.onclick = (e) => {
                e.stopPropagation();
                if (pinnedChats.includes(chat.id)) {
                    pinnedChats = pinnedChats.filter(id => id !== chat.id);
                    showToast(`📌 Чат "${displayName}" откреплён`);
                } else {
                    pinnedChats.unshift(chat.id);
                    showToast(`📌 Чат "${displayName}" закреплён`);
                }
                savePinnedChats();
                renderLeftPanelContent();
            };
        }
    }
    
    function renderChatsListInPanel(container, query, isHidden) {
        let myChats = allChats.filter(chat => {
            if (isHidden) return hiddenChats.includes(chat.id);
            if (hiddenChats.includes(chat.id)) return false;
            if (chat.id === `favorites_${currentUser}`) return true;
            if (chat.isGroup && chat.members?.includes(currentUser)) return true;
            if (chat.isChannel && chat.members?.includes(currentUser)) return true;
            if (!chat.isGroup && !chat.isChannel && chat.members?.includes(currentUser) && !deletedChats.includes(chat.id)) return true;
            return false;
        });
        
        if (!isHidden) {
            myChats = myChats.filter(chat => !pinnedChats.includes(chat.id));
        }
        
        const filteredChats = myChats.filter(chat => !query || chat.name.toLowerCase().includes(query));
        if (filteredChats.length === 0) {
            if (!isHidden) container.innerHTML += '<div class="empty-state">Нет чатов</div>';
            return;
        }
        filteredChats.forEach(chat => {
            renderChatItem(container, chat, query, isHidden);
        });
    }

    window.showUserProfile = function(login, parentModalToClose = null) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { showToast('❌ Пользователь не найден', true); return; }
                const avatar = userAvatars[login] || null;
                const isFriend = friends?.includes(login);
                const requestSent = friendRequests?.includes(login) || sentFriendRequests?.includes(login);
                const modalDiv = document.createElement('div');
                modalDiv.className = 'modal';
                modalDiv.innerHTML = `
                    <div class="profile-card">
                        <div class="avatar" style="${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '👤' : ''}</div>
                        <h2>${data.login} ${onlineUsers[login] ? '<span style="color:#2ecc71; font-size:14px;">● онлайн</span>' : ''}</h2>
                        <p><strong>📅 Дата рождения:</strong> ${data.birthdate || 'не указана'}</p>
                        <p><strong>📝 О себе:</strong> ${data.about || 'не указано'}</p>
                        <div style="display:flex; gap:10px; margin-top:16px;">
                            <button id="friendBtn" class="auth-btn" style="flex:1;">${isFriend ? '❌ Удалить из друзей' : (requestSent ? '⏳ Отменить заявку' : '➕ Добавить в друзья')}</button>
                            <button id="msgBtn" class="auth-btn" style="flex:1;">💬 Написать</button>
                        </div>
                        <button id="closeProfileBtn" class="auth-btn" style="margin-top:10px;">Закрыть</button>
                    </div>
                `;
                document.body.appendChild(modalDiv);
                
                document.getElementById('friendBtn').onclick = async () => {
                    if (isFriend) {
                        showToast('Удаление друга пока не реализовано');
                    } else if (requestSent) {
                        sentFriendRequests = sentFriendRequests.filter(r => r !== login);
                        saveSentFriendRequests();
                        showToast(`✖ Заявка пользователю ${login} отменена`);
                        modalDiv.remove();
                        if (parentModalToClose) parentModalToClose.remove();
                        await loadAllData();
                    } else {
                        await fetch('/add-friend', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ from: currentUser, to: login }) });
                        if (!sentFriendRequests.includes(login)) sentFriendRequests.push(login);
                        saveSentFriendRequests();
                        showToast(`📨 Заявка в друзья отправлена пользователю ${login}`);
                        modalDiv.remove();
                        if (parentModalToClose) parentModalToClose.remove();
                        await loadAllData();
                    }
                };
                
                document.getElementById('msgBtn').onclick = async () => {
                    let chat = allChats.find(c => c.members && c.members.includes(currentUser) && c.members.includes(login) && !c.isGroup && !c.isChannel);
                    if (!chat) {
                        const res = await fetch('/create-chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name: login, avatar: '💬', creator: currentUser, members: [currentUser, login], isGroup: false, isChannel: false }) });
                        const data = await res.json();
                        await loadAllData();
                        chat = allChats.find(c => c.id === data.chatId);
                    }
                    if (chat) {
                        currentChat = chat.id;
                        currentChatName = login;
                        document.getElementById('chatTitle').innerHTML = `<span>${currentChatName}</span>`;
                        loadMessages();
                        socket.emit('join', currentChat);
                        if (window.innerWidth <= 768) document.getElementById('contentPanel').classList.remove('open');
                    }
                    modalDiv.remove();
                    if (parentModalToClose) parentModalToClose.remove();
                };
                
                document.getElementById('closeProfileBtn').onclick = () => {
                    modalDiv.remove();
                    if (parentModalToClose) parentModalToClose.remove();
                };
            });
    };
    
    // ========== ПОКАЗ ПРОФИЛЯ ГРУППЫ ==========
    window.showGroupProfile = function(groupId) {
        const group = groups.find(g => g.id === groupId);
        if (!group) return;
        const isMember = group.members?.includes(currentUser);
        const userRole = groupRoles[groupId]?.[currentUser] || 'member';
        const isOwner = userRole === 'owner';
        const isAdmin = isOwner || userRole === 'admin';
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        
        const membersList = (group.members || []).filter(m => m !== currentUser).map(m => {
            const memberRole = groupRoles[groupId]?.[m] || 'member';
            return `
                <div class="member-item" data-member="${m}">
                    <div class="member-info" onclick="window.showUserProfile('${m}', this.closest('.modal'))">
                        <div class="list-avatar" style="width:36px; height:36px; ${userAvatars[m] ? `background-image:url(${userAvatars[m]}); background-size:cover;` : ''}">${!userAvatars[m] ? '👤' : ''}<div class="online-dot ${onlineUsers[m] ? 'online' : ''}"></div></div>

                    </div>
                    ${(isAdmin && m !== currentUser) ? `
                        <div class="member-actions">
                            <button class="kick-member" data-user="${m}" title="Исключить">🔨</button>
                            <button class="mute-member" data-user="${m}" title="Заглушить">🔇</button>
                            ${isOwner ? `<button class="make-admin" data-user="${m}" title="Назначить админом">⭐</button>` : ''}
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
        
        modalDiv.innerHTML = `
            <div class="profile-card" style="width:380px; max-width:90%;">
                <div style="font-size:64px;">${group.avatar || '👥'}</div>
                <h2>${group.name}</h2>
                <p>@${(group.login || group.id).replace(/^@+/, '')}</p>
                <p><strong>🎮 Тематика:</strong> ${group.theme || 'не указана'}</p>
                <p><strong>👥 Участники (${group.members?.length || 0}):</strong></p>
                <div class="member-list">${membersList || 'Нет других участников'}</div>
                ${!isMember ? '<button id="requestJoinBtn" class="auth-btn" style="margin-top:16px;">📨 Отправить запрос на вступление</button>' : ''}
                ${isOwner ? '<button id="deleteGroupBtn" class="auth-btn" style="margin-top:10px; background:#ff3333;">🗑️ Удалить группу</button>' : ''}
                <button id="closeGroupProfileBtn" class="auth-btn" style="margin-top:10px;">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modalDiv);
        
        if (!isMember) {
            document.getElementById('requestJoinBtn').onclick = async () => {
                await fetch('/request-group-join', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ groupId: group.id, fromUser: currentUser, toUser: group.creator }) });
                showToast(`📨 Запрос на вступление отправлен создателю группы ${group.creator}`);
                modalDiv.remove();
            };
        }
        
        if (isOwner) {
            document.getElementById('deleteGroupBtn').onclick = () => {
                showConfirmDialog(`Удалить группу "${group.name}"? Это действие необратимо!`, async () => {
                    await fetch('/delete-chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chatId: group.id, userId: currentUser }) });
                    await loadAllData();
                    if (currentChat === group.id) {
                        currentChat = `favorites_${currentUser}`;
                        currentChatName = 'Избранное';
                        document.getElementById('chatTitle').innerHTML = `<span>${currentChatName}</span>`;
                        loadMessages();
                        socket.emit('join', currentChat);
                    }
                    showToast(`🗑️ Группа "${group.name}" удалена`);
                    modalDiv.remove();
                });
            };
        }
        
        document.querySelectorAll('.kick-member').forEach(btn => {
            btn.onclick = () => {
                const user = btn.dataset.user;
                showConfirmDialog(`Исключить ${user} из группы?`, async () => {
                    if (group.members) {
                        group.members = group.members.filter(m => m !== user);
                        await fetch('/add-member', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ chatId: group.id, memberLogin: user }) });
                        await loadAllData();
                        showToast(`🔨 Пользователь ${user} исключён из группы`);
                        modalDiv.remove();
                    }
                });
            };
        });
        
        document.querySelectorAll('.mute-member').forEach(btn => {
            btn.onclick = () => {
                const user = btn.dataset.user;
                if (!groupBlacklist[group.id]) groupBlacklist[group.id] = [];
                if (!groupBlacklist[group.id].includes(user)) {
                    groupBlacklist[group.id].push(user);
                    saveGroupBlacklist();
                    showToast(`🔇 Пользователь ${user} заглушен в группе`);
                } else {
                    showToast(`⚠️ Пользователь ${user} уже в черном списке`);
                }
                modalDiv.remove();
            };
        });
        
        document.querySelectorAll('.make-admin').forEach(btn => {
            btn.onclick = () => {
                const user = btn.dataset.user;
                if (!groupRoles[group.id]) groupRoles[group.id] = {};
                groupRoles[group.id][user] = 'admin';
                saveGroupRoles();
                showToast(`⭐ Пользователь ${user} назначен администратором`);
                modalDiv.remove();
            };
        });
        
        document.getElementById('closeGroupProfileBtn').onclick = () => modalDiv.remove();
    };

    function renderMessages() {

        const pinned = pinnedMessages[currentChat] || [];
        
        container.innerHTML = `
            <div class="chat-search-bar" id="chatSearchBar">
                <input type="text" id="messageSearchInput" placeholder="🔍 Поиск в чате...">

            <div id="typingIndicator" style="font-size:12px; opacity:0.7; padding:4px 8px; display:none;"></div>

                    <div style="color:#ffcc00; font-size:12px; margin-bottom:6px;">📌 Закреплённые (${pinned.length}/3)</div>

            `;

        }
        
        msgs.forEach((msg, idx) => {
            const isPinned = pinned.some(p => p.messageIndex === idx);
            const isEditing = editingMessage && editingMessage.chatId === currentChat && editingMessage.messageIndex === idx;
            const replyHtml = msg.replyTo ? `<div style="font-size:10px; opacity:0.5; margin-bottom:4px;">↩️ Ответ ${msg.replyTo.from}: "${msg.replyTo.text.substring(0,30)}"</div>` : '';

                    <div class="message editing" data-idx="${idx}">

                            <input type="text" id="editMsgInput-${idx}" class="edit-input" value="${msg.text.replace(/"/g, '&quot;')}">

                                <button class="cancel-edit-msg" style="background:#666; border:none; border-radius:20px; padding:4px 12px; cursor:pointer;">✖ Отмена</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML += `
                    <div class="message ${msg.from === currentUser ? 'my-message' : ''} ${isPinned ? 'pinned' : ''}" data-idx="${idx}">
                        ${isPinned ? '<div class="pin-badge">📌</div>' : ''}
                        <div class="message-avatar" onclick="window.showUserProfile('${msg.from}')">${getAvatarForUser(msg.from)}</div>
                        <div class="message-content">
                            ${replyHtml}
                            <strong>${msg.from}:</strong> ${msg.text}<br>
                            <small>${msg.time}</small>
                            <div class="message-actions">
                                <span class="reply-action">↩️ Ответить</span>
                                <span class="forward-action">📤 Переслать</span>
                                <span class="pin-action">📌 Закрепить</span>
                                ${msg.from === currentUser ? '<span class="edit-action">✏️ Редактировать</span>' : ''}
                                ${msg.from === currentUser ? '<span class="delete-action">🗑️ Удалить</span>' : ''}
                            </div>

        });
        
        document.querySelectorAll('.reply-action').forEach(el => {
            el.onclick = () => {

                    <span>↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"</span>
                    <button id="cancelReplyBtn" style="background:none; border:none; color:cyan; cursor:pointer;">✖ Отмена</button>
                `;
                document.getElementById('cancelReplyBtn').onclick = () => {
                    replyTo = null;
                    document.getElementById('replyIndicator').innerHTML = '';
                };
            };
        });
        
        document.querySelectorAll('.forward-action').forEach(el => { el.onclick = () => showToast('📤 Пересылка в разработке'); });
        
        document.querySelectorAll('.pin-action').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.closest('.message').dataset.idx);
                const msg = messagesData[currentChat][idx];
                if (!pinnedMessages[currentChat]) pinnedMessages[currentChat] = [];
                if (pinnedMessages[currentChat].some(p => p.messageIndex === idx)) {
                    pinnedMessages[currentChat] = pinnedMessages[currentChat].filter(p => p.messageIndex !== idx);
                    showToast('📌 Сообщение откреплено');
                } else {
                    if (pinnedMessages[currentChat].length >= 3) {
                        showToast('⚠️ Нельзя закрепить более 3 сообщений', true);
                        return;
                    }
                    pinnedMessages[currentChat].push({ messageIndex: idx, text: msg.text, from: msg.from, time: msg.time });
                    showToast('📌 Сообщение закреплено');
                }
                savePinnedMessages();
                renderMessages();
            };
        });
        
        document.querySelectorAll('.edit-action').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.closest('.message').dataset.idx);
                const msg = messagesData[currentChat][idx];
                if (msg && msg.from === currentUser) {
                    editingMessage = { chatId: currentChat, messageIndex: idx, oldText: msg.text };
                    renderMessages();
                } else {
                    showToast('❌ Можно редактировать только свои сообщения', true);

            };
        });
        
        document.querySelectorAll('.save-edit-msg').forEach(btn => {

                if (newText) {
                    if (socket) {
                        socket.emit('editMessage', { chatId: currentChat, messageIndex: idx, newText, from: currentUser });
                    } else {
                        messagesData[currentChat][idx].text = newText;
                    }
                    editingMessage = null;
                    renderMessages();
                } else {
                    showToast('❌ Сообщение не может быть пустым', true);
                }
            };
        });
        
        document.querySelectorAll('.cancel-edit-msg').forEach(btn => {
            btn.onclick = () => {
                editingMessage = null;
                renderMessages();
            };
        });
        
        document.querySelectorAll('.delete-action').forEach(el => {
            el.onclick = () => {
                const idx = el.closest('.message').dataset.idx;
                showConfirmDialog('🗑️ Удалить сообщение?', () => {
                    socket.emit('deleteMessage', { chatId: currentChat, messageIndex: idx });
                });
            };
        });
        
        const searchMsgInput = document.getElementById('messageSearchInput');
        if (searchMsgInput) searchMsgInput.oninput = performSearchInMessages;
        document.getElementById('searchPrevBtn')?.addEventListener('click', () => navigateSearch(-1));
        document.getElementById('searchNextBtn')?.addEventListener('click', () => navigateSearch(1));
        document.getElementById('searchCloseBtn')?.addEventListener('click', closeSearch);
        
        container.scrollTop = container.scrollHeight;
    }
    
    function performSearchInMessages() {
        const query = document.getElementById('messageSearchInput')?.value.toLowerCase();
        const searchCountSpan = document.getElementById('searchCount');
        if (!query) { clearAllHighlights(); if (searchCountSpan) searchCountSpan.innerText = '0'; return; }
        const messages = document.querySelectorAll('.chat-messages .message:not(.editing)');
        clearAllHighlights();
        currentMatches = [];
        messages.forEach(msg => {
            const text = msg.innerText.toLowerCase();
            if (text.includes(query)) {
                msg.classList.add('highlight');
                currentMatches.push(msg);
            }
        });
        if (searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
        if (currentMatches.length > 0) { currentMatchIndex = 0; highlightCurrentMatch(); }
        else currentMatchIndex = -1;
    }
    
    function clearAllHighlights() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => {
            msg.classList.remove('highlight', 'current-highlight');
        });
        currentMatches = [];
        currentMatchIndex = -1;
    }
    
    function highlightCurrentMatch() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => msg.classList.remove('current-highlight'));
        if (currentMatchIndex >= 0 && currentMatches[currentMatchIndex]) {
            const currentMsg = currentMatches[currentMatchIndex];
            currentMsg.classList.add('current-highlight');
            currentMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const searchCountSpan = document.getElementById('searchCount');
            if (searchCountSpan) searchCountSpan.innerText = `${currentMatchIndex + 1}/${currentMatches.length}`;
        }
    }
    
    function navigateSearch(delta) {
        if (currentMatches.length === 0) return;
        currentMatchIndex += delta;
        if (currentMatchIndex < 0) currentMatchIndex = currentMatches.length - 1;
        if (currentMatchIndex >= currentMatches.length) currentMatchIndex = 0;
        highlightCurrentMatch();
    }
    
    function openSearch() { document.getElementById('chatSearchBar').style.display = 'flex'; document.getElementById('messageSearchInput').focus(); }
    function closeSearch() { document.getElementById('chatSearchBar').style.display = 'none'; clearAllHighlights(); document.getElementById('messageSearchInput').value = ''; document.getElementById('searchCount').innerText = '0'; }
    
    function sendMessage() {
        const input = document.getElementById('msgInput');
        let text = input.value.trim();
        if (replyTo) {
            text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`;
            replyTo = null;
            document.getElementById('replyIndicator').innerHTML = '';
        }
        if (text) {
            if (currentChat === `favorites_${currentUser}`) {
                const favKey = `favorites_${currentUser}`;
                let fav = JSON.parse(localStorage.getItem(favKey) || '[]');
                fav.push({ from: currentUser, text, time: getFormattedTime() });
                localStorage.setItem(favKey, JSON.stringify(fav));
                if (currentChat === `favorites_${currentUser}`) renderMessages();
                showToast('💾 Сохранено в Избранное');
            } else {
                socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text, time: getFormattedTime() });
                socket.emit('typing', { chatId: currentChat, user: currentUser });
            }
            input.value = '';
        }
    }
    
    async function loadMessages() {
        if (currentChat === `favorites_${currentUser}`) {
            const favKey = `favorites_${currentUser}`;
            messagesData[currentChat] = JSON.parse(localStorage.getItem(favKey) || '[]');
            renderMessages();
            return;
        }
        const res = await fetch(`/messages/${currentChat}`);
        messagesData[currentChat] = await res.json();
        renderMessages();
    }
    
    // ========== ГОЛОСОВЫЕ СООБЩЕНИЯ ==========
    function startVoiceRecording() {
        if (isRecording) {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                isRecording = false;
            }
            document.getElementById('voiceRecBar').style.display = 'none';
            document.getElementById('msgInput').style.display = 'block';
            return;
        }
        
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = e => {
                        socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<audio src="${e.target.result}" controls style="max-width:200px; border-radius:12px;"></audio>`, time: getFormattedTime() });
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('msgInput').style.display = 'none';
                document.getElementById('voiceRecBar').style.display = 'flex';
                let elapsed = 0;
                const interval = setInterval(() => {
                    if (!isRecording) { clearInterval(interval); return; }
                    elapsed += 0.1;
                    document.getElementById('voiceWaveFill').style.width = Math.min(100, (elapsed / 60) * 100) + '%';
                    if (elapsed >= 60) {
                        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
                        clearInterval(interval);
                        document.getElementById('voiceRecBar').style.display = 'none';
                        document.getElementById('msgInput').style.display = 'block';
                    }
                }, 100);
            })
            .catch(() => showToast('❌ Нет доступа к микрофону', true));
    }
    
    function cancelVoiceRecording() {
        if (mediaRecorder && isRecording && mediaRecorder.state === 'recording') mediaRecorder.stop();
        document.getElementById('voiceRecBar').style.display = 'none';
        document.getElementById('msgInput').style.display = 'block';
        isRecording = false;
    }
    
    // ========== ВИДЕОКРУЖОЧКИ ==========
    async function startVideoRecording() {
        if (isVideoRecording) {
            if (videoRecorder && videoRecorder.state === 'recording') {
                videoRecorder.stop();
                isVideoRecording = false;
            }
            if (currentVideoStream) {
                currentVideoStream.getTracks().forEach(track => track.stop());
                currentVideoStream = null;
            }
            return;
        }
        
        try {
            const constraints = { video: { facingMode: currentFacingMode }, audio: true };
            currentVideoStream = await navigator.mediaDevices.getUserMedia(constraints);
            
            // Показываем предпросмотр
            const previewDiv = document.createElement('div');
            previewDiv.id = 'videoRecordingPreview';
            previewDiv.style.cssText = 'position:fixed; bottom:100px; right:20px; width:100px; height:100px; border-radius:50%; overflow:hidden; border:3px solid #ff3333; z-index:2000; background:#000;';
            const video = document.createElement('video');
            video.srcObject = currentVideoStream;
            video.autoplay = true;
            video.muted = true;
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'cover';
            previewDiv.appendChild(video);
            
            const flipBtn = document.createElement('button');
            flipBtn.innerText = '🔄';
            flipBtn.style.cssText = 'position:absolute; top:-10px; left:-10px; width:30px; height:30px; border-radius:50%; background:#0af; border:none; cursor:pointer;';
            flipBtn.onclick = async () => {
                currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
                if (videoRecorder && videoRecorder.state === 'recording') videoRecorder.stop();
                if (currentVideoStream) currentVideoStream.getTracks().forEach(track => track.stop());
                previewDiv.remove();
                startVideoRecording();
            };
            previewDiv.appendChild(flipBtn);
            
            const cancelBtn = document.createElement('button');
            cancelBtn.innerText = '✖';
            cancelBtn.style.cssText = 'position:absolute; top:-10px; right:-10px; width:30px; height:30px; border-radius:50%; background:#ff3333; border:none; cursor:pointer; color:white;';
            cancelBtn.onclick = () => {
                if (videoRecorder && videoRecorder.state === 'recording') videoRecorder.stop();
                if (currentVideoStream) currentVideoStream.getTracks().forEach(track => track.stop());
                previewDiv.remove();
                isVideoRecording = false;
                showToast('❌ Запись отменена');
            };
            previewDiv.appendChild(cancelBtn);
            document.body.appendChild(previewDiv);
            
            videoRecorder = new MediaRecorder(currentVideoStream);
            videoChunks = [];
            videoRecorder.ondataavailable = e => videoChunks.push(e.data);
            videoRecorder.onstop = () => {
                const videoBlob = new Blob(videoChunks, { type: 'video/mp4' });
                const reader = new FileReader();
                reader.onload = e => {
                    socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<video src="${e.target.result}" controls style="max-width:200px; border-radius:50%; object-fit:cover; width:150px; height:150px;"></video>`, time: getFormattedTime() });
                };
                reader.readAsDataURL(videoBlob);
                previewDiv.remove();
                if (currentVideoStream) currentVideoStream.getTracks().forEach(track => track.stop());
                isVideoRecording = false;
                showToast('✅ Видео отправлено');
            };
            videoRecorder.start();
            isVideoRecording = true;
            setTimeout(() => {
                if (videoRecorder && videoRecorder.state === 'recording') {
                    videoRecorder.stop();
                    isVideoRecording = false;
                }
            }, 60000);
        } catch(e) { showToast('❌ Нет доступа к камере', true); }
    }

    function sendFile() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*,video/*,audio/*,application/pdf,.txt,.doc,.docx';
        input.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                let html = '';
                if (file.type.startsWith('image/')) html = `<img src="${ev.target.result}" style="max-width:200px; border-radius:12px; cursor:pointer;" onclick="window.viewMedia('${ev.target.result}', 'image')">`;
                else if (file.type.startsWith('video/')) html = `<video src="${ev.target.result}" controls style="max-width:200px; border-radius:12px;"></video>`;
                else html = `<div style="padding:8px; background:rgba(0,0,0,0.3); border-radius:12px; display:inline-block;">📎 ${file.name}</div>`;
                socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: html, time: getFormattedTime() });
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

            if (socket && currentChat) {
                socket.emit('typing', { chatId: currentChat, user: currentUser });
            }
        });
        document.getElementById('chatMenuBtn').onclick = (e) => {
            e.stopPropagation();
            if (currentChat) showChatMenu();
            else showToast('❌ Выберите чат', true);
        };
        document.getElementById('chatHeader').onclick = async (e) => {
            if (e.target.closest('.chat-header-dots') || e.target.closest('.mobile-back-btn')) return;
            const chat = allChats.find(c => c.id === currentChat);
            if (!chat || !currentChat) return showToast('❌ Выберите чат', true);
            if (currentChat === `favorites_${currentUser}`) {
                showToast('⭐ Избранное — личные заметки');
            } else if (chat.isChannel) {
                window.showChannelProfile(chat.id);
            } else if (chat.isGroup) {
                window.showGroupProfile(chat.id);
            } else {
                const otherUser = chat.members?.find(m => m !== currentUser);
                if (otherUser) window.showUserProfile(otherUser);
                else showToast('ℹ️ Профиль чата');
            }
        };
        
        function updateMobileUI() {
            const isMobile = window.innerWidth <= 768;
            if (isMobile) document.getElementById('contentPanel').classList.remove('open');
        }
        updateMobileUI();
        window.addEventListener('resize', updateMobileUI);
        
        renderLeftPanelContent();
        
        if (currentChat) {
            await loadMessages();
            socket.emit('join', currentChat);
            socket.emit('markRead', { chatId: currentChat, user: currentUser });
        }
        
        setInterval(() => {
            if (socket && currentUser && socket.connected) {
                socket.emit('userOnline', currentUser);
            }
        }, 30000);
    }
    
    // ========== ЗАПУСК ПРИЛОЖЕНИЯ ==========
    const token = localStorage.getItem('authToken');
    if (token) {
        fetch('/auto-login', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify({ token }) 
        })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    currentUser = data.login;
                    currentUserData = data.user;
                    startMessenger();
                } else {
                    renderAuth();
                }
            })
            .catch(() => renderAuth());
    } else {
        renderAuth();
    }
</script>
</body>
</html>
