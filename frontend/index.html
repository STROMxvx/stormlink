<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .messenger {
            width: 1400px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }
        .icon-bar {
            width: 80px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
            z-index: 10;
        }
        .icon-item {
            width: 50px;
            height: 50px;
            background: rgba(0,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #2ecc71;
            border-radius: 50%;
            border: 2px solid #0a0f1e;
            display: none;
        }
        .online-dot.online { display: block; }
        .icon-item:hover { background: rgba(0,255,255,0.3); transform: scale(1.05); box-shadow: 0 0 10px cyan; }
        .icon-item.active { background: #0af; color: black; box-shadow: 0 0 15px cyan; }
        
        .content-panel {
            width: 380px;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }
        
        /* Глобальная строка поиска */
        .global-search-header {
            padding: 12px 16px;
            border-bottom: 1px solid #0af;
            background: rgba(2,8,18,0.8);
        }
        .global-search-input-wrapper {
            display: flex;
            align-items: center;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            gap: 10px;
        }
        .global-search-input-wrapper span { font-size: 18px; opacity: 0.7; }
        .global-search-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .global-search-input-wrapper input::placeholder { color: rgba(255,255,255,0.4); }
        .clear-search-btn {
            background: none;
            border: none;
            color: cyan;
            cursor: pointer;
            font-size: 18px;
            padding: 0 5px;
        }
        
        /* Результаты поиска */
        .search-results-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
        }
        .search-category { margin-bottom: 20px; }
        .search-category-title {
            color: #0af;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 12px;
            background: rgba(0,170,255,0.1);
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .search-result-item {
            background: rgba(0,255,255,0.05);
            border-radius: 16px;
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-result-item:hover { background: rgba(0,255,255,0.15); border: 1px solid #0af; }
        .search-result-avatar {
            width: 44px;
            height: 44px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .search-result-info { flex: 1; min-width: 0; }
        .search-result-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-subtitle { font-size: 11px; opacity: 0.6; }
        .search-result-preview { font-size: 12px; opacity: 0.7; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .search-result-badge { background: #ff6600; border-radius: 12px; padding: 2px 8px; font-size: 10px; margin-left: 8px; flex-shrink: 0; }
        .no-results { text-align: center; padding: 40px; opacity: 0.5; }
        
        /* Вкладки навигации */
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid rgba(0,255,255,0.3);
            background: rgba(2,8,18,0.5);
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }
        .nav-tab:hover { background: rgba(0,255,255,0.1); }
        .nav-tab.active { color: #0af; border-bottom: 2px solid #0af; }
        
        .list-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            background: rgba(0,255,255,0.05);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .list-item:hover { background: rgba(0,255,255,0.15); border: 1px solid #0af; }
        .list-avatar {
            width: 44px;
            height: 44px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
            background-position: center;
            position: relative;
            flex-shrink: 0;
        }
        .list-info { flex: 1; min-width: 0; }
        .list-title { font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .list-sub { font-size: 11px; opacity: 0.6; }
        .unread-badge { background: #ff3333; color: white; border-radius: 20px; padding: 2px 8px; font-size: 10px; font-weight: bold; }
        .unread-badge.muted { background: #666; }
        .request-badge { background: #ff6600; border-radius: 20px; padding: 2px 8px; font-size: 10px; margin-left: 8px; }
        .empty-state { text-align: center; padding: 20px; opacity: 0.5; }
        
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            margin: 12px;
            font-size: 14px;
            transition: 0.2s;
        }
        .add-btn:hover { background: rgba(0,200,255,0.4); }
        
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: rgba(6,12,24,0.4); }
        .chat-header { padding: 16px 20px; border-bottom: 1px solid #0af; display: flex; justify-content: space-between; align-items: center; background: rgba(2,8,18,0.7); cursor: pointer; }
        .chat-title { font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .chat-header-dots { background: none; border: none; color: cyan; font-size: 28px; cursor: pointer; padding: 4px 12px; }
        
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .search-bar-container {
            position: sticky;
            top: 0;
            background: rgba(6,12,24,0.95);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            margin-bottom: 12px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .search-bar-container input { flex: 1; padding: 8px 16px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; outline: none; }
        .search-nav { display: flex; gap: 8px; align-items: center; }
        .search-nav button { background: #0af; border: none; border-radius: 20px; padding: 6px 12px; cursor: pointer; }
        
        .message {
            max-width: 70%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            transition: 0.2s;
        }
        .message.editing { background: rgba(255,100,0,0.3); border: 1px solid #ff6600; }
        .message.highlight { background: #ffcc00 !important; color: black !important; box-shadow: 0 0 10px #ffcc00; }
        .message.current-highlight { background: #ff9900 !important; color: black !important; box-shadow: 0 0 15px #ff9900; }
        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        .message-content { flex: 1; }
        .my-message { align-self: flex-end; background: #0af; color: black; }
        .message-actions { display: none; gap: 12px; margin-top: 6px; font-size: 12px; justify-content: flex-end; }
        .message:hover .message-actions { display: flex; }
        .message-actions span { cursor: pointer; opacity: 0.7; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 16px; }
        .message-actions span:hover { opacity: 1; background: cyan; color: black; }
        
        .edit-input {
            width: 100%;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 20px;
            padding: 6px 10px;
            color: white;
            outline: none;
            margin-top: 4px;
        }
        
        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input { flex: 1; padding: 10px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; outline: none; }
        .chat-input button { background: none; border: none; font-size: 24px; cursor: pointer; color: #0af; padding: 0 10px; }
        
        .reply-indicator { font-size: 12px; opacity: 0.7; margin-bottom: 4px; border-left: 2px solid cyan; padding-left: 8px; }
        .voice-recording { display: flex; align-items: center; gap: 12px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; padding: 8px 16px; flex: 1; }
        .voice-wave { flex: 1; height: 30px; background: rgba(0,255,255,0.2); border-radius: 20px; overflow: hidden; }
        .voice-wave-fill { width: 0%; height: 100%; background: cyan; transition: width 0.1s linear; }
        
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 380px;
            text-align: center;
        }
        .modal-box input, .modal-box textarea { width: 100%; padding: 12px; margin: 12px 0; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 10px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        .modal-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 280px;
            text-align: center;
            z-index: 2000;
        }
        .modal-confirm {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 320px;
            text-align: center;
            z-index: 2000;
        }
        .modal-confirm h3 { margin-bottom: 20px; }
        .modal-confirm-buttons { display: flex; gap: 16px; justify-content: center; margin-top: 20px; }
        .modal-confirm-buttons button { padding: 8px 24px; background: #0af; border: none; border-radius: 40px; cursor: pointer; font-weight: bold; }
        
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea { width: 100%; padding: 12px; margin: 10px 0; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .auth-btn { background: #0af; border: none; border-radius: 40px; padding: 12px; cursor: pointer; font-weight: bold; }
        
        .profile-card {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 340px;
            text-align: center;
        }
        .member-list { max-height: 200px; overflow-y: auto; margin-top: 12px; text-align: left; }
        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 20px;
            background: rgba(0,255,255,0.05);
            margin-bottom: 8px;
            cursor: pointer;
        }
        .member-item:hover { background: rgba(0,255,255,0.2); }
        
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
            position: relative;
        }
        .friends-icon .friend-request-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3333;
            color: white;
            border-radius: 50%;
            min-width: 22px;
            height: 22px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            border: 1px solid white;
        }
        
        .burger-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        .mobile-back-btn { display: none; background: none; border: none; color: cyan; font-size: 28px; cursor: pointer; padding: 4px 12px; }
        
        .emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0; font-size: 28px; }
        .emoji-option { cursor: pointer; padding: 4px 8px; border-radius: 12px; }
        .emoji-option:hover { background: #0af; }
        
        .chat-menu {
            position: fixed;
            background: #0a1428;
            border: 1px solid #0af;
            border-radius: 16px;
            padding: 8px;
            z-index: 200;
        }
        .chat-menu div { padding: 8px 16px; cursor: pointer; border-radius: 12px; }
        .chat-menu div:hover { background: #0af; color: black; }
        
        .media-content { max-width: 200px; max-height: 150px; border-radius: 12px; cursor: pointer; }
        .file-content { display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        
        .prefix-input {
            display: flex;
            align-items: center;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 0 12px;
            margin: 12px 0;
        }
        .prefix-input span { color: #0af; font-size: 16px; font-weight: bold; margin-right: 4px; }
        .prefix-input input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
        
        .subgroup-item { margin-left: 28px; padding: 6px; font-size: 13px; border-radius: 16px; background: rgba(0,255,255,0.05); cursor: pointer; }
        .subgroup-item:hover { background: rgba(0,255,255,0.15); }
        
        @media (max-width: 768px) {
            .messenger { width: 100%; height: 100vh; border-radius: 0; }
            .burger-btn { display: block; }
            .content-panel {
                position: fixed; left: 0; top: 0; bottom: 0; width: 85%; max-width: 320px;
                transform: translateX(-100%); z-index: 1000; background: rgba(2,8,18,0.98);
                transition: transform 0.2s ease;
            }
            .content-panel.open { transform: translateX(0); box-shadow: 2px 0 20px rgba(0,170,255,0.3); }
            .icon-bar { display: none; }
            .chat-panel { width: 100%; }
            .mobile-back-btn { display: block; }
            .chat-header { padding-left: 60px; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let subgroups = JSON.parse(localStorage.getItem('subgroups') || '{}');
    let friends = [];
    let friendRequests = [];
    let groupJoinRequests = [];
    let groups = [];
    let channels = [];
    let replyTo = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentMatches = [];
    let currentMatchIndex = -1;
    let activeTab = 'chats';
    let allUsersList = [];
    let unreadData = {};
    let onlineUsers = JSON.parse(localStorage.getItem('onlineUsers') || '{}');
    let editingMessage = null;
    
    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveSubgroups() { localStorage.setItem('subgroups', JSON.stringify(subgroups)); }
    function saveOnlineUsers() { localStorage.setItem('onlineUsers', JSON.stringify(onlineUsers)); }
    
    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }
    
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.innerHTML = `<h3>${msg}</h3><button onclick="this.parentElement.remove()" class="auth-btn">ОК</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function showConfirmDialog(title, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'modal-confirm';
        modal.innerHTML = `<h3>${title}</h3><div class="modal-confirm-buttons"><button id="confirmYes">Да</button><button id="confirmNo">Нет</button></div>`;
        document.body.appendChild(modal);
        document.getElementById('confirmYes').onclick = () => { onConfirm(); modal.remove(); };
        document.getElementById('confirmNo').onclick = () => modal.remove();
    }
    
    // ========== ГЛОБАЛЬНЫЙ ПОИСК (как в Telegram) ==========
    function performGlobalSearch(query) {
        const searchQuery = query.toLowerCase().trim();
        const resultsContainer = document.getElementById('searchResultsContainer');
        if (!resultsContainer) return;
        
        if (!searchQuery) {
            resultsContainer.innerHTML = '<div class="no-results">🔍 Введите запрос для поиска</div>';
            return;
        }
        
        const results = { chats: [], users: [], groups: [], channels: [], messages: [] };
        
        allChats.forEach(chat => {
            if (chat.isGroup || chat.isChannel) return;
            if (chat.name?.toLowerCase().includes(searchQuery) || chat.login?.toLowerCase().includes(searchQuery)) {
                results.chats.push(chat);
            }
        });
        
        groups.forEach(group => {
            if (group.name?.toLowerCase().includes(searchQuery) || group.login?.toLowerCase().includes(searchQuery)) {
                results.groups.push(group);
            }
        });
        
        channels.forEach(channel => {
            if (channel.name?.toLowerCase().includes(searchQuery) || channel.login?.toLowerCase().includes(searchQuery)) {
                results.channels.push(channel);
            }
        });
        
        allUsersList.forEach(user => {
            if (user.login.toLowerCase().includes(searchQuery)) {
                results.users.push(user);
            }
        });
        
        for (const chatId of Object.keys(messagesData)) {
            const chat = allChats.find(c => c.id === chatId);
            if (!chat) continue;
            messagesData[chatId].forEach((msg, idx) => {
                if (msg.text && msg.text.toLowerCase().includes(searchQuery)) {
                    results.messages.push({
                        chatId, chatName: chat.name, messageText: msg.text.substring(0, 80),
                        messageFrom: msg.from, messageIndex: idx
                    });
                }
            });
        }
        
        results.chats = results.chats.slice(0, 5);
        results.users = results.users.slice(0, 5);
        results.groups = results.groups.slice(0, 5);
        results.channels = results.channels.slice(0, 5);
        results.messages = results.messages.slice(0, 10);
        
        let html = '';
        
        if (results.chats.length) {
            html += `<div class="search-category"><div class="search-category-title">💬 ЧАТЫ</div>`;
            results.chats.forEach(chat => {
                const otherUser = chat.members?.find(m => m !== currentUser);
                html += `<div class="search-result-item" data-type="chat" data-id="${chat.id}">
                    <div class="search-result-avatar">${otherUser ? (userAvatars[otherUser] ? '' : '👤') : '💬'}</div>
                    <div class="search-result-info"><div class="search-result-title">${otherUser || chat.name}</div><div class="search-result-subtitle">Личный чат</div></div>
                </div>`;
            });
            html += `</div>`;
        }
        
        if (results.groups.length) {
            html += `<div class="search-category"><div class="search-category-title">👥 ГРУППЫ</div>`;
            results.groups.forEach(group => {
                html += `<div class="search-result-item" data-type="group" data-id="${group.id}">
                    <div class="search-result-avatar">${group.avatar || '👥'}</div>
                    <div class="search-result-info"><div class="search-result-title">${group.name}</div><div class="search-result-subtitle">${group.members?.length || 0} участников</div></div>
                </div>`;
            });
            html += `</div>`;
        }
        
        if (results.channels.length) {
            html += `<div class="search-category"><div class="search-category-title">📢 КАНАЛЫ</div>`;
            results.channels.forEach(channel => {
                html += `<div class="search-result-item" data-type="channel" data-id="${channel.id}">
                    <div class="search-result-avatar">${channel.avatar || '📢'}</div>
                    <div class="search-result-info"><div class="search-result-title">${channel.name}</div><div class="search-result-subtitle">@${(channel.login || channel.id).replace(/^@+/, '')}</div></div>
                </div>`;
            });
            html += `</div>`;
        }
        
        if (results.users.length) {
            html += `<div class="search-category"><div class="search-category-title">👤 ПОЛЬЗОВАТЕЛИ</div>`;
            results.users.forEach(user => {
                const isFriend = friends?.includes(user.login);
                html += `<div class="search-result-item" data-type="user" data-login="${user.login}">
                    <div class="search-result-avatar" style="${userAvatars[user.login] ? `background-image:url(${userAvatars[user.login]}); background-size:cover;` : ''}">${!userAvatars[user.login] ? '👤' : ''}</div>
                    <div class="search-result-info"><div class="search-result-title">${user.login}</div><div class="search-result-subtitle">${isFriend ? 'В друзьях' : 'Не в друзьях'}</div></div>
                    ${!isFriend ? '<span class="search-result-badge">➕</span>' : ''}
                </div>`;
            });
            html += `</div>`;
        }
        
        if (results.messages.length) {
            html += `<div class="search-category"><div class="search-category-title">💬 СООБЩЕНИЯ</div>`;
            results.messages.forEach(msg => {
                html += `<div class="search-result-item" data-type="message" data-chat-id="${msg.chatId}" data-message-index="${msg.messageIndex}">
                    <div class="search-result-avatar">💬</div>
                    <div class="search-result-info"><div class="search-result-title">${msg.chatName}</div><div class="search-result-preview">${msg.messageFrom}: ${msg.messageText}${msg.messageText.length >= 80 ? '...' : ''}</div></div>
                </div>`;
            });
            html += `</div>`;
        }
        
        if (!results.chats.length && !results.users.length && !results.groups.length && !results.channels.length && !results.messages.length) {
            html = '<div class="no-results">😔 Ничего не найдено по запросу "' + searchQuery + '"</div>';
        }
        
        resultsContainer.innerHTML = html;
        
        document.querySelectorAll('.search-result-item[data-type="chat"], .search-result-item[data-type="group"], .search-result-item[data-type="channel"]').forEach(el => {
            el.onclick = () => openChatById(el.dataset.id);
        });
        document.querySelectorAll('.search-result-item[data-type="user"]').forEach(el => {
            el.onclick = () => window.showUserProfile(el.dataset.login);
        });
        document.querySelectorAll('.search-result-item[data-type="message"]').forEach(el => {
            el.onclick = () => {
                const chatId = el.dataset.chatId;
                const messageIndex = parseInt(el.dataset.messageIndex);
                openChatById(chatId, messageIndex);
            };
        });
    }
    
    function openChatById(chatId, highlightMessageIndex = null) {
        const chat = allChats.find(c => c.id === chatId);
        if (!chat) return;
        
        currentChat = chatId;
        currentChatName = chat.name;
        document.getElementById('chatTitle').innerHTML = `<span>${currentChatName}</span>`;
        loadMessages();
        socket.emit('join', currentChat);
        socket.emit('markRead', { chatId: currentChat, user: currentUser });
        unreadData[currentChat] = 0;
        
        if (highlightMessageIndex !== null) {
            setTimeout(() => {
                const messages = document.querySelectorAll('.chat-messages .message');
                if (messages[highlightMessageIndex]) {
                    messages[highlightMessageIndex].classList.add('highlight');
                    messages[highlightMessageIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(() => messages[highlightMessageIndex]?.classList.remove('highlight'), 3000);
                }
            }, 200);
        }
        
        if (window.innerWidth <= 768) document.getElementById('contentPanel').classList.remove('open');
        renderLeftPanelContent();
    }

    async function loadAllData() {
        await Promise.all([
            fetch('/users').then(r => r.json()).then(data => { allUsersList = data.filter(u => u.login !== currentUser); }),
            fetch('/chats').then(r => r.json()).then(data => { allChats = data; groups = data.filter(c => c.isGroup === true); channels = data.filter(c => c.isChannel === true); }),
            fetch(`/friends/${currentUser}`).then(r => r.json()).then(data => { friends = data.friends || []; }),
            fetch(`/friend-requests/${currentUser}`).then(r => r.json()).then(data => { friendRequests = data.requests || []; }),
            fetch(`/group-requests/${currentUser}`).then(r => r.json()).then(data => { groupJoinRequests = data.requests || []; }),
            fetch(`/unread/${currentUser}`).then(r => r.json()).then(data => { unreadData = data.unread || {}; })
        ]);
        updateFriendRequestBadge();
        renderLeftPanelContent();
        renderJoinRequestsInMenu();

    function updateFriendRequestBadge() {
        const friendIcon = document.getElementById('friendsIcon');
        if (!friendIcon) return;
        let badge = friendIcon.querySelector('.friend-request-count');
        const count = friendRequests.length;
        if (!badge) { badge = document.createElement('div'); badge.className = 'friend-request-count'; friendIcon.appendChild(badge); }
        if (count > 0) { badge.innerText = count > 9 ? '9+' : count; badge.style.display = 'flex'; }
        else { badge.style.display = 'none'; }
    }
    
    function getUnreadCount(chatId) {

    function renderLeftPanelContent() {
        const container = document.getElementById('listContainer');
        if (!container) return;
        
        if (activeTab === 'chats') {
            document.getElementById('contentTitle').innerText = '💬 Чаты';
            const myChats = allChats.filter(chat => {
                if (chat.id === 'favorites') return true;
                if (chat.isGroup && chat.members?.includes(currentUser)) return true;
                if (chat.isChannel && chat.members?.includes(currentUser)) return true;
                if (!chat.isGroup && !chat.isChannel && chat.members?.includes(currentUser)) return true;
                return false;
            });
            if (myChats.length === 0) { container.innerHTML = '<div class="empty-state">Нет чатов</div>'; }
            else {
                container.innerHTML = myChats.map(chat => {
                    let displayName = chat.name;
                    let avatar = chat.avatar || '💬';
                    let subtitle = chat.isGroup ? 'Группа' : (chat.isChannel ? 'Канал' : 'Личный чат');
                    if (!chat.isGroup && !chat.isChannel && chat.id !== 'favorites') {
                        const otherUser = chat.members?.find(m => m !== currentUser);
                        if (otherUser) { displayName = otherUser; subtitle = 'Личный чат'; }
                        if (userAvatars[otherUser]) { avatar = `<div class="list-avatar" style="background-image:url(${userAvatars[otherUser]}); background-size:cover;"><div class="online-dot ${onlineUsers[otherUser] ? 'online' : ''}"></div></div>`; }
                        else { avatar = `<div class="list-avatar">👤<div class="online-dot ${onlineUsers[otherUser] ? 'online' : ''}"></div></div>`; }
                    }
                    const unreadHtml = getUnreadCount(chat.id);
                    return `<div class="list-item" data-chat-id="${chat.id}">${typeof avatar === 'string' && avatar.startsWith('<') ? avatar : `<div class="list-avatar">${avatar}</div>`}<div class="list-info"><div class="list-title">${displayName} ${unreadHtml}</div><div class="list-sub">${subtitle}</div></div></div>`;
                }).join('');
                document.querySelectorAll('.list-item[data-chat-id]').forEach(item => { item.onclick = () => { const chat = allChats.find(c => c.id === item.dataset.chatId); if(chat){ currentChat = chat.id; currentChatName = chat.name; document.getElementById('chatTitle').innerHTML = `<span>${currentChatName}</span>`; loadMessages(); socket.emit('join', currentChat); socket.emit('markRead', { chatId: currentChat, user: currentUser }); unreadData[currentChat] = 0; renderLeftPanelContent(); if(window.innerWidth <= 768) document.getElementById('contentPanel').classList.remove('open'); } }; });
            }
        }
        else if (activeTab === 'groups') {
            document.getElementById('contentTitle').innerText = '👥 Группы';
            const myGroups = groups.filter(g => g.members?.includes(currentUser));
            if (myGroups.length === 0) { container.innerHTML = '<div class="empty-state">Нет групп</div>'; }
            else {
                container.innerHTML = myGroups.map(group => `<div class="list-item" data-group-id="${group.id}"><div class="list-avatar">${group.avatar || '👥'}</div><div class="list-info"><div class="list-title">${group.name}</div><div class="list-sub">${group.members?.length || 0} участников</div></div></div>`).join('');
                document.querySelectorAll('.list-item[data-group-id]').forEach(item => { item.onclick = () => { const group = groups.find(g => g.id === item.dataset.groupId); if(group){ currentChat = group.id; currentChatName = group.name; document.getElementById('chatTitle').innerHTML = `<span>${currentChatName}</span>`; loadMessages(); socket.emit('join', currentChat); if(window.innerWidth <= 768) document.getElementById('contentPanel').classList.remove('open'); } }; });
            }
        }
        else if (activeTab === 'channels') {
            document.getElementById('contentTitle').innerText = '📢 Каналы';
            const myChannels = channels.filter(c => c.members?.includes(currentUser));
            if (myChannels.length === 0) { container.innerHTML = '<div class="empty-state">Нет каналов</div>'; }
            else {
                container.innerHTML = myChannels.map(channel => `<div class="list-item" data-channel-id="${channel.id}"><div class="list-avatar">${channel.avatar || '📢'}</div><div class="list-info"><div class="list-title">${channel.name}</div><div class="list-sub">@${(channel.login || channel.id).replace(/^@+/, '')}</div></div></div>`).join('');
                document.querySelectorAll('.list-item[data-channel-id]').forEach(item => { item.onclick = () => { const channel = channels.find(c => c.id === item.dataset.channelId); if(channel){ currentChat = channel.id; currentChatName = channel.name; document.getElementById('chatTitle').innerHTML = `<span>${currentChatName}</span>`; loadMessages(); socket.emit('join', currentChat); if(window.innerWidth <= 768) document.getElementById('contentPanel').classList.remove('open'); } }; });
            }
        }
        else if (activeTab === 'contacts') {
            document.getElementById('contentTitle').innerText = '👤 Контакты';
            if (!friends || friends.length === 0) { container.innerHTML = '<div class="empty-state">Нет друзей</div>'; }
            else {

            }
        }
    }

    function showEditProfileModal() {
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        const avatarUrl = userAvatars[currentUser] || null;
        modalDiv.innerHTML = `<div class="modal-box"><h3>✏️ Редактировать профиль</h3><div style="display:flex; justify-content:center; margin:10px;"><div id="avatarPreview" class="avatar" style="width:80px; height:80px; font-size:40px; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div></div><button id="changeAvatarBtn" class="auth-btn">📷 Сменить фото</button><input type="date" id="editBirthdate" value="${currentUserData?.birthdate || ''}"><textarea id="editAbout" rows="3" placeholder="О себе">${currentUserData?.about || ''}</textarea><div class="modal-buttons"><button id="saveProfileBtn" class="auth-btn">💾 Сохранить</button><button id="cancelEditBtn" class="auth-btn">Отмена</button></div></div>`;
        document.body.appendChild(modalDiv);
        document.getElementById('changeAvatarBtn').onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file && file.size <= 4*1024*1024) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        userAvatars[currentUser] = ev.target.result;
                        saveAvatars();
                        document.getElementById('avatarPreview').style.backgroundImage = `url(${ev.target.result})`;
                        document.getElementById('avatarPreview').style.backgroundSize = 'cover';
                        document.getElementById('avatarPreview').innerHTML = '';
                        showToast('Фото обновлено');
                    };
                    reader.readAsDataURL(file);
                } else showToast('Файл больше 4 МБ');
            };
            input.click();
        };
        document.getElementById('saveProfileBtn').onclick = async () => {
            currentUserData = { ...currentUserData, birthdate: document.getElementById('editBirthdate').value, about: document.getElementById('editAbout').value };
            await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: currentUser, ...currentUserData }) });
            showToast('Профиль обновлён');
            modalDiv.remove();
        };
        document.getElementById('cancelEditBtn').onclick = () => modalDiv.remove();
    }
    
    window.showUserProfile = function(login, parentModalToClose = null) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { showToast('Пользователь не найден'); return; }

        const searchMsgInput = document.getElementById('messageSearchInput');
        if (searchMsgInput) searchMsgInput.oninput = performSearchInMessages;

    function performSearchInMessages() {
        const query = document.getElementById('messageSearchInput')?.value.toLowerCase();
        const searchCountSpan = document.getElementById('searchCount');
        if (!query) { clearAllHighlights(); if (searchCountSpan) searchCountSpan.innerText = '0'; return; }
        const messages = document.querySelectorAll('.chat-messages .message');
        clearAllHighlights();
        currentMatches = [];
        messages.forEach(msg => { const text = msg.innerText.toLowerCase(); if (text.includes(query)) { msg.classList.add('highlight'); currentMatches.push(msg); } });
        if (searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
        if (currentMatches.length > 0) { currentMatchIndex = 0; highlightCurrentMatch(); } else currentMatchIndex = -1;
    }
    
    function clearAllHighlights() { document.querySelectorAll('.chat-messages .message').forEach(msg => { msg.classList.remove('highlight', 'current-highlight'); }); currentMatches = []; currentMatchIndex = -1; }
    function highlightCurrentMatch() { document.querySelectorAll('.chat-messages .message').forEach(msg => msg.classList.remove('current-highlight')); if (currentMatchIndex >= 0 && currentMatches[currentMatchIndex]) { const currentMsg = currentMatches[currentMatchIndex]; currentMsg.classList.add('current-highlight'); currentMsg.scrollIntoView({ behavior: 'smooth', block: 'center' }); const searchCountSpan = document.getElementById('searchCount'); if (searchCountSpan) searchCountSpan.innerText = `${currentMatchIndex + 1}/${currentMatches.length}`; } else if (currentMatches.length > 0 && searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString(); }
    function navigateSearch(delta) { if (currentMatches.length === 0) return; currentMatchIndex += delta; if (currentMatchIndex < 0) currentMatchIndex = currentMatches.length - 1; if (currentMatchIndex >= currentMatches.length) currentMatchIndex = 0; highlightCurrentMatch(); }
    function openSearch() { document.getElementById('searchBar').style.display = 'flex'; document.getElementById('messageSearchInput').focus(); }
    function closeSearch() { document.getElementById('searchBar').style.display = 'none'; clearAllHighlights(); document.getElementById('messageSearchInput').value = ''; document.getElementById('searchCount').innerText = '0'; }
    
    function sendMessage() {
        const input = document.getElementById('msgInput');
        let text = input.value.trim();
        if (replyTo) { text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`; replyTo = null; document.getElementById('replyIndicator').innerHTML = ''; }
        if (text) { if (currentChat === 'favorites') saveFavoriteMessage(text); else socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text, time: getFormattedTime() }); input.value = ''; }
    }
    
    function saveFavoriteMessage(text) {

    function sendFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            let html = '';
            if (file.type.startsWith('image/')) html = `<img src="${e.target.result}" class="media-content" onclick="viewMedia('${e.target.result}', 'image')" style="max-width:200px; border-radius:12px; cursor:pointer;">`;
            else if (file.type.startsWith('video/')) html = `<video src="${e.target.result}" class="media-content" controls style="max-width:200px; border-radius:12px;"></video>`;
            else html = `<div class="file-content" onclick="downloadFile('${e.target.result}', '${file.name}')">📎 ${file.name}</div>`;
            socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: html, time: getFormattedTime() });
        };
        reader.readAsDataURL(file);
    }

        let html = `<div id="menuClear" style="padding:8px 16px; cursor:pointer;">🧹 Очистить чат</div>`;
        if (isGroup && isOwner) html += `<div id="menuAddSubgroup" style="padding:8px 16px; cursor:pointer;">➕ Добавить подгруппу</div>`;
        html += `<div id="menuSearch" style="padding:8px 16px; cursor:pointer;">🔍 Поиск в чате</div><div id="menuNotifications" style="padding:8px 16px; cursor:pointer;">${isMuted ? '🔔 Вкл уведомления' : '🔕 Выкл уведомления'}</div>`;
        if (isChannel && isSubscriber && !isOwner) html += `<div id="menuLeaveChannel" style="padding:8px 16px; cursor:pointer;">🚪 Выйти из канала</div>`;
        if (!isFavorites && currentChatObj && !currentChatObj.isChannel) html += `<div id="menuDelete" style="padding:8px 16px; cursor:pointer;">🗑 Удалить чат</div>`;
        menu.innerHTML = html; document.body.appendChild(menu);
        const rect = document.querySelector('.chat-header-dots').getBoundingClientRect(); menu.style.left = rect.left - 120 + 'px'; menu.style.top = rect.bottom + 5 + 'px';
        menu.querySelector('#menuClear').onclick = () => { showConfirmDialog(`Очистить чат?`, () => { if (currentChat === 'favorites') { localStorage.setItem(`favorites_${currentUser}`, JSON.stringify([])); messagesData['favorites'] = []; } else messagesData[currentChat] = []; renderMessages(); menu.remove(); }); menu.remove(); };
        if (isGroup && isOwner && menu.querySelector('#menuAddSubgroup')) menu.querySelector('#menuAddSubgroup').onclick = () => { showAddSubgroupModal(currentChat, currentChatName); menu.remove(); };
        menu.querySelector('#menuSearch').onclick = () => { openSearch(); menu.remove(); };
        menu.querySelector('#menuNotifications').onclick = () => { mutedChats[currentChat] = !mutedChats[currentChat]; saveMuted(); renderLeftPanelContent(); menu.remove(); };
        if (menu.querySelector('#menuLeaveChannel')) menu.querySelector('#menuLeaveChannel').onclick = () => { leaveChannel(currentChat, currentChatName); menu.remove(); };
        if (!isFavorites && menu.querySelector('#menuDelete')) menu.querySelector('#menuDelete').onclick = () => { deleteChat(currentChat, currentChatName); menu.remove(); };
        setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 10);
    }
    
    async function startMessenger() {
        await loadAllData();
        socket = io();
        
        socket.emit('userOnline', currentUser);
        socket.on('userOnline', (login) => { onlineUsers[login] = true; saveOnlineUsers(); renderLeftPanelContent(); if(currentChat !== 'favorites') renderMessages(); });
        socket.on('userOffline', (login) => { onlineUsers[login] = false; saveOnlineUsers(); renderLeftPanelContent(); if(currentChat !== 'favorites') renderMessages(); });
        socket.on('newMessage', (msg) => { if (currentChat === 'favorites') return; if (!messagesData[currentChat]) messagesData[currentChat] = []; messagesData[currentChat].push(msg); renderMessages(); loadAllData(); const isChatMuted = mutedChats[currentChat]; if (!isChatMuted && msg.from !== currentUser) { const audio = new Audio('/sounds/notifica.mp3'); audio.play().catch(()=>{}); document.title = '🔔 Новое сообщение'; setTimeout(() => document.title = 'StormLink', 3000); } });
        socket.on('messageDeleted', ({ chatId, messageIndex }) => { if (messagesData[chatId]) { messagesData[chatId].splice(messageIndex, 1); if (chatId === currentChat) renderMessages(); } });
        socket.on('messageEdited', ({ chatId, messageIndex, newText }) => { if (messagesData[chatId] && messagesData[chatId][messageIndex]) { messagesData[chatId][messageIndex].text = newText; if (chatId === currentChat) renderMessages(); } });
        socket.on('friendRequest', () => loadAllData());
        socket.on('groupRequest', () => loadAllData());
        socket.on('updateUnread', () => loadAllData());
        socket.on('error', (msg) => showToast(msg));
        
        document.getElementById('app').innerHTML = `
            <button class="burger-btn" id="burgerBtn">☰</button>
            <div class="messenger">
                <div class="icon-bar">
                    <div class="icon-item ${activeTab === 'chats' ? 'active' : ''}" id="tabChats">💬</div>
                    <div class="icon-item ${activeTab === 'groups' ? 'active' : ''}" id="tabGroups">👥</div>
                    <div class="icon-item ${activeTab === 'channels' ? 'active' : ''}" id="tabChannels">📢</div>
                    <div class="icon-item ${activeTab === 'contacts' ? 'active' : ''}" id="tabContacts">👤</div>
                </div>
                <div class="content-panel" id="contentPanel">
                    <div class="global-search-header">
                        <div class="global-search-input-wrapper">
                            <span>🔍</span>
                            <input type="text" id="globalSearchInput" placeholder="Поиск (чаты, люди, сообщения...)">
                            <button class="clear-search-btn" id="clearSearchBtn">✖</button>
                        </div>
                    </div>
                    <div class="nav-tabs">
                        <div class="nav-tab ${activeTab === 'chats' ? 'active' : ''}" data-tab="chats">💬 Чаты</div>
                        <div class="nav-tab ${activeTab === 'groups' ? 'active' : ''}" data-tab="groups">👥 Группы</div>
                        <div class="nav-tab ${activeTab === 'channels' ? 'active' : ''}" data-tab="channels">📢 Каналы</div>
                        <div class="nav-tab ${activeTab === 'contacts' ? 'active' : ''}" data-tab="contacts">👤 Контакты</div>
                    </div>
                    <div id="searchResultsContainer" class="search-results-container"></div>
                    <div id="listContainer" class="list-container"></div>
                    <div id="joinRequestsContainer" class="list-container" style="border-top:1px solid rgba(0,255,255,0.2); margin-top:8px; max-height:200px;"></div>
                    <div class="add-btn" id="createGroupBtn">👥 Создать группу</div>
                    <div class="add-btn" id="createChannelBtn">📢 Создать канал</div>
                </div>
                <div class="chat-panel">
                    <div class="chat-header">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button class="mobile-back-btn" id="mobileBackBtn">←</button>
                            <span class="chat-title" id="chatTitle">${currentChatName}</span>
                        </div>
                        <button class="chat-header-dots" id="chatMenuBtn">⋯</button>
                    </div>
                    <div class="chat-messages" id="messagesList"></div>
                    <div id="replyIndicator" class="reply-indicator" style="padding:0 16px;"></div>
                    <div class="chat-input" id="chatInputArea">
                        <button id="emojiBtn">😀</button>
                        <button id="attachBtn">📎</button>
                        <input type="text" id="msgInput" placeholder="Введите сообщение...">
                        <button id="voiceBtn">🎙️</button>
                        <button id="sendBtn">➤</button>
                        <div id="voiceRecBar" style="display:none; align-items:center; gap:12px; flex:1;">
                            <div class="voice-wave"><div id="voiceWaveFill" class="voice-wave-fill"></div></div>
                            <button id="cancelVoiceBtn">✖</button>
                        </div>
                    </div>
                </div>
            </div>
            <button class="friends-icon" id="friendsIcon">👥</button>
        `;
        
        // Настройка поиска
        const searchInput = document.getElementById('globalSearchInput');
        const searchResultsDiv = document.getElementById('searchResultsContainer');
        const listContainerDiv = document.getElementById('listContainer');
        searchInput.oninput = (e) => {
            const query = e.target.value;
            if (query.trim()) {
                searchResultsDiv.style.display = 'block';
                listContainerDiv.style.display = 'none';
                performGlobalSearch(query);
            } else {
                searchResultsDiv.style.display = 'none';
                listContainerDiv.style.display = 'flex';
                renderLeftPanelContent();
            }
        };
        document.getElementById('clearSearchBtn').onclick = clearSearch;
        
        // Переключение вкладок
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.onclick = () => {
                activeTab = tab.dataset.tab;
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                searchResultsDiv.style.display = 'none';
                listContainerDiv.style.display = 'flex';
                renderLeftPanelContent();
            };
        });
        
        document.getElementById('tabChats').onclick = () => { activeTab = 'chats'; renderLeftPanelContent(); };
        document.getElementById('tabGroups').onclick = () => { activeTab = 'groups'; renderLeftPanelContent(); };
        document.getElementById('tabChannels').onclick = () => { activeTab = 'channels'; renderLeftPanelContent(); };
        document.getElementById('tabContacts').onclick = () => { activeTab = 'contacts'; renderLeftPanelContent(); };
        document.getElementById('createGroupBtn').onclick = showCreateGroupModal;
        document.getElementById('createChannelBtn').onclick = showCreateChannelModal;
        document.getElementById('friendsIcon').onclick = showFriendsList;
        document.getElementById('burgerBtn').onclick = () => document.getElementById('contentPanel').classList.toggle('open');
        document.getElementById('mobileBackBtn').onclick = () => document.getElementById('contentPanel').classList.add('open');
        document.getElementById('emojiBtn').onclick = showEmojiPicker;
        document.getElementById('attachBtn').onclick = () => { const input = document.createElement('input'); input.type = 'file'; input.onchange = (e) => e.target.files[0] && sendFile(e.target.files[0]); input.click(); };
        document.getElementById('voiceBtn').onclick = startVoiceRecording;
        document.getElementById('cancelVoiceBtn').onclick = cancelVoiceRecording;
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').addEventListener('keypress', (e) => e.key === 'Enter' && sendMessage());
        document.getElementById('chatMenuBtn').onclick = (e) => { e.stopPropagation(); showChatMenu(); };
        document.getElementById('chatHeader').onclick = (e) => {
            if (e.target.closest('.chat-header-dots') || e.target.closest('.mobile-back-btn')) return;
            const chat = allChats.find(c => c.id === currentChat);
            if (!chat || currentChat === 'favorites') return showToast('Избранное — личные заметки');
            if (chat.isChannel) window.showChannelProfile(chat.id);
            else if (chat.isGroup) window.showGroupProfile(chat.id);
            else { const otherUser = chat.members?.find(m => m !== currentUser); if (otherUser) window.showUserProfile(otherUser); else showToast('Профиль чата'); }
        };
        
        // Обновление мобильного UI
        function updateMobileUI() { const isMobile = window.innerWidth <= 768; if (isMobile) document.getElementById('contentPanel').classList.remove('open'); }
        updateMobileUI(); window.addEventListener('resize', updateMobileUI);
        
        renderLeftPanelContent();
        loadMessages();
        socket.emit('join', currentChat);
        setInterval(() => { if (socket && currentUser) socket.emit('userOnline', currentUser); }, 30000);
    }
    
    const token = localStorage.getItem('authToken');
    if (token) {
        fetch('/auto-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) })
            .then(r => r.json()).then(data => { if (data.success) { currentUser = data.login; currentUserData = data.user; startMessenger(); } else renderAuth(); })
            .catch(() => renderAuth());
    } else { renderAuth(); }
</script>
