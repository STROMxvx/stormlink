<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .messenger {
            width: 1300px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        /* ===== ПК-ВЕРСИЯ (широкий сайдбар) ===== */
        .sidebar {
            width: 300px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
            transition: transform 0.2s ease;
        }

        /* ===== МОБИЛЬНАЯ ВЕРСИЯ (включается классом .mobile-mode) ===== */
        body.mobile-mode .messenger {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }
        body.mobile-mode .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 75%;
            max-width: 280px;
            transform: translateX(-100%);
            z-index: 1000;
            border-radius: 0;
        }
        body.mobile-mode .sidebar.open {
            transform: translateX(0);
        }
        body.mobile-mode .burger-btn {
            display: block;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        body.mobile-mode .chat-header {
            padding-left: 70px;
        }
        .burger-btn {
            display: none;
        }

        /* Общие стили (не менялись) */
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.1);
            border-radius: 40px;
            cursor: pointer;
        }
        .user-info:hover { background: rgba(0,255,255,0.2); }

        .avatar {
            width: 48px;
            height: 48px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background-size: cover;
            background-position: center;
        }

        .search-player {
            background: rgba(0,255,255,0.05);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
        }
        .search-player input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }
        .search-player button {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
        }

        .chats-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .chat-item {
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item:hover { background: rgba(0,255,255,0.15); }
        .chat-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(6,12,24,0.4);
        }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-title {
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-header-dots {
            background: none;
            border: none;
            color: cyan;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 12px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 60%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            word-wrap: break-word;
            position: relative;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
            cursor: pointer;
            flex-shrink: 0;
        }
        .message-content { flex: 1; }
        .my-message {
            align-self: flex-end;
            background: #0af;
            color: black;
        }
        .message-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            justify-content: flex-end;
        }
        .message:hover .message-actions { display: flex; }
        .message-actions span {
            cursor: pointer;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 16px;
        }
        .message-actions span:hover { opacity: 1; background: cyan; color: black; }

        .chat-input {
            display: flex;
            padding: 16px;
            gap: 12px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 16px;
        }
        .chat-input button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #0af;
            padding: 0 12px;
        }
        .reply-indicator {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
        }
        .voice-recording {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            flex: 1;
        }
        .voice-wave {
            flex: 1;
            height: 30px;
            background: rgba(0,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
        }
        .voice-wave-fill {
            width: 0%;
            height: 100%;
            background: cyan;
            transition: width 0.1s linear;
        }
        .modal-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 280px;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 0 40px rgba(0,255,255,0.3);
        }
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: cyan;
            margin-right: 8px;
        }
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322; border:2px solid #0af; border-radius:28px;
            padding:24px; width:320px; text-align:center;
        }
        .profile-card {
            background: #0c1322; border:2px solid #0af; border-radius:28px;
            padding:24px; width:320px; text-align:center;
        }
        .friends-list {
            background: #0c1322; border:2px solid #0af; border-radius:28px;
            padding:20px; width:320px; text-align:center;
            max-height: 70vh; overflow-y: auto;
        }
        .friend-item {
            display: flex; align-items: center; gap: 12px; padding: 8px;
            border-radius: 20px; background: rgba(0,255,255,0.05); margin-bottom: 8px; cursor: pointer;
        }
        .friend-item:hover { background: rgba(0,255,255,0.2); }
        .emoji-picker {
            display: flex; gap: 8px; flex-wrap: wrap;
            justify-content: center; margin: 12px 0; font-size: 28px;
        }
        .emoji-option { cursor: pointer; padding: 4px 8px; border-radius: 12px; }
        .emoji-option:hover { background: #0af; }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let friends = JSON.parse(localStorage.getItem('friends') || '{}');
    let groups = JSON.parse(localStorage.getItem('groups') || '[]');
    let channels = JSON.parse(localStorage.getItem('channels') || '[]');
    let replyTo = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveFriends() { localStorage.setItem('friends', JSON.stringify(friends)); }
    function saveGroups() { localStorage.setItem('groups', JSON.stringify(groups)); }
    function saveChannels() { localStorage.setItem('channels', JSON.stringify(channels)); }

    function showToast(message, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.innerHTML = `<h3>${message}</h3><button onclick="this.parentElement.remove()">ОК</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }

    function validateLogin(login) {
        return /^[a-zA-Z0-9_+\-~]+$/.test(login) && login.length <= 20 && login.length >= 3;
    }

    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn">Вход</button>
                        <button id="showRegBtn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `<input type="text" id="login" placeholder="Логин (латиница, цифры, _+-~)"><input type="password" id="password" placeholder="Пароль"><button id="doLogin">Войти</button>`;
        document.getElementById('doLogin').onclick = async () => {
            const login = document.getElementById('login').value;
            const pwd = document.getElementById('password').value;
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password: pwd }) });
            const data = await res.json();
            if (data.error) showToast(data.error, true);
            else { currentUser = data.login; currentUserData = data.user; startMessenger(); }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `<input type="text" id="regLogin" placeholder="Логин (латиница, цифры, _+-~)"><input type="password" id="regPassword" placeholder="Пароль"><input type="date" id="regBirthdate"><textarea id="regAbout" rows="2" placeholder="О себе"></textarea><button id="doReg">Зарегистрироваться</button>`;
        document.getElementById('doReg').onclick = async () => {
            const login = document.getElementById('regLogin').value;
            if (!validateLogin(login)) { showToast('Логин: только латиница, цифры и _+-~ (3-20 символов)', true); return; }
            const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password: document.getElementById('regPassword').value, name: login, surname: '', birthdate: document.getElementById('regBirthdate').value, about: document.getElementById('regAbout').value, favoriteGames: [] }) });
            const data = await res.json();
            if (data.error) showToast(data.error, true);
            else { showToast('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    function showUserProfile(login) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { showToast('Пользователь не найден', true); return; }
                const avatar = userAvatars[login] || null;
                const isFriend = friends[currentUser] && friends[currentUser].includes(login);
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="profile-card">
                        <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div>
                        <h2>@${data.login}</h2>
                        <div><strong>📅 Дата рождения:</strong> ${data.birthdate || 'не указана'}</div>
                        <div><strong>📝 О себе:</strong> ${data.about || 'не указано'}</div>
                        <button id="friendBtn">${isFriend ? '❌ Удалить из друзей' : '➕ Добавить в друзья'}</button>
                        <button id="msgBtn">💬 Написать сообщение</button>
                        <button id="closeBtn">Закрыть</button>
                    </div>
                `;
                document.body.appendChild(modal);
                modal.querySelector('#friendBtn').onclick = () => {
                    if (!friends[currentUser]) friends[currentUser] = [];
                    if (isFriend) friends[currentUser] = friends[currentUser].filter(f => f !== login);
                    else friends[currentUser].push(login);
                    saveFriends();
                    modal.remove();
                    showToast(isFriend ? 'Удалён из друзей' : 'Добавлен в друзья');
                };
                modal.querySelector('#msgBtn').onclick = () => {
                    const chatId = `chat_${Date.now()}`;
                    allChats.push({ id: chatId, name: login, avatar: '💬', members: [currentUser, login] });
                    messagesData[chatId] = [];
                    renderChats();
                    currentChat = chatId;
                    currentChatName = login;
                    document.getElementById('chatTitle').innerText = login;
                    renderMessages();
                    socket.emit('join', currentChat);
                    modal.remove();
                };
                modal.querySelector('#closeBtn').onclick = () => modal.remove();
            });
    }

    function getAvatarForUser(login) {
        const avatar = userAvatars[login];
        if (avatar) return `<div class="message-avatar" style="background-image:url(${avatar}); background-size:cover;"></div>`;
        return `<div class="message-avatar">⚡</div>`;
    }

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        const msgs = messagesData[currentChat] || [];
        if (msgs.length === 0) {
            container.innerHTML = '<div style="text-align:center; opacity:0.5;">💬 Начните общение</div>';
            return;
        }
        container.innerHTML = msgs.map((msg, idx) => {
            const avatarHtml = getAvatarForUser(msg.from);
            return `
                <div class="message ${msg.from === currentUser ? 'my-message' : ''}" data-msg-idx="${idx}">
                    <div class="message-avatar" onclick="showUserProfile('${msg.from}')">${avatarHtml}</div>
                    <div class="message-content">
                        <strong>${msg.from}:</strong> ${msg.text}<br>
                        <small>${msg.time}</small>
                        <div class="message-actions">
                            <span class="reply-action">↩️ Ответить</span>
                            <span class="forward-action">📤 Переслать</span>
                            ${msg.from === currentUser ? '<span class="delete-action">🗑️ Удалить</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        document.querySelectorAll('.reply-action').forEach(el => {
            el.onclick = () => {
                const idx = el.closest('.message').dataset.msgIdx;
                const msg = msgs[idx];
                replyTo = { text: msg.text, from: msg.from };
                document.getElementById('msgInput').focus();
                document.getElementById('replyIndicator').innerText = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0, 40)}"`;
                document.getElementById('cancelReplyBtn').style.display = 'inline-block';
            };
        });
        document.querySelectorAll('.forward-action').forEach(el => {
            el.onclick = () => showToast('Пересылка в разработке');
        });
        document.querySelectorAll('.delete-action').forEach(el => {
            el.onclick = () => {
                const idx = el.closest('.message').dataset.msgIdx;
                const msg = msgs[idx];
                if (msg && msg.from === currentUser) {
                    if (confirm('Удалить сообщение?')) socket.emit('deleteMessage', { chatId: currentChat, messageIndex: idx });
                } else showToast('Можно удалять только свои сообщения', true);
            };
        });
        container.scrollTop = container.scrollHeight;
    }

    function startVoiceRecording() {
        if (isRecording) {
            if (mediaRecorder) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('voiceRecBar').style.display = 'none';
                document.getElementById('msgInput').style.display = 'block';
            }
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = e => {
                    socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<audio src="${e.target.result}" controls style="max-width:200px;"></audio>`, time: getFormattedTime() });
                };
                reader.readAsDataURL(audioBlob);
                stream.getTracks().forEach(track => track.stop());
            };
            mediaRecorder.start();
            isRecording = true;
            document.getElementById('msgInput').style.display = 'none';
            document.getElementById('voiceRecBar').style.display = 'flex';
            let elapsed = 0;
            const interval = setInterval(() => {
                if (!isRecording) { clearInterval(interval); return; }
                elapsed += 0.1;
                const percent = Math.min(100, (elapsed / 60) * 100);
                document.getElementById('voiceWaveFill').style.width = percent + '%';
            }, 100);
        }).catch(() => showToast('Нет доступа к микрофону', true));
    }

    function cancelVoiceRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('voiceRecBar').style.display = 'none';
            document.getElementById('msgInput').style.display = 'block';
        }
    }

    async function startMessenger() {
        await loadChats();
        socket = io();
        socket.on('newMessage', (msg) => {
            if (!messagesData[currentChat]) messagesData[currentChat] = [];
            messagesData[currentChat].push(msg);
            renderMessages();
            if (!mutedChats[currentChat] && msg.from !== currentUser) {
                const audio = new Audio('/sounds/notifica.mp3');
                audio.play().catch(e => console.log);
                document.title = '🔔 Новое сообщение';
                setTimeout(() => document.title = 'StormLink', 3000);
            }
        });
        socket.on('messageDeleted', ({ chatId, messageIndex }) => {
            if (messagesData[chatId]) { messagesData[chatId].splice(messageIndex, 1); if (chatId === currentChat) renderMessages(); }
        });
        document.getElementById('app').innerHTML = `
            <button class="burger-btn" id="burgerBtn">☰</button>
            <div class="messenger">
                <div class="sidebar" id="sidebar">
                    <div class="user-info" id="profileBtn">
                        <div id="userAvatar" class="avatar">⚡</div>
                        <div><strong>${currentUser}</strong></div>
                    </div>
                    <div class="search-player">
                        <input type="text" id="searchInput" placeholder="Поиск (чаты, группы, каналы, друзья)">
                        <button id="searchBtn">🔍</button>
                    </div>
                    <div class="chats-list" id="chatsList"></div>
                    <div class="add-btn" id="createGroupBtn">👥 Создать группу</div>
                    <div class="add-btn" id="createChannelBtn">📢 Создать канал</div>
                </div>
                <div class="chat-area">
                    <div class="chat-header">
                        <span class="chat-title" id="chatTitle">${currentChatName}</span>
                        <div>
                            <button class="icon-btn" id="modeToggleBtn" onclick="document.body.classList.toggle('mobile-mode')">📱</button>
                            <button class="chat-header-dots" id="headerDotsBtn">⋯</button>
                        </div>
                    </div>
                    <div class="chat-messages" id="messagesList"></div>
                    <div id="replyIndicator" style="padding:0 16px; font-size:12px; opacity:0.7; display:flex; justify-content:space-between;">
                        <span></span>
                        <button id="cancelReplyBtn" style="background:none; border:none; color:cyan; cursor:pointer; display:none;">✖ Отмена</button>
                    </div>
                    <div class="chat-input">
                        <button id="emojiBtn">😀</button>
                        <button id="attachBtn">📎</button>
                        <input type="text" id="msgInput" placeholder="Введите сообщение...">
                        <button id="voiceBtn">🎙️</button>
                        <button id="sendBtn">➤</button>
                        <div id="voiceRecBar" style="display:none; align-items:center; gap:12px; flex:1;">
                            <div class="voice-wave"><div id="voiceWaveFill" class="voice-wave-fill"></div></div>
                            <button id="cancelVoiceBtn">✖</button>
                        </div>
                    </div>
                </div>
            </div>
            <button class="friends-icon" id="friendsIcon">👥</button>
        `;
        if (userAvatars[currentUser]) {
            const avatarDiv = document.getElementById('userAvatar');
            avatarDiv.style.backgroundImage = `url(${userAvatars[currentUser]})`;
            avatarDiv.style.backgroundSize = 'cover'; avatarDiv.innerHTML = '';
        }
        renderChats(); renderMessages();
        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (replyTo) {
                text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`;
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
                document.getElementById('cancelReplyBtn').style.display = 'none';
            }
            if (text) { socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text, time: getFormattedTime() }); input.value = ''; }
        };
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });
        document.getElementById('profileBtn').onclick = () => showUserProfile(currentUser);
        document.getElementById('createGroupBtn').onclick = () => {
            const name = prompt('Название группы');
            const login = prompt('Логин группы (латиница)');
            if (name && login && validateLogin(login)) {
                groups.push({ id: Date.now(), name, login, creator: currentUser, members: [currentUser], avatar: '👥' });
                saveGroups();
                showToast(`Группа "${name}" создана`);
            } else showToast('Некорректный логин группы', true);
        };
        document.getElementById('createChannelBtn').onclick = () => {
            const name = prompt('Название канала');
            const login = prompt('Логин канала (латиница)');
            if (name && login && validateLogin(login)) {
                channels.push({ id: Date.now(), name, login, creator: currentUser, members: [], avatar: '📢' });
                saveChannels();
                showToast(`Канал "${name}" создан`);
            } else showToast('Некорректный логин канала', true);
        };
        document.getElementById('headerDotsBtn').onclick = () => {
            const menu = document.createElement('div');
            menu.className = 'chat-menu';
            const isGroup = groups.find(g => g.id == currentChat);
            const isChannel = channels.find(c => c.id == currentChat);
            const isOwner = isGroup?.creator === currentUser || isChannel?.creator === currentUser;
            let html = `<div id="menuClear">🧹 Очистить чат</div>`;
            if (currentChat !== 'favorites') html += `<div id="menuLeave">🚪 Выйти из чата</div>`;
            if (isOwner) html += `<div id="menuDelete">🗑 Удалить чат</div>`;
            html += `<div id="menuNotifications">${mutedChats[currentChat] ? '🔔 Вкл уведомления' : '🔕 Выкл уведомления'}</div>`;
            menu.innerHTML = html;
            document.body.appendChild(menu);
            const rect = document.querySelector('.chat-header-dots').getBoundingClientRect();
            menu.style.position = 'fixed'; menu.style.background = '#0a1428'; menu.style.border = '1px solid #0af'; menu.style.borderRadius = '16px'; menu.style.padding = '8px'; menu.style.zIndex = '200';
            menu.style.left = rect.left - 120 + 'px'; menu.style.top = rect.bottom + 5 + 'px';
            menu.querySelector('#menuClear').onclick = () => { if (confirm(`Очистить чат "${currentChatName}"?`)) { messagesData[currentChat] = []; renderMessages(); } menu.remove(); };
            if (currentChat !== 'favorites' && menu.querySelector('#menuLeave')) menu.querySelector('#menuLeave').onclick = () => { deleteChat(currentChat, currentChatName, true); menu.remove(); };
            if (isOwner && menu.querySelector('#menuDelete')) menu.querySelector('#menuDelete').onclick = () => { deleteChat(currentChat, currentChatName, false); menu.remove(); };
            menu.querySelector('#menuNotifications').onclick = () => { mutedChats[currentChat] = !mutedChats[currentChat]; saveMuted(); renderChats(); menu.remove(); };
            setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 10);
        };
        document.getElementById('emojiBtn').onclick = showEmojiPicker;
        document.getElementById('attachBtn').onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*,video/*';
            input.onchange = (e) => { const file = e.target.files[0]; if (file) sendFile(file); };
            input.click();
        };
        document.getElementById('voiceBtn').onclick = startVoiceRecording;
        document.getElementById('cancelVoiceBtn').onclick = cancelVoiceRecording;
        document.getElementById('cancelReplyBtn').onclick = () => { replyTo = null; document.getElementById('replyIndicator').innerText = ''; document.getElementById('cancelReplyBtn').style.display = 'none'; };
        document.getElementById('searchBtn').onclick = () => {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) return;
            const foundGroup = groups.find(g => g.login === query);
            const foundChannel = channels.find(c => c.login === query);
            if (foundGroup) {
                if (!foundGroup.members.includes(currentUser)) {
                    if (confirm(`Вступить в группу "${foundGroup.name}"?`)) {
                        foundGroup.members.push(currentUser);
                        saveGroups();
                        showToast(`Вы вступили в группу ${foundGroup.name}`);
                        renderChats();
                    }
                } else showToast('Вы уже участник');
            } else if (foundChannel) {
                if (!foundChannel.members.includes(currentUser)) {
                    if (confirm(`Подписаться на канал "${foundChannel.name}"?`)) {
                        foundChannel.members.push(currentUser);
                        saveChannels();
                        showToast(`Вы подписались на канал ${foundChannel.name}`);
                        renderChats();
                    }
                } else showToast('Вы уже подписаны');
            } else showToast('Группа/канал не найдены', true);
        };
        document.getElementById('friendsIcon').onclick = () => {
            const userFriends = friends[currentUser] || [];
            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `<div class="friends-list"><h3>👥 Друзья</h3><div id="friendsContainer"></div><button id="closeFriends">Закрыть</button></div>`;
            document.body.appendChild(modal);
            const container = modal.querySelector('#friendsContainer');
            if (userFriends.length === 0) container.innerHTML = '<p>Нет друзей</p>';
            else userFriends.forEach(login => {
                const div = document.createElement('div');
                div.className = 'friend-item';
                const avatar = userAvatars[login] || null;
                div.innerHTML = `<div class="avatar" style="width:36px; height:36px; font-size:18px; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div><div><strong>${login}</strong><br>@${login}</div>`;
                div.onclick = () => { modal.remove(); showUserProfile(login); };
                container.appendChild(div);
            });
            modal.querySelector('#closeFriends').onclick = () => modal.remove();
        };
        document.getElementById('burgerBtn').onclick = () => {
            document.getElementById('sidebar').classList.toggle('open');
        };
        socket.emit('join', currentChat);
    }

    function sendFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const content = e.target.result;
            let html = '';
            if (file.type.startsWith('image/')) html = `<img src="${content}" class="media-content" onclick="viewMedia('${content}', 'image')">`;
            else if (file.type.startsWith('video/')) html = `<video src="${content}" class="media-content" controls></video>`;
            else html = `<div class="file-content">📎 ${file.name} (${(file.size/1024/1024).toFixed(2)} МБ)</div>`;
            socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: html, time: getFormattedTime() });
        };
        reader.readAsDataURL(file);
    }

    function showEmojiPicker() {
        const emojis = ['😀','😂','😍','😎','🔥','⭐','🎮','⚡','💀','❤️','👍'];
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="modal-box"><h3>Эмодзи</h3><div class="emoji-picker" id="emojiGrid"></div><button id="closeEmoji">Закрыть</button></div>`;
        document.body.appendChild(modal);
        const grid = modal.querySelector('#emojiGrid');
        emojis.forEach(emoji => {
            const span = document.createElement('span');
            span.className = 'emoji-option';
            span.innerText = emoji;
            span.onclick = () => { document.getElementById('msgInput').value += emoji; modal.remove(); };
            grid.appendChild(span);
        });
        modal.querySelector('#closeEmoji').onclick = () => modal.remove();
    }

    function deleteChat(chatId, chatName, leaveOnly) {
        if (chatId === 'favorites') { showToast('Избранное нельзя удалить', true); return; }
        if (confirm(leaveOnly ? `Выйти из чата "${chatName}"?` : `Удалить чат "${chatName}"?`)) {
            if (leaveOnly) {
                const group = groups.find(g => g.id == chatId);
                if (group) group.members = group.members.filter(m => m !== currentUser);
                const channel = channels.find(c => c.id == chatId);
                if (channel) channel.members = channel.members.filter(m => m !== currentUser);
                saveGroups(); saveChannels();
            } else {
                groups = groups.filter(g => g.id != chatId);
                channels = channels.filter(c => c.id != chatId);
                saveGroups(); saveChannels();
            }
            allChats = allChats.filter(c => c.id !== chatId);
            delete messagesData[chatId];
            renderChats();
            if (currentChat === chatId) { currentChat = 'favorites'; currentChatName = 'Избранное'; document.getElementById('chatTitle').innerText = 'Избранное'; renderMessages(); socket.emit('join', currentChat); }
        }
    }

    async function loadChats() {
        const res = await fetch('/chats');
        let chats = await res.json();
        allChats = chats.filter(c => c.name !== 'Новости ST_Link' && !deletedChats.includes(c.id));
        if (!allChats.find(c => c.id === 'favorites')) allChats.unshift({ id: 'favorites', name: 'Избранное', avatar: '⭐', private: true });
        groups.forEach(g => { if (g.members.includes(currentUser)) allChats.push({ id: g.id, name: g.name, avatar: g.avatar, isGroup: true, creator: g.creator }); });
        channels.forEach(c => { if (c.members.includes(currentUser)) allChats.push({ id: c.id, name: c.name, avatar: c.avatar, isChannel: true, creator: c.creator }); });
    }

    function renderChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        container.innerHTML = '';
        allChats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="chat-info"><span>${chat.avatar || '💬'}</span><span>${chat.name} ${mutedChats[chat.id] ? '🔇' : ''}</span></div>`;
            div.onclick = () => {
                currentChat = chat.id;
                currentChatName = chat.name;
                document.getElementById('chatTitle').innerText = chat.name;
                loadMessages();
                socket.emit('join', currentChat);
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
                document.getElementById('cancelReplyBtn').style.display = 'none';
            };
            container.appendChild(div);
        });
    }

    async function loadMessages() {
        const res = await fetch(`/messages/${currentChat}`);
        messagesData[currentChat] = await res.json();
        renderMessages();
    }

    renderAuth();
</script>
</body>
</html>
