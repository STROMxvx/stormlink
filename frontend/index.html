<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .messenger {
            width: 1300px;
            height: 85vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid #0af;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.1);
            border-radius: 40px;
            cursor: pointer;
            flex-wrap: wrap;
        }
        .user-info:hover { background: rgba(0,255,255,0.2); }
        .avatar {
            width: 48px;
            height: 48px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background-size: cover;
            background-position: center;
        }
        .change-login-btn {
            background: none;
            border: 1px solid #0af;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            color: cyan;
            margin-left: auto;
        }
        .change-login-btn:hover { background: #0af; color: black; }
        .search-player {
            background: rgba(0,255,255,0.05);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
        }
        .search-player input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }
        .search-player button {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
        }
        .chats-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .chat-item {
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item:hover { background: rgba(0,255,255,0.15); }
        .chat-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }
        .chat-muted-icon { font-size: 14px; margin-left: 8px; opacity: 0.7; }
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title { font-size: 20px; font-weight: bold; cursor: pointer; }
        .chat-header-dots {
            background: none;
            border: none;
            color: cyan;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 12px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .message {
            max-width: 60%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            word-wrap: break-word;
            transition: 0.2s;
            position: relative;
        }
        .message:hover .msg-actions { display: flex; }
        .msg-actions {
            position: absolute;
            bottom: -20px;
            right: 0;
            display: none;
            gap: 8px;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 20px;
            z-index: 10;
        }
        .msg-actions span {
            cursor: pointer;
            font-size: 14px;
            padding: 2px;
        }
        .msg-actions span:hover { transform: scale(1.1); }
        .my-message { align-self: flex-end; background: #0af; color: black; }
        .chat-input {
            display: flex;
            padding: 16px;
            gap: 12px;
            border-top: 1px solid #0af;
            align-items: center;
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 16px;
        }
        .chat-input button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #0af;
            padding: 0 12px;
        }
        .reply-indicator {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
        }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #0af;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .modal {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 350px;
            text-align: center;
        }
        .modal-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 10px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        .burger-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -300px;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 1000;
                transition: left 0.3s;
                background: #0a1428;
            }
            .sidebar.open { left: 0; }
            .burger-btn { display: block; }
            .messenger { border-radius: 0; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let replyTo = null;

    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }

    function getFormattedTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const day = now.getDate().toString().padStart(2, '0');
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const year = now.getFullYear();
        return `${hours}:${minutes}, ${day}.${month}.${year}`;
    }

    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn">Вход</button>
                        <button id="showRegBtn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `
            <input type="text" id="login" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button id="doLogin">Войти</button>
        `;
        document.getElementById('doLogin').onclick = async () => {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('password').value })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { 
                currentUser = data.login;
                currentUserData = data.user;
                startMessenger(); 
            }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `
            <input type="text" id="regLogin" placeholder="Логин">
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="text" id="regName" placeholder="Имя">
            <input type="text" id="regSurname" placeholder="Фамилия">
            <input type="date" id="regBirthdate">
            <textarea id="regAbout" rows="2" placeholder="О себе"></textarea>
            <button id="doReg">Зарегистрироваться</button>
        `;
        document.getElementById('doReg').onclick = async () => {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login: document.getElementById('regLogin').value,
                    password: document.getElementById('regPassword').value,
                    name: document.getElementById('regName').value,
                    surname: document.getElementById('regSurname').value,
                    birthdate: document.getElementById('regBirthdate').value,
                    about: document.getElementById('regAbout').value,
                    favoriteGames: []
                })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { alert('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    function addMessageActions() {
        document.querySelectorAll('.msg-actions').forEach(el => el.remove());
        const messages = document.querySelectorAll('.message');
        messages.forEach((msg, idx) => {
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            actions.innerHTML = `
                <span class="reply-action" data-idx="${idx}">↩️</span>
                <span class="forward-action" data-idx="${idx}">➡️</span>
                <span class="delete-action" data-idx="${idx}">🗑️</span>
            `;
            msg.appendChild(actions);
        });
        
        document.querySelectorAll('.reply-action').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.idx);
                const msgs = messagesData[currentChat] || [];
                const msg = msgs[idx];
                if (msg) {
                    replyTo = { text: msg.text, from: msg.from };
                    document.getElementById('msgInput').focus();
                    const indicator = document.getElementById('replyIndicator');
                    if (indicator) indicator.innerText = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0, 40)}"`;
                }
            };
        });
        
        document.querySelectorAll('.forward-action').forEach(el => {
            el.onclick = () => alert('Пересылка в разработке');
        });
        
        document.querySelectorAll('.delete-action').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.idx);
                const msgs = messagesData[currentChat] || [];
                const msg = msgs[idx];
                if (msg && msg.from === currentUser && confirm('Удалить сообщение?')) {
                    socket.emit('deleteMessage', { chatId: currentChat, messageIndex: idx });
                } else if (msg && msg.from !== currentUser) {
                    alert('Можно удалять только свои сообщения');
                }
            };
        });
    }

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        const msgs = messagesData[currentChat] || [];
        if (msgs.length === 0) {
            container.innerHTML = '<div style="text-align:center; opacity:0.5;">💬 Начните общение</div>';
            return;
        }
        container.innerHTML = msgs.map((msg, idx) => {
            const replyHtml = msg.replyTo ? `<div class="reply-indicator">↩️ Ответ ${msg.replyTo.from}: "${msg.replyTo.text.substring(0, 40)}"</div>` : '';
            return `
                <div class="message ${msg.from === currentUser ? 'my-message' : ''}" data-msg-idx="${idx}">
                    ${replyHtml}
                    <strong>${msg.from}:</strong> ${msg.text}<br>
                    <small>${msg.time}</small>
                </div>
            `;
        }).join('');
        addMessageActions();
        container.scrollTop = container.scrollHeight;
    }

    async function startMessenger() {
        await loadChats();
        socket = io();
        socket.on('newMessage', (msg) => {
            if (!messagesData[currentChat]) messagesData[currentChat] = [];
            messagesData[currentChat].push(msg);
            renderMessages();
        });
        socket.on('messageDeleted', ({ chatId, messageIndex }) => {
            if (messagesData[chatId]) {
                messagesData[chatId].splice(messageIndex, 1);
                if (chatId === currentChat) renderMessages();
            }
        });

        document.getElementById('app').innerHTML = `
            <button class="burger-btn" id="burgerBtn">☰</button>
            <div class="messenger">
                <div class="sidebar" id="sidebar">
                    <div class="user-info" id="profileBtn">
                        <div class="avatar" id="userAvatar">⚡</div>
                        <div><strong>${currentUser}</strong></div>
                        <button class="change-login-btn" id="changeLoginBtn">✏️ сменить логин</button>
                    </div>
                    <div class="search-player">
                        <input type="text" id="chatSearchInput" placeholder="Поиск чатов...">
                        <button id="searchBtn">🔍</button>
                    </div>
                    <div class="chats-list" id="chatsList"></div>
                    <div class="add-btn" id="createChatBtn">+ Создать чат</div>
                </div>
                <div class="chat-area">
                    <div class="chat-header">
                        <span class="chat-title" id="chatTitle">${currentChatName}</span>
                        <button class="chat-header-dots" id="menuBtn">⋯</button>
                    </div>
                    <div class="chat-messages" id="messagesList"></div>
                    <div id="replyIndicator" style="padding:0 16px; font-size:12px; opacity:0.7;"></div>
                    <div class="chat-input">
                        <button id="emojiBtn">😀</button>
                        <button id="attachBtn">📎</button>
                        <input type="text" id="msgInput" placeholder="Введите сообщение...">
                        <button id="sendBtn">➤</button>
                    </div>
                </div>
            </div>
        `;

        if (userAvatars[currentUser]) {
            const avatarDiv = document.getElementById('userAvatar');
            avatarDiv.style.backgroundImage = `url(${userAvatars[currentUser]})`;
            avatarDiv.style.backgroundSize = 'cover';
            avatarDiv.innerHTML = '';
        }

        renderChats();
        renderMessages();

        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;
            const finalText = replyTo ? `↩️ ${replyTo.from}: "${replyTo.text.substring(0, 40)}"\n${text}` : text;
            socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: finalText, replyTo: replyTo ? { from: replyTo.from, text: replyTo.text } : null, time: getFormattedTime() });
            input.value = '';
            replyTo = null;
            document.getElementById('replyIndicator').innerText = '';
        };
        document.getElementById('msgInput').onkeypress = (e) => e.key === 'Enter' && document.getElementById('sendBtn').click();
        document.getElementById('createChatBtn').onclick = showCreateChatModal;
        document.getElementById('profileBtn').onclick = () => showUserProfile(true, currentUserData);
        document.getElementById('changeLoginBtn').onclick = showChangeLoginModal;
        document.getElementById('menuBtn').onclick = showChatMenu;
        document.getElementById('emojiBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            input.value += '😀';
            input.focus();
        };
        document.getElementById('attachBtn').onclick = () => alert('Прикрепление файлов в разработке');
        document.getElementById('searchBtn').onclick = () => filterChats();
        document.getElementById('chatSearchInput').oninput = () => filterChats();
        document.getElementById('burgerBtn').onclick = () => {
            document.getElementById('sidebar').classList.toggle('open');
        };

        socket.emit('join', currentChat);
    }

    function showChangeLoginModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-box">
                <h3>Сменить логин</h3>
                <input type="text" id="newLogin" placeholder="Новый логин" value="${currentUser}">
                <div class="modal-buttons">
                    <button id="saveLoginBtn">Сохранить</button>
                    <button id="cancelLoginBtn">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#saveLoginBtn').onclick = async () => {
            const newLogin = modal.querySelector('#newLogin').value.trim();
            if (!newLogin) return alert('Введите логин');
            const res = await fetch('/change-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oldLogin: currentUser, newLogin })
            });
            const data = await res.json();
            if (data.success) {
                alert('Логин изменён! Перезагрузите страницу.');
                localStorage.setItem('userLogin', newLogin);
                location.reload();
            } else alert(data.error || 'Ошибка');
        };
        modal.querySelector('#cancelLoginBtn').onclick = () => modal.remove();
    }

    function filterChats() {
        const query = document.getElementById('chatSearchInput')?.value.toLowerCase() || '';
        const container = document.getElementById('chatsList');
        if (!container) return;
        const items = container.querySelectorAll('.chat-item');
        items.forEach(item => {
            const name = item.querySelector('.chat-info span:last-child')?.innerText.toLowerCase() || '';
            item.style.display = name.includes(query) || query === '' ? 'flex' : 'none';
        });
    }

    function showChatMenu() {
        alert('Меню чата (настройки, очистка и т.д.)');
    }

    function showUserProfile(isOwn, userData) {
        alert(`Профиль: ${userData?.name || currentUser}`);
    }

    async function loadChats() {
        const res = await fetch('/chats');
        let chats = await res.json();
        allChats = chats.filter(c => c.name !== 'Новости ST_Link' && !deletedChats.includes(c.id));
        if (!allChats.find(c => c.id === 'favorites')) allChats.unshift({ id: 'favorites', name: 'Избранное', avatar: '⭐', isPrivate: true });
    }

    function renderChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        container.innerHTML = '';
        allChats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="chat-info"><span>${chat.avatar || '💬'}</span><span>${chat.name}</span></div>`;
            div.onclick = () => {
                currentChat = chat.id;
                currentChatName = chat.name;
                document.getElementById('chatTitle').innerText = chat.name;
                loadMessages();
                socket.emit('join', chat.id);
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
            };
            container.appendChild(div);
        });
        filterChats();
    }

    async function loadMessages() {
        const res = await fetch(`/messages/${currentChat}`);
        messagesData[currentChat] = await res.json();
        renderMessages();
    }

    function showCreateChatModal() {
        alert('Создание чата (будет в следующей версии)');
    }

    renderAuth();
</script>
</body>
</html>
