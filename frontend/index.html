<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .messenger {
            width: 1300px;
            height: 85vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid #0af;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.1);
            border-radius: 40px;
            cursor: pointer;
        }
        .user-info:hover { background: rgba(0,255,255,0.2); }
        .avatar {
            width: 48px;
            height: 48px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background-size: cover;
            background-position: center;
        }
        .change-login-btn {
            background: none;
            border: 1px solid #0af;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 11px;
            cursor: pointer;
            color: cyan;
            margin-left: auto;
        }
        .change-login-btn:hover { background: #0af; color: black; }
        .chat-title {
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-title:hover { text-shadow: 0 0 8px #0af; }
        .search-player {
            background: rgba(0,255,255,0.05);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
        }
        .search-player input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }
        .search-player button {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
        }
        .chats-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .chat-item {
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item:hover { background: rgba(0,255,255,0.15); }
        .chat-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }
        .subgroup-item {
            margin-left: 28px;
            padding: 6px;
            font-size: 13px;
            border-radius: 16px;
            background: rgba(0,255,255,0.05);
            cursor: pointer;
        }
        .subgroup-item:hover { background: rgba(0,255,255,0.15); }
        .chat-muted-icon { font-size: 14px; margin-left: 8px; opacity: 0.7; }
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header-dots {
            background: none;
            border: none;
            color: cyan;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 12px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .message {
            max-width: 60%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            word-wrap: break-word;
            transition: 0.2s;
            position: relative;
        }
        .message:hover .msg-actions { display: flex; }
        .msg-actions {
            position: absolute;
            bottom: -25px;
            right: 0;
            display: none;
            gap: 8px;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 20px;
            z-index: 10;
        }
        .msg-actions span { cursor: pointer; font-size: 14px; padding: 2px; }
        .msg-actions span:hover { transform: scale(1.1); }
        .my-message { align-self: flex-end; background: #0af; color: black; }
        .chat-input {
            display: flex;
            padding: 16px;
            gap: 12px;
            border-top: 1px solid #0af;
            align-items: center;
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 16px;
        }
        .chat-input button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #0af;
            padding: 0 12px;
        }
        .reply-indicator {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
        }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #0af;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .modal {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 350px;
            text-align: center;
        }
        .modal-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button { flex: 1; padding: 10px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        .burger-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -300px;
                top: 0;
                bottom: 0;
                width: 280px;
                z-index: 1000;
                transition: left 0.3s;
                background: #0a1428;
            }
            .sidebar.open { left: 0; }
            .burger-btn { display: block; }
            .messenger { border-radius: 0; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let subgroups = JSON.parse(localStorage.getItem('subgroups') || '{}');
    let replyTo = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentMatches = [];
    let currentMatchIndex = -1;

    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveSubgroups() { localStorage.setItem('subgroups', JSON.stringify(subgroups)); }

    function getFormattedTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const day = now.getDate().toString().padStart(2, '0');
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const year = now.getFullYear();
        return `${hours}:${minutes}, ${day}.${month}.${year}`;
    }

    function showSuccessMessage(text) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="success-toast">✅ ${text}</div>`;
        document.body.appendChild(modal);
        setTimeout(() => modal.remove(), 1500);
    }

    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn">Вход</button>
                        <button id="showRegBtn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `
            <input type="text" id="login" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button id="doLogin">Войти</button>
        `;
        document.getElementById('doLogin').onclick = async () => {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: document.getElementById('login').value, password: document.getElementById('password').value })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { 
                currentUser = data.login;
                currentUserData = data.user;
                startMessenger(); 
            }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `
            <input type="text" id="regLogin" placeholder="Логин">
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="text" id="regName" placeholder="Имя">
            <input type="text" id="regSurname" placeholder="Фамилия">
            <input type="date" id="regBirthdate">
            <textarea id="regAbout" rows="2" placeholder="О себе"></textarea>
            <button id="doReg">Зарегистрироваться</button>
        `;
        document.getElementById('doReg').onclick = async () => {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login: document.getElementById('regLogin').value,
                    password: document.getElementById('regPassword').value,
                    name: document.getElementById('regName').value,
                    surname: document.getElementById('regSurname').value,
                    birthdate: document.getElementById('regBirthdate').value,
                    about: document.getElementById('regAbout').value,
                    favoriteGames: []
                })
            });
            const data = await res.json();
            if (data.error) alert(data.error);
            else { alert('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    function addMessageActions() {
        document.querySelectorAll('.msg-actions').forEach(el => el.remove());
        const messages = document.querySelectorAll('.message');
        messages.forEach((msg, idx) => {
            const actions = document.createElement('div');
            actions.className = 'msg-actions';
            actions.innerHTML = `
                <span class="reply-action" data-idx="${idx}">↩️</span>
                <span class="forward-action" data-idx="${idx}">➡️</span>
                <span class="delete-action" data-idx="${idx}">🗑️</span>
            `;
            msg.appendChild(actions);
        });
        
        document.querySelectorAll('.reply-action').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.idx);
                const msgs = messagesData[currentChat] || [];
                const msg = msgs[idx];
                if (msg) {
                    replyTo = { text: msg.text, from: msg.from };
                    document.getElementById('msgInput').focus();
                    const indicator = document.getElementById('replyIndicator');
                    if (indicator) indicator.innerText = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0, 40)}"`;
                }
            };
        });
        
        document.querySelectorAll('.forward-action').forEach(el => {
            el.onclick = () => alert('Пересылка в разработке');
        });
        
        document.querySelectorAll('.delete-action').forEach(el => {
            el.onclick = () => {
                const idx = parseInt(el.dataset.idx);
                const msgs = messagesData[currentChat] || [];
                const msg = msgs[idx];
                if (msg && msg.from === currentUser && confirm('Удалить сообщение?')) {
                    socket.emit('deleteMessage', { chatId: currentChat, messageIndex: idx });
                } else if (msg && msg.from !== currentUser) {
                    alert('Можно удалять только свои сообщения');
                }
            };
        });
    }

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        const msgs = messagesData[currentChat] || [];
        if (msgs.length === 0) {
            container.innerHTML = '<div style="text-align:center; opacity:0.5;">💬 Начните общение</div>';
            return;
        }
        container.innerHTML = msgs.map((msg, idx) => {
            return `
                <div class="message ${msg.from === currentUser ? 'my-message' : ''}" data-msg-idx="${idx}">
                    <strong>${msg.from}:</strong> ${msg.text}<br>
                    <small>${msg.time}</small>
                </div>
            `;
        }).join('');
        addMessageActions();
        container.scrollTop = container.scrollHeight;
    }

    function showProfile() {
        const avatarUrl = userAvatars[currentUser] || null;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                <h2>${currentUserData?.name || currentUser} ${currentUserData?.surname || ''}</h2>
                <p>@${currentUser}</p>
                <hr style="margin:15px 0;">
                <div><strong>📝 О себе:</strong> ${currentUserData?.about || 'не указано'}</div>
                <div><strong>📅 Дата рождения:</strong> ${currentUserData?.birthdate || 'не указана'}</div>
                <button id="editProfileBtn">✏️ Редактировать</button>
                <button class="change-login-btn" id="changeLoginBtnFromProfile">✏️ Сменить логин</button>
                <button id="closeProfileBtn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#editProfileBtn').onclick = () => { modal.remove(); showEditProfileModal(); };
        modal.querySelector('#changeLoginBtnFromProfile').onclick = () => { modal.remove(); showChangeLoginModal(); };
        modal.querySelector('#closeProfileBtn').onclick = () => modal.remove();
    }

    function showEditProfileModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        const avatarUrl = userAvatars[currentUser] || null;
        modal.innerHTML = `
            <div class="modal-box">
                <h3>✏️ Редактировать профиль</h3>
                <div style="display:flex; justify-content:center; margin:10px;">
                    <div id="avatarPreview" class="avatar" style="width:80px; height:80px; font-size:40px; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                </div>
                <button id="changeAvatarBtn">📷 Сменить фото</button>
                <input type="text" id="editName" placeholder="Имя" value="${currentUserData?.name || ''}">
                <input type="text" id="editSurname" placeholder="Фамилия" value="${currentUserData?.surname || ''}">
                <input type="date" id="editBirthdate" value="${currentUserData?.birthdate || ''}">
                <textarea id="editAbout" rows="3" placeholder="О себе">${currentUserData?.about || ''}</textarea>
                <div class="modal-buttons">
                    <button id="saveProfileBtn">💾 Сохранить</button>
                    <button id="cancelEditBtn">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        
        modal.querySelector('#changeAvatarBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file && file.size <= 4 * 1024 * 1024) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        userAvatars[currentUser] = ev.target.result;
                        saveAvatars();
                        const preview = modal.querySelector('#avatarPreview');
                        preview.style.backgroundImage = `url(${ev.target.result})`;
                        preview.style.backgroundSize = 'cover';
                        preview.innerHTML = '';
                        showSuccessMessage('Фото обновлено');
                    };
                    reader.readAsDataURL(file);
                } else if (file) alert('Файл больше 4 МБ');
            };
            input.click();
        };
        
        modal.querySelector('#saveProfileBtn').onclick = async () => {
            const updatedData = {
                name: modal.querySelector('#editName').value,
                surname: modal.querySelector('#editSurname').value,
                birthdate: modal.querySelector('#editBirthdate').value,
                about: modal.querySelector('#editAbout').value
            };
            currentUserData = { ...currentUserData, ...updatedData };
            try {
                const res = await fetch('/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: currentUser, ...updatedData })
                });
                const data = await res.json();
                if (data.success) {
                    modal.remove();
                    showSuccessMessage('Изменения сохранены');
                } else alert('Ошибка на сервере');
            } catch (err) {
                alert('Ошибка соединения, но данные сохранены локально');
                modal.remove();
                showSuccessMessage('Изменения сохранены локально');
            }
        };
        modal.querySelector('#cancelEditBtn').onclick = () => modal.remove();
    }

    function showChangeLoginModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-box">
                <h3>Сменить логин</h3>
                <input type="text" id="newLogin" placeholder="Новый логин" value="${currentUser}">
                <div class="modal-buttons">
                    <button id="saveLoginBtn">Сохранить</button>
                    <button id="cancelLoginBtn">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#saveLoginBtn').onclick = async () => {
            const newLogin = modal.querySelector('#newLogin').value.trim();
            if (!newLogin) return alert('Введите логин');
            const res = await fetch('/change-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ oldLogin: currentUser, newLogin })
            });
            const data = await res.json();
            if (data.success) {
                alert('Логин изменён! Перезагрузите страницу.');
                localStorage.setItem('userLogin', newLogin);
                location.reload();
            } else alert(data.error || 'Ошибка');
        };
        modal.querySelector('#cancelLoginBtn').onclick = () => modal.remove();
    }

    function sendMessageToChat(content, type = 'text') {
        let messageHtml = content;
        if (type === 'image') {
            messageHtml = `<img src="${content}" class="media-content" onclick="viewMedia('${content}', 'image')">`;
        } else if (type === 'video') {
            messageHtml = `<video src="${content}" class="media-content" controls></video>`;
        } else if (type === 'file') {
            const fileName = content.name;
            const fileUrl = content.url;
            messageHtml = `<div class="file-content" onclick="downloadFile('${fileUrl}', '${fileName}')">📎 ${fileName} (${(content.size / 1024 / 1024).toFixed(2)} МБ)</div>`;
        } else if (type === 'audio') {
            messageHtml = `<audio src="${content}" controls style="max-width:200px;"></audio>`;
        }
        socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: messageHtml, time: getFormattedTime() });
    }

    function sendFile(file) {
        if (!file) return;
        const size = file.size;
        const maxSize = 100 * 1024 * 1024;
        if (size > maxSize) { alert('Файл больше 100 МБ'); return; }
        
        const messageId = Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'message my-message';
        loadingDiv.id = `loading-${messageId}`;
        loadingDiv.innerHTML = `<div class="upload-progress"></div> Загрузка 0%`;
        const messagesContainer = document.getElementById('messagesList');
        messagesContainer.appendChild(loadingDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        
        const reader = new FileReader();
        reader.onload = (e) => {
            const fileData = e.target.result;
            let percent = 0;
            const interval = setInterval(() => {
                percent += 20;
                const loadingDivElem = document.getElementById(`loading-${messageId}`);
                if (loadingDivElem) loadingDivElem.innerHTML = `<div class="upload-progress"></div> Загрузка ${percent}%`;
                if (percent >= 100) {
                    clearInterval(interval);
                    if (file.type.startsWith('image/')) {
                        sendMessageToChat(fileData, 'image');
                    } else if (file.type.startsWith('video/')) {
                        sendMessageToChat(fileData, 'video');
                    } else {
                        const fileObj = { name: file.name, size: size, url: fileData };
                        sendMessageToChat(fileObj, 'file');
                    }
                    if (loadingDivElem) loadingDivElem.remove();
                }
            }, 150);
        };
        reader.readAsDataURL(file);
    }

    window.viewMedia = (src, type) => {
        const modal = document.createElement('div');
        modal.className = 'modal';
        if (type === 'image') {
            modal.innerHTML = `<img src="${src}" class="media-viewer" style="max-width:90%; max-height:80%; border-radius:16px;">`;
        } else {
            modal.innerHTML = `<video src="${src}" controls style="max-width:90%; max-height:80%;"></video>`;
        }
        modal.onclick = () => modal.remove();
        document.body.appendChild(modal);
    };

    window.downloadFile = (url, name) => {
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
    };

    async function startVoiceRecording() {
        if (isRecording) {
            if (mediaRecorder) {
                mediaRecorder.stop();
                isRecording = false;
                const micBtn = document.getElementById('micBtn');
                if (micBtn) micBtn.style.background = 'none';
            }
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onload = (e) => {
                    sendMessageToChat(e.target.result, 'audio');
                };
                reader.readAsDataURL(audioBlob);
                stream.getTracks().forEach(track => track.stop());
            };
            mediaRecorder.start();
            isRecording = true;
            const micBtn = document.getElementById('micBtn');
            if (micBtn) micBtn.style.background = '#ff3333';
        } catch (err) {
            alert('Не удалось получить доступ к микрофону');
        }
    }

    function performSearch() {
        const query = document.getElementById('messageSearchInput')?.value.toLowerCase();
        const searchCountSpan = document.getElementById('searchCount');
        if (!query) {
            clearAllHighlights();
            if (searchCountSpan) searchCountSpan.innerText = '0';
            return;
        }
        const messages = document.querySelectorAll('.chat-messages .message');
        clearAllHighlights();
        currentMatches = [];
        messages.forEach(msg => {
            const text = msg.innerText.toLowerCase();
            if (text.includes(query)) {
                msg.classList.add('highlight');
                currentMatches.push(msg);
            }
        });
        if (searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
        if (currentMatches.length > 0) {
            currentMatchIndex = 0;
            highlightCurrentMatch();
        } else currentMatchIndex = -1;
    }
    
    function clearAllHighlights() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => {
            msg.classList.remove('highlight', 'current-highlight');
        });
        currentMatches = [];
        currentMatchIndex = -1;
    }
    
    function highlightCurrentMatch() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => msg.classList.remove('current-highlight'));
        if (currentMatchIndex >= 0 && currentMatches[currentMatchIndex]) {
            const currentMsg = currentMatches[currentMatchIndex];
            currentMsg.classList.add('current-highlight');
            currentMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const searchCountSpan = document.getElementById('searchCount');
            if (searchCountSpan) searchCountSpan.innerText = `${currentMatchIndex + 1}/${currentMatches.length}`;
        } else if (currentMatches.length > 0 && searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
    }
    
    function navigateSearch(delta) {
        if (currentMatches.length === 0) return;
        currentMatchIndex += delta;
        if (currentMatchIndex < 0) currentMatchIndex = currentMatches.length - 1;
        if (currentMatchIndex >= currentMatches.length) currentMatchIndex = 0;
        highlightCurrentMatch();
    }

    function openSearch() {
        document.getElementById('searchBar').style.display = 'flex';
        document.getElementById('messageSearchInput').focus();
    }

    function closeSearch() {
        document.getElementById('searchBar').style.display = 'none';

    }

    async function loadChats() {
        const res = await fetch('/chats');

        if (!allChats.find(c => c.id === 'favorites')) allChats.unshift({ id: 'favorites', name: 'Избранное', avatar: '⭐', isPrivate: true });
    }

    function renderChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        container.innerHTML = '';
        allChats.forEach(chat => {
            const isMuted = mutedChats[chat.id];
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="chat-info"><span>${chat.avatar || '💬'}</span><span>${chat.name} ${isMuted ? '<span class="chat-muted-icon">🔇</span>' : ''}</span></div>`;
            div.onclick = () => {
                currentChat = chat.id;
                currentChatName = chat.name;
                document.getElementById('chatTitle').innerText = chat.name;
                loadMessages();
                socket.emit('join', chat.id);
                closeSearch();
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
            };
            container.appendChild(div);
            
            if (subgroups[chat.id] && subgroups[chat.id].length > 0) {
                subgroups[chat.id].forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'subgroup-item';
                    subDiv.innerHTML = `<div class="chat-info"><span>📌</span><span style="font-size:13px;">${sub.name}</span></div>`;
                    subDiv.onclick = (e) => {
                        e.stopPropagation();
                        currentChat = `sub_${sub.id}`;
                        currentChatName = sub.name;
                        document.getElementById('chatTitle').innerText = sub.name;
                        if (!messagesData[currentChat]) messagesData[currentChat] = [];
                        renderMessages();
                        socket.emit('join', currentChat);
                        closeSearch();
                    };
                    container.appendChild(subDiv);
                });
            }
        });
        filterChats();
    }

    async function loadMessages() {
        const res = await fetch(`/messages/${currentChat}`);
        messagesData[currentChat] = await res.json();
        renderMessages();
    }

    renderAuth();
</script>
</body>
</html>
