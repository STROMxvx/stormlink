<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .messenger {
            width: 1300px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        .sidebar {
            width: 300px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            overflow-y: auto;
            transition: transform 0.2s ease;
        }

        body.mobile-mode .messenger {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }
        body.mobile-mode .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 75%;
            max-width: 280px;
            transform: translateX(-100%);
            z-index: 1000;
            border-radius: 0;
        }
        body.mobile-mode .sidebar.open {
            transform: translateX(0);
        }
        body.mobile-mode .burger-btn {
            display: block;
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        body.mobile-mode .friends-icon {
            left: 15px;
            right: auto;
            bottom: 20px;
        }
        body.mobile-mode .chat-header {
            padding-left: 15px;
            padding-right: 60px;
        }
        .burger-btn {
            display: none;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.1);
            border-radius: 40px;
            cursor: pointer;
        }
        .user-info:hover { background: rgba(0,255,255,0.2); }
        .avatar {
            width: 48px;
            height: 48px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background-size: cover;
            background-position: center;
        }
        .search-player {
            background: rgba(0,255,255,0.05);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            gap: 8px;
        }
        .search-player input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
        }
        .search-player button {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 4px 12px;
            cursor: pointer;
        }
        .chats-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .chat-item {
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-item:hover { background: rgba(0,255,255,0.15); }
        .chat-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 1;
        }
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(6,12,24,0.4);
        }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-title {
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-header-dots {
            background: none;
            border: none;
            color: cyan;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 12px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 60%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            word-wrap: break-word;
            position: relative;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .message-content { flex: 1; }
        .my-message {
            align-self: flex-end;
            background: #0af;
            color: black;
        }
        .message-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            justify-content: flex-end;
        }
        .message:hover .message-actions { display: flex; }
        .message-actions span {
            cursor: pointer;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 16px;
        }
        .message-actions span:hover { opacity: 1; background: cyan; color: black; }
        .chat-input {
            display: flex;
            padding: 16px;
            gap: 12px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input {
            flex: 1;
            padding: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 16px;
        }
        .chat-input button {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #0af;
            padding: 0 12px;
            transition: 0.2s;
        }
        .reply-indicator {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
        }
        .voice-recording {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            flex: 1;
        }
        .voice-wave {
            flex: 1;
            height: 30px;
            background: rgba(0,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
        }
        .voice-wave-fill {
            width: 0%;
            height: 100%;
            background: cyan;
            transition: width 0.1s linear;
        }
        .modal-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 280px;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 0 40px rgba(0,255,255,0.3);
        }
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: cyan;
            margin-right: 8px;
        }
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 380px;
            text-align: center;
        }
        .modal-box input, .modal-box textarea, .modal-box select {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            font-family: inherit;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-buttons button { flex: 1; padding: 10px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        .profile-card {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 320px;
            text-align: center;
        }
        .friends-list {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 20px;
            width: 320px;
            text-align: center;
            max-height: 70vh;
            overflow-y: auto;
        }
        .friend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .friend-item:hover { background: rgba(0,255,255,0.2); }
        .friend-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: #0af;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            background-size: cover;
        }
        .emoji-picker {
            display: flex; gap: 8px; flex-wrap: wrap;
            justify-content: center; margin: 12px 0; font-size: 28px;
        }
        .emoji-option { cursor: pointer; padding: 4px 8px; border-radius: 12px; }
        .emoji-option:hover { background: #0af; }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .auth-buttons { display: flex; gap: 10px; margin: 20px 0; }
        .auth-btn {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-result-item {
            background: rgba(0,255,255,0.15);
            border: 1px solid #0af;
        }
        .member-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            border-bottom: 1px solid rgba(0,255,255,0.1);
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let friends = JSON.parse(localStorage.getItem('friends') || '{}');
    let groups = JSON.parse(localStorage.getItem('groups') || '[]');
    let channels = JSON.parse(localStorage.getItem('channels') || '[]');
    let replyTo = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveFriends() { localStorage.setItem('friends', JSON.stringify(friends)); }
    function saveGroups() { localStorage.setItem('groups', JSON.stringify(groups)); }
    function saveChannels() { localStorage.setItem('channels', JSON.stringify(channels)); }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.innerHTML = `<h3>${message}</h3><button onclick="this.parentElement.remove()" class="auth-btn" style="margin-top:12px;">ОК</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }

    function validateLogin(login) {
        const regex = /^[a-zA-Z0-9_+\-~]+$/;
        return regex.test(login) && login.length >= 3 && login.length <= 20;
    }

    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn" class="auth-btn">Вход</button>
                        <button id="showRegBtn" class="auth-btn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `
            <input type="text" id="login" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button id="doLogin" class="auth-btn">Войти</button>
        `;
        document.getElementById('doLogin').onclick = async () => {
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            if (!login) { showToast('Введите логин'); return; }
            if (!password) { showToast('Введите пароль'); return; }
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password }) });
            const data = await res.json();
            if (data.error) showToast(data.error);
            else { currentUser = data.login; currentUserData = data.user; startMessenger(); }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `
            <input type="text" id="regLogin" placeholder="Логин">
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="date" id="regBirthdate">
            <textarea id="regAbout" rows="2" placeholder="О себе"></textarea>
            <button id="doReg" class="auth-btn">Зарегистрироваться</button>
        `;
        document.getElementById('doReg').onclick = async () => {
            const login = document.getElementById('regLogin').value.trim();
            if (!login) { showToast('Введите логин'); return; }
            if (!validateLogin(login)) {
                showToast('Логин: только латиница, цифры и символы _ + - ~ (3-20 символов)');
                return;
            }
            const password = document.getElementById('regPassword').value;
            if (!password) { showToast('Введите пароль'); return; }
            const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
                login: login,
                password: password,
                name: login,
                surname: '',
                birthdate: document.getElementById('regBirthdate').value,
                about: document.getElementById('regAbout').value,
                favoriteGames: []
            })});
            const data = await res.json();
            if (data.error) showToast(data.error);
            else { showToast('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    function showGroupProfile(group) {
        const memberCount = group.members.length;
        const membersList = group.members.map(m => `<div class="member-item"><div class="avatar" style="width:24px; height:24px; font-size:12px;">👤</div><span>${m}</span></div>`).join('');
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card" style="width:340px;">
                <div style="font-size:64px;">${group.avatar || '👥'}</div>
                <h2>${group.name}</h2>
                <p>@${group.login}</p>
                <div><strong>🎮 Тематика:</strong> ${group.theme || 'не указана'}</div>
                <div><strong>👥 Участники (${memberCount}):</strong></div>
                <div class="member-list">${membersList || 'Нет участников'}</div>
                <button id="closeProfileBtn" class="auth-btn" style="margin-top:16px;">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#closeProfileBtn').onclick = () => modal.remove();
    }

    function showChannelProfile(channel) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div style="font-size:64px;">${channel.avatar || '📢'}</div>
                <h2>${channel.name}</h2>
                <p>@${channel.login}</p>
                <div><strong>🎮 Тематика:</strong> ${channel.theme || 'не указана'}</div>
                <button id="closeProfileBtn" class="auth-btn" style="margin-top:16px;">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#closeProfileBtn').onclick = () => modal.remove();
    }

    function showMyProfile() {
        const avatarUrl = userAvatars[currentUser] || null;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                <h2>${currentUser}</h2>
                <div><strong>📅 Дата рождения:</strong> ${currentUserData?.birthdate || 'не указана'}</div>
                <div><strong>📝 О себе:</strong> ${currentUserData?.about || 'не указано'}</div>
                <button id="editProfileBtn" class="auth-btn" style="margin-top:12px;">✏️ Редактировать</button>
                <button id="closeProfileBtn" class="auth-btn" style="margin-top:12px;">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#editProfileBtn').onclick = () => { modal.remove(); showEditProfileModal(); };
        modal.querySelector('#closeProfileBtn').onclick = () => modal.remove();
    }

    function showEditProfileModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        const avatarUrl = userAvatars[currentUser] || null;
        modal.innerHTML = `
            <div class="modal-box">
                <h3>✏️ Редактировать профиль</h3>
                <div style="display:flex; justify-content:center; margin:10px;">
                    <div id="avatarPreview" class="avatar" style="width:80px; height:80px; font-size:40px; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                </div>
                <button id="changeAvatarBtn" class="auth-btn">📷 Сменить фото</button>
                <input type="date" id="editBirthdate" value="${currentUserData?.birthdate || ''}">
                <textarea id="editAbout" rows="3" placeholder="О себе">${currentUserData?.about || ''}</textarea>
                <div class="modal-buttons">
                    <button id="saveProfileBtn">💾 Сохранить</button>
                    <button id="cancelEditBtn">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#changeAvatarBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file && file.size <= 4 * 1024 * 1024) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        userAvatars[currentUser] = ev.target.result;
                        saveAvatars();
                        const preview = modal.querySelector('#avatarPreview');
                        preview.style.backgroundImage = `url(${ev.target.result})`;
                        preview.style.backgroundSize = 'cover';
                        preview.innerHTML = '';
                        showToast('Фото обновлено');
                    };
                    reader.readAsDataURL(file);
                } else if (file) showToast('Файл больше 4 МБ');
            };
            input.click();
        };
        modal.querySelector('#saveProfileBtn').onclick = async () => {
            const updatedData = {
                birthdate: modal.querySelector('#editBirthdate').value,
                about: modal.querySelector('#editAbout').value
            };
            currentUserData = { ...currentUserData, ...updatedData };
            await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: currentUser, ...updatedData }) });
            showToast('Профиль обновлён');
            modal.remove();
        };
        modal.querySelector('#cancelEditBtn').onclick = () => modal.remove();
    }

    function showUserProfile(login) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { showToast('Пользователь не найден'); return; }
                const avatar = userAvatars[login] || null;
                const isFriend = friends[currentUser] && friends[currentUser].includes(login);
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="profile-card">
                        <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div>
                        <h2>${data.login}</h2>
                        <div><strong>📅 Дата рождения:</strong> ${data.birthdate || 'не указана'}</div>
                        <div><strong>📝 О себе:</strong> ${data.about || 'не указано'}</div>
                        <button id="friendBtn" class="auth-btn" style="margin-top:12px;">${isFriend ? '❌ Удалить из друзей' : '➕ Добавить в друзья'}</button>
                        <button id="msgBtn" class="auth-btn" style="margin-top:12px;">💬 Написать сообщение</button>

        container.innerHTML = msgs.map((msg, idx) => {

                <div class="message ${msg.from === currentUser ? 'my-message' : ''}" data-idx="${idx}">

    function sendFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const content = e.target.result;
            let html = '';
            if (file.type.startsWith('image/')) html = `<img src="${content}" class="media-content" onclick="viewMedia('${content}', 'image')" style="max-width:200px; border-radius:12px; cursor:pointer;">`;
            else if (file.type.startsWith('video/')) html = `<video src="${content}" class="media-content" controls style="max-width:200px; border-radius:12px;"></video>`;
            else html = `<div class="file-content" style="display:inline-flex; align-items:center; gap:8px; background:rgba(0,0,0,0.3); padding:6px 12px; border-radius:20px;">📎 ${file.name} (${(file.size/1024/1024).toFixed(2)} МБ)</div>`;
            socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: html, time: getFormattedTime() });
        };
        reader.readAsDataURL(file);
    }

    function startVoiceRecording() {
        if (isRecording) {
            if (mediaRecorder) { mediaRecorder.stop(); isRecording = false; }
            document.getElementById('voiceRecBar').style.display = 'none';
            document.getElementById('msgInput').style.display = 'block';
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = e => {
                        socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<audio src="${e.target.result}" controls style="max-width:200px;"></audio>`, time: getFormattedTime() });
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('msgInput').style.display = 'none';
                document.getElementById('voiceRecBar').style.display = 'flex';
                let elapsed = 0;
                const interval = setInterval(() => {
                    if (!isRecording) { clearInterval(interval); return; }
                    elapsed += 0.1;
                    document.getElementById('voiceWaveFill').style.width = Math.min(100, (elapsed / 60) * 100) + '%';
                }, 100);
            })
            .catch(() => showToast('Нет доступа к микрофону'));
    }

    function cancelVoiceRecording() {
        if (mediaRecorder && isRecording) { mediaRecorder.stop(); isRecording = false; }
        document.getElementById('voiceRecBar').style.display = 'none';
        document.getElementById('msgInput').style.display = 'block';
    }

    async function performSearch() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const container = document.getElementById('chatsList');
        
        // Удаляем старый временный результат
        const existingTemp = document.getElementById('temp-search-result');
        if (existingTemp) existingTemp.remove();
        
        if (!query) {
            const items = container.querySelectorAll('.chat-item:not(#temp-search-result)');
            items.forEach(item => item.style.display = 'flex');
            return;
        }
        
        // Фильтруем существующие чаты по названию
        const items = container.querySelectorAll('.chat-item:not(#temp-search-result)');
        items.forEach(item => {
            const name = item.querySelector('.chat-info span:last-child')?.innerText.toLowerCase() || '';
            if (item.style) {
                item.style.display = name.includes(query) ? 'flex' : 'none';
            }
        });
        
        // Ищем пользователя через сервер
        try {
            const res = await fetch('/search-user', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ login: query }) 
            });
            const data = await res.json();
            console.log('Результат поиска:', data);
            
            if (data.found && data.login !== currentUser) {
                const userDiv = document.createElement('div');
                userDiv.id = 'temp-search-result';
                userDiv.className = 'chat-item search-result-item';
                userDiv.innerHTML = `<div class="chat-info"><span>👤</span><span>${data.login}</span></div>`;
                userDiv.onclick = () => {
                    showUserProfile(data.login);
                    document.getElementById('searchInput').value = '';
                    performSearch();
                };
                if (container.firstChild) {
                    container.insertBefore(userDiv, container.firstChild);
                } else {
                    container.appendChild(userDiv);
                }
            }
        } catch (err) {
            console.error('Ошибка поиска:', err);
        }
        
        // Ищем группу
        const foundGroup = groups.find(g => g.login === query);
        if (foundGroup) {
            const groupDiv = document.createElement('div');
            groupDiv.id = 'temp-search-result';
            groupDiv.className = 'chat-item search-result-item';
            groupDiv.innerHTML = `<div class="chat-info"><span>${foundGroup.avatar || '👥'}</span><span>${foundGroup.name} (группа)</span></div>`;
            groupDiv.onclick = () => {
                if (!foundGroup.members.includes(currentUser)) {
                    if (confirm(`Вступить в группу "${foundGroup.name}"?`)) {
                        foundGroup.members.push(currentUser);
                        saveGroups();
                        allChats.push({ id: foundGroup.id, name: foundGroup.name, avatar: foundGroup.avatar, isGroup: true, creator: foundGroup.creator });
                        renderChats();
                        showToast(`Вы вступили в группу ${foundGroup.name}`);
                    }
                } else {
                    showGroupProfile(foundGroup);
                }
                document.getElementById('searchInput').value = '';
                performSearch();
            };
            if (container.firstChild) {
                container.insertBefore(groupDiv, container.firstChild);
            } else {
                container.appendChild(groupDiv);
            }
        }
        
        // Ищем канал
        const foundChannel = channels.find(c => c.login === query);
        if (foundChannel) {
            const channelDiv = document.createElement('div');
            channelDiv.id = 'temp-search-result';
            channelDiv.className = 'chat-item search-result-item';
            channelDiv.innerHTML = `<div class="chat-info"><span>${foundChannel.avatar || '📢'}</span><span>${foundChannel.name} (канал)</span></div>`;
            channelDiv.onclick = () => {
                if (!foundChannel.members.includes(currentUser)) {
                    if (confirm(`Подписаться на канал "${foundChannel.name}"?`)) {
                        foundChannel.members.push(currentUser);
                        saveChannels();
                        allChats.push({ id: foundChannel.id, name: foundChannel.name, avatar: foundChannel.avatar, isChannel: true, creator: foundChannel.creator });
                        renderChats();
                        showToast(`Вы подписались на канал ${foundChannel.name}`);
                    }
                } else {
                    showChannelProfile(foundChannel);
                }
                document.getElementById('searchInput').value = '';
                performSearch();
            };
            if (container.firstChild) {
                container.insertBefore(channelDiv, container.firstChild);
            } else {
                container.appendChild(channelDiv);
            }
        }
    }

    function deleteChat(chatId, chatName, leaveOnly) {
        if (chatId === 'favorites') { showToast('Избранное нельзя удалить'); return; }
        if (confirm(leaveOnly ? `Выйти из чата "${chatName}"?` : `Удалить чат "${chatName}"?`)) {
            if (leaveOnly) {
                const group = groups.find(g => g.id == chatId);
                if (group) group.members = group.members.filter(m => m !== currentUser);
                const channel = channels.find(c => c.id == chatId);
                if (channel) channel.members = channel.members.filter(m => m !== currentUser);
                saveGroups(); saveChannels();
            } else {
                groups = groups.filter(g => g.id != chatId);
                channels = channels.filter(c => c.id != chatId);
                saveGroups(); saveChannels();
            }
            allChats = allChats.filter(c => c.id !== chatId);
            delete messagesData[chatId];
            renderChats();
            if (currentChat === chatId) {
                currentChat = 'favorites';
                currentChatName = 'Избранное';
                document.getElementById('chatTitle').innerText = 'Избранное';
                loadMessages();
                socket.emit('join', currentChat);
            }
            showToast(leaveOnly ? `Вы вышли из ${chatName}` : `Чат ${chatName} удалён`);
        }
    }

    async function loadChats() {
        const res = await fetch('/chats');
        let chats = await res.json();
        allChats = chats.filter(c => c.name !== 'Новости ST_Link' && !deletedChats.includes(c.id));
        if (!allChats.find(c => c.id === 'favorites')) allChats.unshift({ id: 'favorites', name: 'Избранное', avatar: '⭐', private: true });
        groups.forEach(g => { 
            if (g.members.includes(currentUser) && !allChats.some(c => c.id === g.id)) {
                allChats.push({ id: g.id, name: g.name, avatar: g.avatar, isGroup: true, creator: g.creator });
            }
        });
        channels.forEach(c => { 
            if (c.members.includes(currentUser) && !allChats.some(ch => ch.id === c.id)) {
                allChats.push({ id: c.id, name: c.name, avatar: c.avatar, isChannel: true, creator: c.creator });
            }
        });
    }

    function renderChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        container.innerHTML = '';
        allChats.forEach(chat => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="chat-info"><span>${chat.avatar || '💬'}</span><span>${chat.name} ${mutedChats[chat.id] ? '🔇' : ''}</span></div>`;
            div.onclick = () => {
                currentChat = chat.id;
                currentChatName = chat.name;
                document.getElementById('chatTitle').innerText = chat.name;
                loadMessages();
                socket.emit('join', currentChat);
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
                document.getElementById('cancelReplyBtn').style.display = 'none';
            };
            container.appendChild(div);
        });
    }

            renderMessages();

        if (userAvatars[currentUser]) {
            const avatarDiv = document.getElementById('userAvatar');
            avatarDiv.style.backgroundImage = `url(${userAvatars[currentUser]})`;
            avatarDiv.style.backgroundSize = 'cover';
            avatarDiv.innerHTML = '';
        }
        renderChats();
        loadMessages();
        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (replyTo) {
                text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`;
                replyTo = null;
                document.getElementById('replyIndicator').innerText = '';
                document.getElementById('cancelReplyBtn').style.display = 'none';
            }
            if (text) {
                if (currentChat === 'favorites') saveFavoriteMessage(text);
                else socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text, time: getFormattedTime() });
                input.value = '';
            }
        };
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });
        document.getElementById('profileBtn').onclick = showMyProfile;
        document.getElementById('createGroupBtn').onclick = showCreateGroupModal;
        document.getElementById('createChannelBtn').onclick = showCreateChannelModal;
        document.getElementById('headerDotsBtn').onclick = () => {
            const menu = document.createElement('div');
            menu.className = 'chat-menu';
            const isGroup = groups.find(g => g.id == currentChat);
            const isChannel = channels.find(c => c.id == currentChat);
            const isOwner = isGroup?.creator === currentUser || isChannel?.creator === currentUser;
            let html = `<div id="menuClear" style="padding:8px 16px; cursor:pointer;">🧹 Очистить чат</div>`;
            if (currentChat !== 'favorites') html += `<div id="menuLeave" style="padding:8px 16px; cursor:pointer;">🚪 Выйти из чата</div>`;
            if (isOwner) html += `<div id="menuDelete" style="padding:8px 16px; cursor:pointer;">🗑 Удалить чат</div>`;
            html += `<div id="menuNotifications" style="padding:8px 16px; cursor:pointer;">${mutedChats[currentChat] ? '🔔 Вкл уведомления' : '🔕 Выкл уведомления'}</div>`;
            menu.innerHTML = html;
            document.body.appendChild(menu);
            const rect = document.querySelector('.chat-header-dots').getBoundingClientRect();
            menu.style.position = 'fixed';
            menu.style.background = '#0a1428';
            menu.style.border = '1px solid #0af';
            menu.style.borderRadius = '16px';
            menu.style.padding = '8px';
            menu.style.zIndex = '200';
            menu.style.left = rect.left - 120 + 'px';
            menu.style.top = rect.bottom + 5 + 'px';
            menu.querySelector('#menuClear').onclick = () => {
                if (confirm(`Очистить чат "${currentChatName}"?`)) {
                    if (currentChat === 'favorites') {
                        localStorage.setItem(`favorites_${currentUser}`, JSON.stringify([]));
                        messagesData['favorites'] = [];
                    } else messagesData[currentChat] = [];
                    renderMessages();
                }
                menu.remove();
            };
            if (currentChat !== 'favorites' && menu.querySelector('#menuLeave')) menu.querySelector('#menuLeave').onclick = () => { deleteChat(currentChat, currentChatName, true); menu.remove(); };
            if (isOwner && menu.querySelector('#menuDelete')) menu.querySelector('#menuDelete').onclick = () => { deleteChat(currentChat, currentChatName, false); menu.remove(); };
            menu.querySelector('#menuNotifications').onclick = () => { mutedChats[currentChat] = !mutedChats[currentChat]; saveMuted(); renderChats(); menu.remove(); };
            setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 10);
        };
        document.getElementById('emojiBtn').onclick = showEmojiPicker;
        document.getElementById('attachBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,video/*,application/pdf,application/msword,application/zip';
            input.onchange = (e) => { if (e.target.files[0]) sendFile(e.target.files[0]); };
            input.click();
        };
        document.getElementById('voiceBtn').onclick = startVoiceRecording;
        document.getElementById('cancelVoiceBtn').onclick = cancelVoiceRecording;
        document.getElementById('cancelReplyBtn').onclick = () => { replyTo = null; document.getElementById('replyIndicator').innerText = ''; document.getElementById('cancelReplyBtn').style.display = 'none'; };
        document.getElementById('searchBtn').onclick = performSearch;
        document.getElementById('searchInput').addEventListener('keyup', () => performSearch());
        document.getElementById('friendsIcon').onclick = showFriendsList;
        document.getElementById('burgerBtn').onclick = () => { document.getElementById('sidebar').classList.toggle('open'); };
        document.getElementById('chatTitle').onclick = () => {
            if (currentChat !== 'favorites') {
                const group = groups.find(g => g.id == currentChat);
                const channel = channels.find(c => c.id == currentChat);
                if (group) showGroupProfile(group);
                else if (channel) showChannelProfile(channel);
                else showToast(`Профиль чата: ${currentChatName}`);
            } else showToast('Избранное — личные заметки');
        };
        socket.emit('join', currentChat);
    }
    renderAuth();
</script>
</body>
</html>
