<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        /* Основной контейнер */
        .messenger {
            width: 1400px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }

        /* Левая панель с иконками (узкая) */
        .icon-bar {
            width: 80px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
            z-index: 10;
        }

        .icon-item {
            width: 50px;
            height: 50px;
            background: rgba(0,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-item:hover {
            background: rgba(0,255,255,0.3);
            transform: scale(1.05);
            box-shadow: 0 0 10px cyan;
        }

        .icon-item.active {
            background: #0af;
            color: black;
            box-shadow: 0 0 15px cyan;
        }

        /* Центральная панель (списки) */
        .content-panel {
            width: 320px;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
        }

        .search-header {
            padding: 16px;
            border-bottom: 1px solid #0af;
        }

        .search-header input {
            width: 100%;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
        }

        .content-header {
            padding: 12px 16px;
            border-bottom: 1px solid #0af;
            font-size: 18px;
            font-weight: bold;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background: rgba(0,255,255,0.05);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .list-item:hover {
            background: rgba(0,255,255,0.15);
            border: 1px solid #0af;
        }

        .list-avatar {
            width: 44px;
            height: 44px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
            background-position: center;
        }

        .list-info {
            flex: 1;
        }

        .list-title {
            font-size: 16px;
            font-weight: bold;
        }

        .list-sub {
            font-size: 11px;
            opacity: 0.6;
        }

        /* Правая панель (чат) */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(6,12,24,0.4);
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }

        .chat-title {
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-header-dots {
            background: none;
            border: none;
            color: cyan;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 12px;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 70%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            word-wrap: break-word;
            position: relative;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .my-message {
            align-self: flex-end;
            background: #0af;
            color: black;
        }

        .message-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            justify-content: flex-end;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-actions span {
            cursor: pointer;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 16px;
        }

        .message-actions span:hover {
            opacity: 1;
            background: cyan;
            color: black;
        }

        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        .chat-input button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #0af;
            padding: 0 10px;
        }

        .reply-indicator {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
        }

        .voice-recording {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            flex: 1;
        }

        .voice-wave {
            flex: 1;
            height: 30px;
            background: rgba(0,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
        }

        .voice-wave-fill {
            width: 0%;
            height: 100%;
            background: cyan;
            transition: width 0.1s linear;
        }

        .modal-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 280px;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 0 40px rgba(0,255,255,0.3);
        }

        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: cyan;
            margin-right: 8px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 380px;
            text-align: center;
        }

        .modal-box input, .modal-box textarea, .modal-box select {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            font-family: inherit;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            background: #0af;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }

        .profile-card {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 340px;
            text-align: center;
        }

        .friends-list {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 20px;
            width: 320px;
            text-align: center;
            max-height: 70vh;
            overflow-y: auto;
        }

        .friend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .friend-item:hover {
            background: rgba(0,255,255,0.2);
        }

        .friend-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
        }

        .emoji-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
            font-size: 28px;
        }

        .emoji-option {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .emoji-option:hover {
            background: #0af;
        }

        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }

        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .auth-btn {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .search-result-item {
            background: rgba(0,255,255,0.15);
            border: 1px solid #0af;
        }

        .member-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            border-bottom: 1px solid rgba(0,255,255,0.1);
        }

        .upload-progress {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #0af;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .subgroup-item {
            margin-left: 28px;
            padding: 6px;
            font-size: 13px;
            border-radius: 16px;
            background: rgba(0,255,255,0.05);
            cursor: pointer;
        }

        .subgroup-item:hover {
            background: rgba(0,255,255,0.15);
        }

        /* Мобильная адаптация */
        body.mobile-mode .messenger {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }

        body.mobile-mode .content-panel {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            transform: translateX(-100%);
            z-index: 1000;
            transition: transform 0.2s;
        }

        body.mobile-mode .content-panel.open {
            transform: translateX(0);
        }

        body.mobile-mode .burger-btn {
            display: block;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }

        .burger-btn {
            display: none;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let subgroups = JSON.parse(localStorage.getItem('subgroups') || '{}');
    let friends = JSON.parse(localStorage.getItem('friends') || '{}');
    let groups = JSON.parse(localStorage.getItem('groups') || '[]');
    let channels = JSON.parse(localStorage.getItem('channels') || '[]');
    let replyTo = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentMatches = [];
    let currentMatchIndex = -1;
    let activeLeftTab = 'profile'; // profile, users, channels, groups
    let allUsersList = [];

    // ========== СОХРАНЕНИЕ ==========
    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveSubgroups() { localStorage.setItem('subgroups', JSON.stringify(subgroups)); }
    function saveFriends() { localStorage.setItem('friends', JSON.stringify(friends)); }
    function saveGroups() { localStorage.setItem('groups', JSON.stringify(groups)); }
    function saveChannels() { localStorage.setItem('channels', JSON.stringify(channels)); }

    function getFormattedTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const day = now.getDate().toString().padStart(2, '0');
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const year = now.getFullYear();
        return `${hours}:${minutes}, ${day}.${month}.${year}`;
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.innerHTML = `<h3>${message}</h3><button onclick="this.parentElement.remove()" class="auth-btn" style="margin-top:12px;">ОК</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function validateLogin(login) {
        const regex = /^[a-zA-Z0-9_+\-~]+$/;
        return regex.test(login) && login.length >= 3 && login.length <= 20;
    }

    // ========== АВТОРИЗАЦИЯ ==========
    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn" class="auth-btn">Вход</button>
                        <button id="showRegBtn" class="auth-btn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `
            <div class="prefix-input"><span>@</span><input type="text" id="login" placeholder="логин"></div>
            <input type="password" id="password" placeholder="Пароль">
            <button id="doLogin" class="auth-btn">Войти</button>
        `;
        document.getElementById('doLogin').onclick = async () => {
            let login = document.getElementById('login').value.trim();
            if (!login) { showToast('Введите логин'); return; }
            if (!login.startsWith('@')) login = '@' + login;
            const password = document.getElementById('password').value;
            if (!password) { showToast('Введите пароль'); return; }
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password }) });
            const data = await res.json();
            if (data.error) showToast(data.error);
            else { currentUser = data.login; currentUserData = data.user; startMessenger(); }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `
            <div class="prefix-input"><span>@</span><input type="text" id="regLogin" placeholder="логин"></div>
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="date" id="regBirthdate">
            <textarea id="regAbout" rows="2" placeholder="О себе"></textarea>
            <button id="doReg" class="auth-btn">Зарегистрироваться</button>
        `;
        document.getElementById('doReg').onclick = async () => {
            let loginRaw = document.getElementById('regLogin').value.trim();
            if (!loginRaw) { showToast('Введите логин'); return; }
            if (!validateLogin(loginRaw)) {
                showToast('Логин: только латиница, цифры и символы _ + - ~ (3-20 символов)');
                return;
            }
            let login = '@' + loginRaw;
            const password = document.getElementById('regPassword').value;
            if (!password) { showToast('Введите пароль'); return; }
            const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
                login: login,
                password: password,
                name: loginRaw,
                surname: '',
                birthdate: document.getElementById('regBirthdate').value,
                about: document.getElementById('regAbout').value,
                favoriteGames: []
            })});
            const data = await res.json();
            if (data.error) showToast(data.error);
            else { showToast('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    // ========== ЗАГРУЗКА СПИСКОВ С СЕРВЕРА ==========
    async function loadUsersList() {
        try {
            const res = await fetch('/users');
            const data = await res.json();
            allUsersList = data.filter(u => u.login !== currentUser);
            renderLeftPanelContent();
        } catch(e) { console.error('Ошибка загрузки пользователей', e); }
    }

    async function loadChannelsList() {
        try {
            const res = await fetch('/chats');
            const chats = await res.json();
            channels = chats.filter(c => c.isChannel === true);
            renderLeftPanelContent();
        } catch(e) { console.error('Ошибка загрузки каналов', e); }
    }

    async function loadGroupsList() {
        try {
            const res = await fetch('/chats');
            const chats = await res.json();
            groups = chats.filter(c => c.isGroup === true);
            renderLeftPanelContent();
        } catch(e) { console.error('Ошибка загрузки групп', e); }
    }

    // ========== ОТОБРАЖЕНИЕ ЛЕВОЙ ПАНЕЛИ (4 вкладки) ==========
    function renderLeftPanelContent() {
        const container = document.getElementById('listContainer');
        const query = document.getElementById('leftSearchInput')?.value.toLowerCase() || '';
        if (!container) return;

        if (activeLeftTab === 'profile') {
            document.getElementById('contentTitle').innerText = 'Мой профиль';
            const avatarUrl = userAvatars[currentUser] || null;
            container.innerHTML = `
                <div class="list-item" onclick="showMyProfile()">
                    <div class="list-avatar" style="${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                    <div class="list-info">
                        <div class="list-title">${currentUser}</div>
                        <div class="list-sub">Нажмите для просмотра</div>
                    </div>
                </div>
            `;
            return;
        }

        if (activeLeftTab === 'users') {
            document.getElementById('contentTitle').innerText = 'Пользователи';
            const filtered = allUsersList.filter(u => !query || u.login.toLowerCase().includes(query));
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state" style="text-align:center; padding:20px;">Нет пользователей</div>';
                return;
            }
            container.innerHTML = filtered.map(u => `
                <div class="list-item" onclick="showUserProfile('${u.login}')">
                    <div class="list-avatar" style="${userAvatars[u.login] ? `background-image:url(${userAvatars[u.login]}); background-size:cover;` : ''}">${!userAvatars[u.login] ? '👤' : ''}</div>
                    <div class="list-info">
                        <div class="list-title">${u.login}</div>
                    </div>
                </div>
            `).join('');
            return;
        }

        if (activeLeftTab === 'channels') {
            document.getElementById('contentTitle').innerText = 'Каналы';
            const filtered = channels.filter(c => !query || c.name.toLowerCase().includes(query) || (c.login && c.login.toLowerCase().includes(query)));
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state" style="text-align:center; padding:20px;">Нет каналов</div>';
                return;
            }
            container.innerHTML = filtered.map(c => `
                <div class="list-item" onclick="showChannelProfile('${c.id}')">
                    <div class="list-avatar" style="display:flex; align-items:center; justify-content:center; background:#0af;">${c.avatar || '📢'}</div>
                    <div class="list-info">
                        <div class="list-title">${c.name}</div>
                        <div class="list-sub">@${c.login || c.id}</div>
                    </div>
                </div>
            `).join('');
            return;
        }

        if (activeLeftTab === 'groups') {
            document.getElementById('contentTitle').innerText = 'Группы';
            const filtered = groups.filter(g => !query || g.name.toLowerCase().includes(query) || (g.login && g.login.toLowerCase().includes(query)));
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state" style="text-align:center; padding:20px;">Нет групп</div>';
                return;
            }
            container.innerHTML = filtered.map(g => `
                <div class="list-item" onclick="showGroupProfile('${g.id}')">
                    <div class="list-avatar" style="display:flex; align-items:center; justify-content:center; background:#0af;">${g.avatar || '👥'}</div>
                    <div class="list-info">
                        <div class="list-title">${g.name}</div>
                        <div class="list-sub">@${g.login || g.id}</div>
                    </div>
                </div>
            `).join('');
            return;
        }
    }

    // ========== ПРОФИЛИ ==========
    function getAvatarForUser(login) {
        const avatar = userAvatars[login];
        if (avatar) return `<div class="message-avatar" style="background-image:url(${avatar}); background-size:cover;"></div>`;
        return `<div class="message-avatar">⚡</div>`;
    }

    function showMyProfile() {
        const avatarUrl = userAvatars[currentUser] || null;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                <h2>${currentUser}</h2>
                <div><strong>📅 Дата рождения:</strong> ${currentUserData?.birthdate || 'не указана'}</div>
                <div><strong>📝 О себе:</strong> ${currentUserData?.about || 'не указано'}</div>
                <button id="editProfileBtn" class="auth-btn">✏️ Редактировать</button>
                <button id="closeProfileBtn" class="auth-btn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('editProfileBtn').onclick = () => { modal.remove(); showEditProfileModal(); };
        document.getElementById('closeProfileBtn').onclick = () => modal.remove();
    }

    function showEditProfileModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        const avatarUrl = userAvatars[currentUser] || null;
        modal.innerHTML = `
            <div class="modal-box">
                <h3>✏️ Редактировать профиль</h3>
                <div style="display:flex; justify-content:center; margin:10px;">
                    <div id="avatarPreview" class="avatar" style="width:80px; height:80px; font-size:40px; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                </div>
                <button id="changeAvatarBtn" class="auth-btn">📷 Сменить фото</button>
                <input type="date" id="editBirthdate" value="${currentUserData?.birthdate || ''}">
                <textarea id="editAbout" rows="3" placeholder="О себе">${currentUserData?.about || ''}</textarea>
                <div class="modal-buttons">
                    <button id="saveProfileBtn" class="auth-btn">💾 Сохранить</button>
                    <button id="cancelEditBtn" class="auth-btn">Отмена</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
        document.getElementById('changeAvatarBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file && file.size <= 4 * 1024 * 1024) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        userAvatars[currentUser] = ev.target.result;
                        saveAvatars();
                        const preview = document.getElementById('avatarPreview');
                        preview.style.backgroundImage = `url(${ev.target.result})`;
                        preview.style.backgroundSize = 'cover';
                        preview.innerHTML = '';
                        showToast('Фото обновлено');
                    };
                    reader.readAsDataURL(file);
                } else if (file) showToast('Файл больше 4 МБ');
            };
            input.click();
        };
        document.getElementById('saveProfileBtn').onclick = async () => {
            const updatedData = {
                birthdate: document.getElementById('editBirthdate').value,
                about: document.getElementById('editAbout').value
            };
            currentUserData = { ...currentUserData, ...updatedData };
            await fetch('/update-profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login: currentUser, ...updatedData }) });
            showToast('Профиль обновлён');
            modal.remove();
        };
        document.getElementById('cancelEditBtn').onclick = () => modal.remove();
    }

    function showUserProfile(login) {
        fetch('/search-user', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login }) })
            .then(r => r.json())
            .then(data => {
                if (!data.found) { showToast('Пользователь не найден'); return; }
                const avatar = userAvatars[login] || null;
                const isFriend = friends[currentUser] && friends[currentUser].includes(login);
                const modal = document.createElement('div');
                modal.className = 'modal';
                modal.innerHTML = `
                    <div class="profile-card">
                        <div class="avatar" style="width:80px; height:80px; font-size:40px; margin:0 auto; background:#0af; border-radius:50%; display:flex; align-items:center; justify-content:center; ${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div>
                        <h2>${data.login}</h2>
                        <div><strong>📅 Дата рождения:</strong> ${data.birthdate || 'не указана'}</div>
                        <div><strong>📝 О себе:</strong> ${data.about || 'не указано'}</div>
                        <button id="friendBtn" class="auth-btn">${isFriend ? '❌ Удалить из друзей' : '➕ Добавить в друзья'}</button>
                        <button id="msgBtn" class="auth-btn">💬 Написать сообщение</button>
                        <button id="closeBtn" class="auth-btn">Закрыть</button>
                    </div>
                `;
                document.body.appendChild(modal);
                document.getElementById('friendBtn').onclick = () => {
                    if (!friends[currentUser]) friends[currentUser] = [];
                    if (isFriend) friends[currentUser] = friends[currentUser].filter(f => f !== login);
                    else friends[currentUser].push(login);
                    saveFriends();
                    modal.remove();
                    showToast(isFriend ? 'Удалён из друзей' : 'Добавлен в друзья');
                };
                document.getElementById('msgBtn').onclick = () => {
                    startPrivateChat(login);
                    modal.remove();
                };
                document.getElementById('closeBtn').onclick = () => modal.remove();
            });
    }

    function showChannelProfile(channelId) {
        const channel = channels.find(c => c.id == channelId);
        if (!channel) return;
        const isSubscribed = channel.members?.includes(currentUser);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card">
                <div style="font-size:64px;">${channel.avatar || '📢'}</div>
                <h2>${channel.name}</h2>
                <p>@${channel.login || channel.id}</p>
                <div><strong>🎮 Тематика:</strong> ${channel.theme || 'не указана'}</div>
                ${!isSubscribed ? '<button id="subscribeBtn" class="auth-btn">➕ Подписаться</button>' : '<button id="openBtn" class="auth-btn">💬 Открыть канал</button>'}
                <button id="closeBtn" class="auth-btn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        if (!isSubscribed) {
            document.getElementById('subscribeBtn').onclick = () => {
                if (!channel.members) channel.members = [];
                channel.members.push(currentUser);
                saveChannels();
                showToast(`Вы подписались на канал ${channel.name}`);
                modal.remove();
                renderLeftPanelContent();
            };
        } else {
            document.getElementById('openBtn').onclick = () => {
                openChat(`channel_${channel.id}`, channel.name);
                modal.remove();
            };
        }
        document.getElementById('closeBtn').onclick = () => modal.remove();
    }

    function showGroupProfile(groupId) {
        const group = groups.find(g => g.id == groupId);
        if (!group) return;
        const isMember = group.members?.includes(currentUser);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="profile-card" style="width:340px;">
                <div style="font-size:64px;">${group.avatar || '👥'}</div>
                <h2>${group.name}</h2>
                <p>@${group.login || group.id}</p>
                <div><strong>🎮 Тематика:</strong> ${group.theme || 'не указана'}</div>
                <div><strong>👥 Участники:</strong> ${group.members?.length || 0}</div>
                ${!isMember ? '<button id="joinBtn" class="auth-btn">➕ Вступить</button>' : '<button id="openBtn" class="auth-btn">💬 Открыть чат</button>'}
                <button id="closeBtn" class="auth-btn">Закрыть</button>
            </div>
        `;
        document.body.appendChild(modal);
        if (!isMember) {
            document.getElementById('joinBtn').onclick = () => {
                if (!group.members) group.members = [];
                group.members.push(currentUser);
                saveGroups();
                showToast(`Вы вступили в группу ${group.name}`);
                modal.remove();
                renderLeftPanelContent();
            };
        } else {
            document.getElementById('openBtn').onclick = () => {
                openChat(`group_${group.id}`, group.name);
                modal.remove();
            };
        }
        document.getElementById('closeBtn').onclick = () => modal.remove();
    }

    function startPrivateChat(login) {
        openChat(login, login);
    }

    function openChat(chatId, chatName) {
        currentChat = chatId;
        currentChatName = chatName;
        if (!messagesData[currentChat]) messagesData[currentChat] = [];
        renderChatInterface();
        loadMessages();
        socket.emit('join', currentChat);
        document.getElementById('chatTitle').innerText = chatName;
    }

    function renderChatInterface() {
        const container = document.getElementById('chatContainer');
        if (!container) return;
        container.innerHTML = `
            <div class="chat-header">
                <span class="chat-title" id="chatTitle">${currentChatName}</span>
                <button class="chat-header-dots" id="chatMenuBtn">⋯</button>
            </div>
            <div class="chat-messages" id="messagesList"></div>
            <div id="replyIndicator" style="padding:0 16px; font-size:12px; display:flex; justify-content:space-between;">
                <span></span>
                <button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>
            </div>
            <div class="chat-input">
                <button id="emojiBtn">😀</button>
                <button id="attachBtn">📎</button>
                <button id="voiceBtn">🎙️</button>
                <input type="text" id="msgInput" placeholder="Введите сообщение...">
                <button id="sendBtn">➤</button>
                <div id="voiceRecBar" style="display:none; align-items:center; gap:12px; flex:1;">
                    <div class="voice-wave"><div id="voiceWaveFill" class="voice-wave-fill"></div></div>
                    <button id="cancelVoiceBtn">✖</button>
                </div>
            </div>
        `;
        document.getElementById('sendBtn').onclick = () => sendMessage();
        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        document.getElementById('emojiBtn').onclick = showEmojiPicker;
        document.getElementById('attachBtn').onclick = () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,video/*,application/pdf,application/msword,application/zip';
            input.onchange = (e) => { if (e.target.files[0]) sendFile(e.target.files[0]); };
            input.click();
        };
        document.getElementById('voiceBtn').onclick = startVoiceRecording;
        document.getElementById('cancelVoiceBtn').onclick = cancelVoiceRecording;
        document.getElementById('cancelReplyBtn').onclick = () => {
            replyTo = null;
            document.getElementById('replyIndicator').innerHTML = '<span></span><button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>';
        };
        document.getElementById('chatMenuBtn').onclick = showChatMenu;
    }
