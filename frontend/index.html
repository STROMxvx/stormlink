<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .messenger {
            width: 1400px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }
        /* Левая панель с иконками */
        .icon-bar {
            width: 80px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
            z-index: 10;
        }
        .icon-item {
            width: 50px;
            height: 50px;
            background: rgba(0,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-item:hover {
            background: rgba(0,255,255,0.3);
            transform: scale(1.05);
            box-shadow: 0 0 10px cyan;
        }
        .icon-item.active {
            background: #0af;
            color: black;
            box-shadow: 0 0 15px cyan;
        }
        /* Центральная панель (списки) */
        .content-panel {
            width: 320px;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
        }
        .search-header {
            padding: 16px;
            border-bottom: 1px solid #0af;
        }
        .search-header input {
            width: 100%;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
        }
        .content-header {
            padding: 12px 16px;
            border-bottom: 1px solid #0af;
            font-size: 18px;
            font-weight: bold;
        }
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .list-item {
            background: rgba(0,255,255,0.05);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .list-item:hover {
            background: rgba(0,255,255,0.15);
            border: 1px solid #0af;
        }
        .list-avatar {
            width: 44px;
            height: 44px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
            background-position: center;
        }
        .list-info {
            flex: 1;
        }
        .list-title {
            font-size: 16px;
            font-weight: bold;
        }
        .list-sub {
            font-size: 11px;
            opacity: 0.6;
        }
        .empty-state {
            text-align: center;
            padding: 20px;
            opacity: 0.5;
        }
        /* Правая панель (чат) */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(6,12,24,0.4);
        }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-title {
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .chat-header-dots {
            background: none;
            border: none;
            color: cyan;
            font-size: 28px;
            cursor: pointer;
            padding: 4px 12px;
        }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 70%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            word-wrap: break-word;
            position: relative;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
            background-position: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .message-content {
            flex: 1;
        }
        .my-message {
            align-self: flex-end;
            background: #0af;
            color: black;
        }
        .message-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            justify-content: flex-end;
        }
        .message:hover .message-actions {
            display: flex;
        }
        .message-actions span {
            cursor: pointer;
            opacity: 0.7;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 16px;
        }
        .message-actions span:hover {
            opacity: 1;
            background: cyan;
            color: black;
        }
        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            border-top: 1px solid #0af;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            outline: none;
            font-size: 14px;
        }
        .chat-input button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #0af;
            padding: 0 10px;
        }
        .reply-indicator {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 4px;
            border-left: 2px solid cyan;
            padding-left: 8px;
        }
        .voice-recording {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 8px 16px;
            flex: 1;
        }
        .voice-wave {
            flex: 1;
            height: 30px;
            background: rgba(0,255,255,0.2);
            border-radius: 20px;
            overflow: hidden;
        }
        .voice-wave-fill {
            width: 0%;
            height: 100%;
            background: cyan;
            transition: width 0.1s linear;
        }
        .modal-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 280px;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 0 40px rgba(0,255,255,0.3);
        }
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 28px;
            cursor: pointer;
            color: black;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
        }
        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            color: cyan;
            margin-right: 8px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 380px;
            text-align: center;
        }
        .modal-box input, .modal-box textarea, .modal-box select {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
            font-family: inherit;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 10px;
            background: #0af;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }
        .profile-card {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 24px;
            width: 340px;
            text-align: center;
        }
        .friends-list {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 20px;
            width: 320px;
            text-align: center;
            max-height: 70vh;
            overflow-y: auto;
        }
        .friend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            background: rgba(0,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .friend-item:hover {
            background: rgba(0,255,255,0.2);
        }
        .friend-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #0af;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background-size: cover;
        }
        .emoji-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
            font-size: 28px;
        }
        .emoji-option {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
        }
        .emoji-option:hover {
            background: #0af;
        }
        .auth-box {
            background: rgba(6,12,24,0.95);
            border: 2px solid #0af;
            border-radius: 32px;
            padding: 32px;
            width: 350px;
            text-align: center;
        }
        .auth-box input, .auth-box textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .auth-buttons {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        .auth-btn {
            background: #0af;
            border: none;
            border-radius: 40px;
            padding: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-result-item {
            background: rgba(0,255,255,0.15);
            border: 1px solid #0af;
        }
        .member-list {
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            text-align: left;
        }
        .member-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px;
            border-bottom: 1px solid rgba(0,255,255,0.1);
        }
        .upload-progress {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #0af;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .subgroup-item {
            margin-left: 28px;
            padding: 6px;
            font-size: 13px;
            border-radius: 16px;
            background: rgba(0,255,255,0.05);
            cursor: pointer;
        }
        .subgroup-item:hover {
            background: rgba(0,255,255,0.15);
        }
        .media-content {
            max-width: 200px;
            max-height: 150px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 5px;
        }
        .file-content {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        .burger-btn {
            display: none;
        }
        body.mobile-mode .messenger {
            width: 100%;
            height: 100vh;
            border-radius: 0;
        }
        body.mobile-mode .content-panel {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 280px;
            transform: translateX(-100%);
            z-index: 1000;
            transition: transform 0.2s;
        }
        body.mobile-mode .content-panel.open {
            transform: translateX(0);
        }
        body.mobile-mode .burger-btn {
            display: block;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }
        .chat-menu {
            position: fixed;
            background: #0a1428;
            border: 1px solid #0af;
            border-radius: 16px;
            padding: 8px;
            z-index: 200;
        }
        .chat-menu div {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 12px;
        }
        .chat-menu div:hover {
            background: #0af;
            color: black;
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = 'favorites';
    let currentChatName = 'Избранное';
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let subgroups = JSON.parse(localStorage.getItem('subgroups') || '{}');
    let friends = JSON.parse(localStorage.getItem('friends') || '{}');
    let groups = JSON.parse(localStorage.getItem('groups') || '[]');
    let channels = JSON.parse(localStorage.getItem('channels') || '[]');
    let replyTo = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentMatches = [];
    let currentMatchIndex = -1;
    let activeLeftTab = 'profile';
    let allUsersList = [];

    // ========== СОХРАНЕНИЕ ==========
    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveSubgroups() { localStorage.setItem('subgroups', JSON.stringify(subgroups)); }
    function saveFriends() { localStorage.setItem('friends', JSON.stringify(friends)); }
    function saveGroups() { localStorage.setItem('groups', JSON.stringify(groups)); }
    function saveChannels() { localStorage.setItem('channels', JSON.stringify(channels)); }

    function getFormattedTime() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const day = now.getDate().toString().padStart(2, '0');
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const year = now.getFullYear();
        return `${hours}:${minutes}, ${day}.${month}.${year}`;
    }

    function showToast(message) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.innerHTML = `<h3>${message}</h3><button onclick="this.parentElement.remove()" class="auth-btn" style="margin-top:12px;">ОК</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function validateLogin(login) {
        const regex = /^[a-zA-Z0-9_+\-~]+$/;
        return regex.test(login) && login.length >= 3 && login.length <= 20;
    }

    // ========== АВТОРИЗАЦИЯ ==========
    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="auth-buttons">
                        <button id="showLoginBtn" class="auth-btn">Вход</button>
                        <button id="showRegBtn" class="auth-btn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }

    function showLogin() {
        document.getElementById('authForm').innerHTML = `
            <div class="prefix-input"><span>@</span><input type="text" id="login" placeholder="логин"></div>
            <input type="password" id="password" placeholder="Пароль">
            <button id="doLogin" class="auth-btn">Войти</button>
        `;
        document.getElementById('doLogin').onclick = async () => {
            let login = document.getElementById('login').value.trim();
            if (!login) { showToast('Введите логин'); return; }
            if (!login.startsWith('@')) login = '@' + login;
            const password = document.getElementById('password').value;
            if (!password) { showToast('Введите пароль'); return; }
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password }) });
            const data = await res.json();
            if (data.error) showToast(data.error);
            else { currentUser = data.login; currentUserData = data.user; startMessenger(); }
        };
    }

    function showRegister() {
        document.getElementById('authForm').innerHTML = `
            <div class="prefix-input"><span>@</span><input type="text" id="regLogin" placeholder="логин"></div>
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="date" id="regBirthdate">
            <textarea id="regAbout" rows="2" placeholder="О себе"></textarea>
            <button id="doReg" class="auth-btn">Зарегистрироваться</button>
        `;
        document.getElementById('doReg').onclick = async () => {
            let loginRaw = document.getElementById('regLogin').value.trim();
            if (!loginRaw) { showToast('Введите логин'); return; }
            if (!validateLogin(loginRaw)) {
                showToast('Логин: только латиница, цифры и символы _ + - ~ (3-20 символов)');
                return;
            }
            let login = '@' + loginRaw;
            const password = document.getElementById('regPassword').value;
            if (!password) { showToast('Введите пароль'); return; }
            const res = await fetch('/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
                login: login,
                password: password,
                name: loginRaw,
                surname: '',
                birthdate: document.getElementById('regBirthdate').value,
                about: document.getElementById('regAbout').value,
                favoriteGames: []
            })});
            const data = await res.json();
            if (data.error) showToast(data.error);
            else { showToast('Регистрация успешна! Войдите'); showLogin(); }
        };
    }

    // ========== ЗАГРУЗКА СПИСКОВ ==========
    async function loadUsersList() {
        try {
            const res = await fetch('/users');
            const data = await res.json();
            allUsersList = data.filter(u => u.login !== currentUser);
            if (activeLeftTab === 'users') renderLeftPanelContent();
        } catch(e) { console.error('Ошибка загрузки пользователей', e); }
    }

    async function loadChannelsList() {
        try {
            const res = await fetch('/chats');
            const chats = await res.json();
            channels = chats.filter(c => c.isChannel === true);
            if (activeLeftTab === 'channels') renderLeftPanelContent();
        } catch(e) { console.error('Ошибка загрузки каналов', e); }
    }

    async function loadGroupsList() {
        try {
            const res = await fetch('/chats');
            const chats = await res.json();
            groups = chats.filter(c => c.isGroup === true);
            if (activeLeftTab === 'groups') renderLeftPanelContent();
        } catch(e) { console.error('Ошибка загрузки групп', e); }
    }

    // ========== ОТОБРАЖЕНИЕ ЛЕВОЙ ПАНЕЛИ ==========
    function renderLeftPanelContent() {
        const container = document.getElementById('listContainer');
        const query = document.getElementById('leftSearchInput')?.value.toLowerCase() || '';
        if (!container) return;

        if (activeLeftTab === 'profile') {
            document.getElementById('contentTitle').innerText = 'Мой профиль';
            const avatarUrl = userAvatars[currentUser] || null;
            container.innerHTML = `
                <div class="list-item" onclick="showMyProfile()">
                    <div class="list-avatar" style="${avatarUrl ? `background-image:url(${avatarUrl}); background-size:cover;` : ''}">${!avatarUrl ? '⚡' : ''}</div>
                    <div class="list-info">
                        <div class="list-title">${currentUser}</div>
                        <div class="list-sub">Нажмите для просмотра</div>
                    </div>
                </div>
            `;
            return;
        }

        if (activeLeftTab === 'users') {
            document.getElementById('contentTitle').innerText = 'Пользователи';
            const filtered = allUsersList.filter(u => !query || u.login.toLowerCase().includes(query));
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет пользователей</div>';
                return;
            }
            container.innerHTML = filtered.map(u => `
                <div class="list-item" onclick="showUserProfile('${u.login}')">
                    <div class="list-avatar" style="${userAvatars[u.login] ? `background-image:url(${userAvatars[u.login]}); background-size:cover;` : ''}">${!userAvatars[u.login] ? '👤' : ''}</div>
                    <div class="list-info">
                        <div class="list-title">${u.login}</div>
                    </div>
                </div>
            `).join('');
            return;
        }

        if (activeLeftTab === 'channels') {
            document.getElementById('contentTitle').innerText = 'Каналы';
            const filtered = channels.filter(c => !query || c.name.toLowerCase().includes(query) || (c.login && c.login.toLowerCase().includes(query)));
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Нет каналов</div>';
                return;
            }
            container.innerHTML = filtered.map(c => `
                <div class="list-item" onclick="showChannelProfile('${c.id}')">
                    <div class="list-avatar" style="display:flex; align-items:center; justify-content:center; background:#0af;">${c.avatar || '📢'}</div>
                    <div class="list-info">
                        <div class="list-title">${c.name}</div>

    function sendMessage() {

            text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`;

    function sendFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const content = e.target.result;
            let html = '';
            if (file.type.startsWith('image/')) html = `<img src="${content}" class="media-content" onclick="viewMedia('${content}', 'image')" style="max-width:200px; border-radius:12px; cursor:pointer;">`;
            else if (file.type.startsWith('video/')) html = `<video src="${content}" class="media-content" controls style="max-width:200px; border-radius:12px;"></video>`;
            else html = `<div class="file-content" onclick="downloadFile('${content}', '${file.name}')">📎 ${file.name} (${(file.size/1024/1024).toFixed(2)} МБ)</div>`;
            socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: html, time: getFormattedTime() });
        };
        reader.readAsDataURL(file);
    }

    window.viewMedia = (src, type) => {
        const modal = document.createElement('div');
        modal.className = 'modal';
        if (type === 'image') modal.innerHTML = `<img src="${src}" style="max-width:90%; max-height:80%; border-radius:16px;">`;
        else modal.innerHTML = `<video src="${src}" controls style="max-width:90%; max-height:80%;"></video>`;
        modal.onclick = () => modal.remove();

    window.downloadFile = (url, name) => {

    function startVoiceRecording() {
        if (isRecording) {
            if (mediaRecorder) {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('voiceRecBar').style.display = 'none';
                document.getElementById('msgInput').style.display = 'block';
            }
            return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = e => {
                        socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<audio src="${e.target.result}" controls style="max-width:200px;"></audio>`, time: getFormattedTime() });
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('msgInput').style.display = 'none';
                document.getElementById('voiceRecBar').style.display = 'flex';
                let elapsed = 0;
                const interval = setInterval(() => {
                    if (!isRecording) { clearInterval(interval); return; }
                    elapsed += 0.1;
                    document.getElementById('voiceWaveFill').style.width = Math.min(100, (elapsed / 60) * 100) + '%';
                }, 100);
            })
            .catch(() => showToast('Нет доступа к микрофону'));
    }

    function cancelVoiceRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            document.getElementById('voiceRecBar').style.display = 'none';
            document.getElementById('msgInput').style.display = 'block';
        }
    }

    function renderMessages() {
        const container = document.getElementById('messagesList');
        if (!container) return;
        const msgs = messagesData[currentChat] || [];
        if (msgs.length === 0) {
            container.innerHTML = '<div style="text-align:center; opacity:0.5;">💬 Начните общение</div>';
            return;
        }
        container.innerHTML = msgs.map((msg, idx) => {
            const avatarHtml = getAvatarForUser(msg.from);
            return `
                <div class="message ${msg.from === currentUser ? 'my-message' : ''}" data-idx="${idx}">
                    <div class="message-avatar" onclick="showUserProfile('${msg.from}')">${avatarHtml}</div>
                    <div class="message-content">
                        <strong>${msg.from}:</strong> ${msg.text}<br>
                        <small>${msg.time}</small>
                        <div class="message-actions">
                            <span class="reply-action">↩️ Ответить</span>
                            <span class="forward-action">📤 Переслать</span>
                            ${msg.from === currentUser ? '<span class="delete-action">🗑️ Удалить</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        document.querySelectorAll('.reply-action').forEach(el => {
            el.onclick = () => {
                const idx = el.closest('.message').dataset.idx;
                const msg = messagesData[currentChat][idx];
                replyTo = { text: msg.text, from: msg.from };
                document.getElementById('msgInput').focus();
                document.getElementById('replyIndicator').innerHTML = `<span>↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"</span><button id="cancelReplyBtn" style="background:none; border:none; color:cyan; cursor:pointer;">✖ Отмена</button>`;
                document.getElementById('cancelReplyBtn').style.display = 'inline-block';
                document.getElementById('cancelReplyBtn').onclick = () => {
                    replyTo = null;
                    document.getElementById('replyIndicator').innerHTML = '<span></span><button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>';
                };
            };
        });
        document.querySelectorAll('.forward-action').forEach(el => { el.onclick = () => showToast('Пересылка в разработке'); });
        document.querySelectorAll('.delete-action').forEach(el => {
            el.onclick = () => {
                const idx = el.closest('.message').dataset.idx;
                const msg = messagesData[currentChat][idx];
                if (msg && msg.from === currentUser) {
                    if (confirm('Удалить сообщение?')) socket.emit('deleteMessage', { chatId: currentChat, messageIndex: idx });

    async function loadMessages() {
        if (currentChat === 'favorites') {
            const favoritesKey = `favorites_${currentUser}`;
            messagesData['favorites'] = JSON.parse(localStorage.getItem(favoritesKey) || '[]');
            renderMessages();
            return;
        }
        const res = await fetch(`/messages/${currentChat}`);
        messagesData[currentChat] = await res.json();
        renderMessages();
    }

    function saveFavoriteMessage(text) {
        const favoritesKey = `favorites_${currentUser}`;
        let favMessages = JSON.parse(localStorage.getItem(favoritesKey) || '[]');
        favMessages.push({ from: currentUser, text: text, time: getFormattedTime() });
        localStorage.setItem(favoritesKey, JSON.stringify(favMessages));
        if (currentChat === 'favorites') {
            messagesData['favorites'] = favMessages;
            renderMessages();
        }
    }

            subgroups[groupId].push({ id: Date.now(), name: name });
            saveSubgroups();
            renderChats();
            modal.remove();
            showToast(`Подгруппа "${name}" создана`);
        };
        modal.querySelector('#cancelCreate').onclick = () => modal.remove();
    }

    function deleteChat(chatId, chatName, leaveOnly) {
        if (chatId === 'favorites') { showToast('Избранное нельзя удалить'); return; }
        if (confirm(leaveOnly ? `Выйти из чата "${chatName}"?` : `Удалить чат "${chatName}"?`)) {
            if (leaveOnly) {
                const group = groups.find(g => g.id == chatId);
                if (group) group.members = group.members.filter(m => m !== currentUser);
                const channel = channels.find(c => c.id == chatId);
                if (channel) channel.members = channel.members.filter(m => m !== currentUser);
                saveGroups(); saveChannels();
            } else {
                groups = groups.filter(g => g.id != chatId);
                channels = channels.filter(c => c.id != chatId);
                saveGroups(); saveChannels();
            }
            allChats = allChats.filter(c => c.id !== chatId);
            delete messagesData[chatId];
            renderChats();
            if (currentChat === chatId) {
                currentChat = 'favorites';
                currentChatName = 'Избранное';
                document.getElementById('chatTitle').innerText = 'Избранное';
                loadMessages();
                socket.emit('join', currentChat);
            }
            showToast(leaveOnly ? `Вы вышли из ${chatName}` : `Чат ${chatName} удалён`);
        }
    }

    function performSearchInMessages() {
        const query = document.getElementById('messageSearchInput')?.value.toLowerCase();
        const searchCountSpan = document.getElementById('searchCount');
        if (!query) {
            clearAllHighlights();
            if (searchCountSpan) searchCountSpan.innerText = '0';
            return;
        }
        const messages = document.querySelectorAll('.chat-messages .message');
        clearAllHighlights();
        currentMatches = [];
        messages.forEach(msg => {
            const text = msg.innerText.toLowerCase();
            if (text.includes(query)) {
                msg.classList.add('highlight');
                currentMatches.push(msg);
            }
        });
        if (searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
        if (currentMatches.length > 0) {
            currentMatchIndex = 0;
            highlightCurrentMatch();
        } else currentMatchIndex = -1;
    }

    function clearAllHighlights() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => {
            msg.classList.remove('highlight', 'current-highlight');
        });
        currentMatches = [];
        currentMatchIndex = -1;
    }

    function highlightCurrentMatch() {
        document.querySelectorAll('.chat-messages .message').forEach(msg => msg.classList.remove('current-highlight'));
        if (currentMatchIndex >= 0 && currentMatches[currentMatchIndex]) {
            const currentMsg = currentMatches[currentMatchIndex];
            currentMsg.classList.add('current-highlight');
            currentMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            const searchCountSpan = document.getElementById('searchCount');
            if (searchCountSpan) searchCountSpan.innerText = `${currentMatchIndex + 1}/${currentMatches.length}`;
        } else if (currentMatches.length > 0 && searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
    }

    function navigateSearch(delta) {
        if (currentMatches.length === 0) return;
        currentMatchIndex += delta;
        if (currentMatchIndex < 0) currentMatchIndex = currentMatches.length - 1;
        if (currentMatchIndex >= currentMatches.length) currentMatchIndex = 0;
        highlightCurrentMatch();
    }

    function openSearch() {
        document.getElementById('searchBar').style.display = 'flex';
        document.getElementById('messageSearchInput').focus();
    }

    function closeSearch() {
        document.getElementById('searchBar').style.display = 'none';
        clearAllHighlights();
        document.getElementById('messageSearchInput').value = '';
        const searchCountSpan = document.getElementById('searchCount');
        if (searchCountSpan) searchCountSpan.innerText = '0';
    }

    // ========== ЗАГРУЗКА ЧАТОВ ==========
    async function loadChats() {
        const res = await fetch('/chats');
        let chats = await res.json();
        allChats = chats.filter(c => c.name !== 'Новости ST_Link' && !deletedChats.includes(c.id));
        if (!allChats.find(c => c.id === 'favorites')) allChats.unshift({ id: 'favorites', name: 'Избранное', avatar: '⭐', private: true });
        groups.forEach(g => { if (g.members && g.members.includes(currentUser) && !allChats.some(c => c.id === g.id)) allChats.push({ id: g.id, name: g.name, avatar: g.avatar, isGroup: true, creator: g.creator }); });
        channels.forEach(c => { if (c.members && c.members.includes(currentUser) && !allChats.some(ch => ch.id === c.id)) allChats.push({ id: c.id, name: c.name, avatar: c.avatar, isChannel: true, creator: c.creator }); });
    }

    function renderChats() {
        const container = document.getElementById('chatsList');
        if (!container) return;
        container.innerHTML = '';
        allChats.forEach(chat => {
            const isMuted = mutedChats[chat.id];
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `<div class="chat-info"><span>${chat.avatar || '💬'}</span><span>${chat.name} ${isMuted ? '<span class="chat-muted-icon">🔇</span>' : ''}</span></div>`;
            div.onclick = () => {
                currentChat = chat.id;
                currentChatName = chat.name;
                document.getElementById('chatTitle').innerText = chat.name;
                loadMessages();
                socket.emit('join', chat.id);
                closeSearch();
                replyTo = null;
                document.getElementById('replyIndicator').innerHTML = '<span></span><button id="cancelReplyBtn" style="display:none;">✖ Отмена</button>';
            };
            container.appendChild(div);
            if (subgroups[chat.id] && subgroups[chat.id].length > 0) {
                subgroups[chat.id].forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'subgroup-item';
                    subDiv.innerHTML = `<div class="chat-info"><span>📌</span><span style="font-size:13px;">${sub.name}</span></div>`;
                    subDiv.onclick = (e) => {
                        e.stopPropagation();
                        currentChat = `sub_${sub.id}`;
                        currentChatName = sub.name;
                        document.getElementById('chatTitle').innerText = sub.name;
                        if (!messagesData[currentChat]) messagesData[currentChat] = [];
                        renderMessages();
                        socket.emit('join', currentChat);
                        closeSearch();
                    };
                    container.appendChild(subDiv);
                });
            }
        });
    }

    // ========== ОСНОВНОЙ ЗАПУСК ==========
    async function startMessenger() {
        await loadUsersList();
        await loadChannelsList();
        await loadGroupsList();
        await loadChats();
        socket = io();
        socket.on('newMessage', (msg) => {
            if (currentChat === 'favorites') return;
            if (!messagesData[currentChat]) messagesData[currentChat] = [];
            messagesData[currentChat].push(msg);
            renderMessages();
            if (!mutedChats[currentChat] && msg.from !== currentUser) {
                const audio = new Audio('/sounds/notifica.mp3');
                audio.play().catch(e => console.log);
                document.title = '🔔 Новое сообщение';
                setTimeout(() => document.title = 'StormLink', 3000);
            }
        });
        socket.on('messageDeleted', ({ chatId, messageIndex }) => {
            if (chatId === 'favorites') return;
            if (messagesData[chatId]) { messagesData[chatId].splice(messageIndex, 1); if (chatId === currentChat) renderMessages(); }
        });

        document.getElementById('app').innerHTML = `
            <button class="burger-btn" id="burgerBtn">☰</button>
            <div class="messenger">
                <div class="icon-bar">
                    <div class="icon-item ${activeLeftTab === 'profile' ? 'active' : ''}" id="tabProfile">👤</div>
                    <div class="icon-item ${activeLeftTab === 'users' ? 'active' : ''}" id="tabUsers">👥</div>
                    <div class="icon-item ${activeLeftTab === 'channels' ? 'active' : ''}" id="tabChannels">📢</div>
                    <div class="icon-item ${activeLeftTab === 'groups' ? 'active' : ''}" id="tabGroups">👥</div>
                </div>
                <div class="content-panel" id="contentPanel">
                    <div class="search-header">
                        <input type="text" id="leftSearchInput" placeholder="Поиск...">
                    </div>
                    <div class="content-header" id="contentTitle">Мой профиль</div>
                    <div class="list-container" id="listContainer"></div>
                </div>
                <div class="chat-panel" id="chatContainer">
                    <div style="display:flex; align-items:center; justify-content:center; height:100%; opacity:0.5;">Выберите чат</div>
                </div>
            </div>
            <button class="friends-icon" id="friendsIcon">👥</button>
        `;

        document.getElementById('tabProfile').onclick = () => { activeLeftTab = 'profile'; renderLeftPanelContent(); };
        document.getElementById('tabUsers').onclick = () => { activeLeftTab = 'users'; renderLeftPanelContent(); };
        document.getElementById('tabChannels').onclick = () => { activeLeftTab = 'channels'; renderLeftPanelContent(); };
        document.getElementById('tabGroups').onclick = () => { activeLeftTab = 'groups'; renderLeftPanelContent(); };
        document.getElementById('leftSearchInput').addEventListener('input', () => renderLeftPanelContent());
        document.getElementById('friendsIcon').onclick = showFriendsList;
        document.getElementById('burgerBtn').onclick = () => document.getElementById('contentPanel').classList.toggle('open');

        renderLeftPanelContent();
        renderChats();
        loadMessages();
        socket.emit('join', currentChat);
    }

    function showFriendsList() {
        const userFriends = friends[currentUser] || [];
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `<div class="friends-list"><h3>👥 Друзья</h3><div id="friendsContainer"></div><button id="closeFriends" class="auth-btn" style="margin-top:16px;">Закрыть</button></div>`;
        document.body.appendChild(modal);
        const container = modal.querySelector('#friendsContainer');
        if (userFriends.length === 0) container.innerHTML = '<p style="text-align:center;">Нет друзей</p>';
        else {
            userFriends.forEach(login => {
                const avatar = userAvatars[login] || null;
                const div = document.createElement('div');
                div.className = 'friend-item';
                div.innerHTML = `<div class="friend-avatar" style="${avatar ? `background-image:url(${avatar}); background-size:cover;` : ''}">${!avatar ? '⚡' : ''}</div><div><strong>${login}</strong></div>`;
                div.onclick = () => { modal.remove(); showUserProfile(login); };
                container.appendChild(div);
            });
        }
        modal.querySelector('#closeFriends').onclick = () => modal.remove();
    }

    renderAuth();
</script>
