<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>StormLink</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #0a0f1e, #03050a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .messenger {
            width: 1400px;
            height: 90vh;
            display: flex;
            background: rgba(6,12,24,0.7);
            border-radius: 28px;
            border: 1px solid #0af;
            box-shadow: 0 0 20px #0af;
            overflow: hidden;
            backdrop-filter: blur(20px);
        }
        
        /* НОВАЯ ЛЕВАЯ ПАНЕЛЬ (меню) */
        .left-menu {
            width: 260px;
            background: rgba(2,8,18,0.9);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }
        .menu-header {
            padding: 20px;
            border-bottom: 1px solid rgba(0,255,255,0.3);
            font-size: 20px;
            font-weight: bold;
            color: #0af;
        }
        .menu-items {
            flex: 1;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            background: rgba(0,255,255,0.05);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
        }
        .menu-item:hover { background: rgba(0,255,255,0.15); border: 1px solid #0af; }
        .menu-item.active { background: #0af; color: black; }
        .menu-item span:first-child { font-size: 24px; }
        
        .content-panel {
            flex: 1;
            background: rgba(2,8,18,0.5);
            border-right: 1px solid rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }
        
        .global-search-header {
            padding: 12px 16px;
            border-bottom: 1px solid #0af;
            background: rgba(2,8,18,0.8);
        }
        .global-search-input-wrapper {
            display: flex;
            align-items: center;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 10px 16px;
            gap: 10px;
        }
        .global-search-input-wrapper span { font-size: 18px; opacity: 0.7; }
        .global-search-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 15px;
        }
        .clear-search-btn {
            background: none;
            border: none;
            color: cyan;
            cursor: pointer;
            font-size: 18px;
        }
        
        .search-results-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: none;
        }
        .search-category { margin-bottom: 20px; }
        .search-category-title {
            color: #0af;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 8px 12px;
            background: rgba(0,170,255,0.1);
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .search-result-item {
            background: rgba(0,255,255,0.05);
            border-radius: 16px;
            padding: 10px 12px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-result-item:hover { background: rgba(0,255,255,0.15); border: 1px solid #0af; }
        .search-result-avatar {
            width: 44px;
            height: 44px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
        }
        .search-result-info { flex: 1; }
        .search-result-title { font-weight: bold; font-size: 14px; }
        .search-result-subtitle { font-size: 11px; opacity: 0.6; }
        .search-result-preview { font-size: 12px; opacity: 0.7; margin-top: 2px; }
        .no-results { text-align: center; padding: 40px; opacity: 0.5; }
        
        .nav-tabs {
            display: flex;
            border-bottom: 1px solid rgba(0,255,255,0.3);
            background: rgba(2,8,18,0.5);
        }
        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-size: 13px;
            color: rgba(255,255,255,0.6);
        }
        .nav-tab:hover { background: rgba(0,255,255,0.1); }
        .nav-tab.active { color: #0af; border-bottom: 2px solid #0af; }
        
        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .list-item {
            background: rgba(0,255,255,0.05);
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .list-item:hover { background: rgba(0,255,255,0.15); border: 1px solid #0af; }
        .list-avatar {
            width: 48px;
            height: 48px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .online-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background: #2ecc71;
            border-radius: 50%;
            border: 2px solid #0a0f1e;
            display: none;
        }
        .online-dot.online { display: block; }
        .list-info { flex: 1; }
        .list-title { font-weight: bold; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .list-sub { font-size: 11px; opacity: 0.6; }
        .unread-badge { background: #ff3333; border-radius: 20px; padding: 2px 8px; font-size: 10px; }
        .empty-state { text-align: center; padding: 40px; opacity: 0.5; }
        
        .add-btn {
            background: rgba(0,200,255,0.2);
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin: 12px;
            font-size: 14px;
            transition: 0.2s;
        }
        .add-btn:hover { background: rgba(0,200,255,0.4); }
        
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: rgba(6,12,24,0.4); }
        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid #0af;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2,8,18,0.7);
        }
        .chat-title { font-size: 18px; font-weight: bold; }
        .chat-header-dots { background: none; border: none; color: cyan; font-size: 28px; cursor: pointer; padding: 4px 12px; }
        
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .message {
            max-width: 70%;
            background: rgba(0,255,255,0.1);
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            position: relative;
        }
        .message.pinned { border: 2px solid #ffcc00; background: rgba(255,204,0,0.1); }
        .message.editing { background: rgba(255,100,0,0.3); border: 1px solid #ff6600; }
        .my-message { align-self: flex-end; background: #0af; color: black; }
        .message-avatar {
            width: 36px;
            height: 36px;
            background: #0af;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            cursor: pointer;
            position: relative;
        }
        .message-content { flex: 1; }
        .message-actions {
            display: none;
            gap: 12px;
            margin-top: 6px;
            font-size: 12px;
            justify-content: flex-end;
        }
        .message:hover .message-actions { display: flex; }
        .message-actions span { cursor: pointer; opacity: 0.7; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 16px; }
        .pin-badge { position: absolute; top: -8px; right: 8px; background: #ffcc00; color: black; border-radius: 20px; padding: 2px 8px; font-size: 10px; }
        
        .edit-input {
            width: 100%;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 20px;
            padding: 6px 10px;
            color: white;
            outline: none;
            margin-top: 4px;
        }
        
        .chat-input {
            display: flex;
            padding: 12px;
            gap: 10px;
            border-top: 1px solid #0af;
            background: rgba(2,8,18,0.7);
        }
        .chat-input input { flex: 1; padding: 10px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; color: white; outline: none; }
        .chat-input button { background: none; border: none; font-size: 24px; cursor: pointer; color: #0af; padding: 0 10px; }
        
        .reply-indicator { font-size: 12px; opacity: 0.7; margin-bottom: 4px; border-left: 2px solid cyan; padding-left: 8px; }
        .voice-recording { display: flex; align-items: center; gap: 12px; background: #010a1a; border: 1px solid #0af; border-radius: 40px; padding: 8px 16px; flex: 1; }
        .voice-wave { flex: 1; height: 30px; background: rgba(0,255,255,0.2); border-radius: 20px; overflow: hidden; }
        .voice-wave-fill { width: 0%; height: 100%; background: cyan; transition: width 0.1s linear; }
        
        /* ВИДЕОКРУЖОК ПРЕВЬЮ */
        .video-preview-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            flex-direction: column;
            gap: 20px;
        }
        .video-preview-circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0af;
            box-shadow: 0 0 30px cyan;
        }
        .video-preview-circle video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-preview-buttons {
            display: flex;
            gap: 30px;
        }
        .video-preview-buttons button {
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
        }
        .send-video-btn { background: #0af; color: black; }
        .cancel-video-btn { background: #ff3333; color: white; }
        
        .modal, .modal-confirm, .modal-toast {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-box, .profile-card, .auth-box {
            background: #0c1322;
            border: 2px solid #0af;
            border-radius: 28px;
            padding: 28px;
            width: 380px;
            text-align: center;
        }
        .modal-box input, .modal-box textarea, .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            color: white;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .modal-buttons button, .auth-btn { flex: 1; padding: 12px; background: #0af; border: none; border-radius: 40px; cursor: pointer; }
        
        .member-list { max-height: 200px; overflow-y: auto; margin-top: 12px; }
        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            background: rgba(0,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .member-role { font-size: 10px; background: #0af; border-radius: 12px; padding: 2px 8px; }
        .member-role.admin { background: #ff6600; }
        .member-actions button { background: none; border: none; cursor: pointer; font-size: 16px; margin-left: 8px; }
        
        .progress-bar-container { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #0af; transition: width 0.1s; }
        .cancel-upload {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff3333;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
        }
        
        .friends-icon {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0af;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            z-index: 25;
            box-shadow: 0 0 15px cyan;
            position: relative;
        }
        .friend-request-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff3333;
            border-radius: 50%;
            min-width: 22px;
            height: 22px;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
        }
        
        .burger-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            background: #0af;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            z-index: 1001;
        }
        .mobile-back-btn { display: none; background: none; border: none; color: cyan; font-size: 28px; cursor: pointer; }
        
        .emoji-picker { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0; font-size: 28px; }
        .emoji-option { cursor: pointer; padding: 4px 8px; border-radius: 12px; }
        .prefix-input {
            display: flex;
            align-items: center;
            background: #010a1a;
            border: 1px solid #0af;
            border-radius: 40px;
            padding: 0 12px;
            margin: 12px 0;
        }
        .prefix-input span { color: #0af; font-weight: bold; margin-right: 4px; }
        .prefix-input input { flex: 1; background: transparent; border: none; padding: 12px 0; color: white; outline: none; }
        
        .chat-menu {
            position: fixed;
            background: #0a1428;
            border: 1px solid #0af;
            border-radius: 16px;
            padding: 8px;
            z-index: 200;
        }
        .chat-menu div { padding: 8px 16px; cursor: pointer; border-radius: 12px; }
        .chat-menu div:hover { background: #0af; color: black; }
        
        .theme-selector { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .theme-color { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .theme-color:hover { border-color: white; }
        .theme-color.selected { border-color: #0af; box-shadow: 0 0 10px cyan; }
        
        @media (max-width: 768px) {
            .messenger { width: 100%; height: 100vh; border-radius: 0; }
            .burger-btn { display: block; }
            .left-menu {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                width: 260px;
                transform: translateX(-100%);
                z-index: 1000;
                transition: transform 0.2s;
                background: rgba(2,8,18,0.98);
            }
            .left-menu.open { transform: translateX(0); }
            .content-panel { width: 100%; }
            .mobile-back-btn { display: block; }
            .chat-header { padding-left: 60px; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let socket = null;
    let currentUser = null;
    let currentUserData = null;
    let currentChat = null;
    let allChats = [];
    let messagesData = {};
    let mutedChats = JSON.parse(localStorage.getItem('mutedChats') || '{}');
    let userAvatars = JSON.parse(localStorage.getItem('userAvatars') || '{}');
    let deletedChats = JSON.parse(localStorage.getItem('deletedChats') || '[]');
    let subgroups = JSON.parse(localStorage.getItem('subgroups') || '{}');
    let friends = [];
    let friendRequests = [];
    let groupJoinRequests = [];
    let groups = [];
    let channels = [];
    let replyTo = null;
    let mediaRecorder = null;
    let videoRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let isRecording = false;
    let isVideoRecording = false;
    let currentMatches = [];
    let currentMatchIndex = -1;
    let activeTab = 'chats';
    let allUsersList = [];
    let unreadData = {};
    let onlineUsers = JSON.parse(localStorage.getItem('onlineUsers') || '{}');
    let editingMessage = null;
    let pinnedMessages = JSON.parse(localStorage.getItem('pinnedMessages') || '{}');
    let chatSettings = JSON.parse(localStorage.getItem('chatSettings') || '{}');
    let themes = JSON.parse(localStorage.getItem('themes') || '{}');
    let currentTheme = localStorage.getItem('currentTheme') || 'dark';
    let groupRoles = JSON.parse(localStorage.getItem('groupRoles') || '{}');
    let groupBlacklist = JSON.parse(localStorage.getItem('groupBlacklist') || '{}');
    let fileUploads = {};
    let offlineMessages = JSON.parse(localStorage.getItem('offlineMessages') || '{}');
    let messageLoadPage = {};
    let currentVideoBlob = null;
    
    // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
    function saveMuted() { localStorage.setItem('mutedChats', JSON.stringify(mutedChats)); }
    function saveAvatars() { localStorage.setItem('userAvatars', JSON.stringify(userAvatars)); }
    function saveDeletedChats() { localStorage.setItem('deletedChats', JSON.stringify(deletedChats)); }
    function saveSubgroups() { localStorage.setItem('subgroups', JSON.stringify(subgroups)); }
    function saveOnlineUsers() { localStorage.setItem('onlineUsers', JSON.stringify(onlineUsers)); }
    function savePinnedMessages() { localStorage.setItem('pinnedMessages', JSON.stringify(pinnedMessages)); }
    function saveChatSettings() { localStorage.setItem('chatSettings', JSON.stringify(chatSettings)); }
    function saveThemes() { localStorage.setItem('themes', JSON.stringify(themes)); }
    function saveGroupRoles() { localStorage.setItem('groupRoles', JSON.stringify(groupRoles)); }
    function saveGroupBlacklist() { localStorage.setItem('groupBlacklist', JSON.stringify(groupBlacklist)); }
    function saveOfflineMessages() { localStorage.setItem('offlineMessages', JSON.stringify(offlineMessages)); }
    
    function applyTheme() {
        const themesColors = {
            dark: { bg: 'radial-gradient(circle, #0a0f1e, #03050a)', border: '#0af', accent: '#0af' },
            light: { bg: 'radial-gradient(circle, #e0e0e0, #f5f5f5)', border: '#0af', accent: '#0af' },
            blue: { bg: 'radial-gradient(circle, #001a4a, #000a1a)', border: '#0af', accent: '#0af' },
            green: { bg: 'radial-gradient(circle, #0a2a1a, #031005)', border: '#0f0', accent: '#0f0' },
            purple: { bg: 'radial-gradient(circle, #2a0a3a, #150520)', border: '#a0a', accent: '#a0a' }
        };
        const theme = themesColors[currentTheme] || themesColors.dark;
        document.body.style.background = theme.bg;
        const elements = document.querySelectorAll('.messenger, .left-menu, .content-panel, .chat-panel, .chat-header');
        elements.forEach(el => { if(el) el.style.borderColor = theme.border; });
    }
    
    function getFormattedTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}, ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear()}`;
    }
    
    function showToast(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'modal-toast';
        toast.style.background = isError ? '#ff3333' : '#0c1322';
        toast.innerHTML = `<h3>${msg}</h3><button onclick="this.parentElement.remove()" class="auth-btn">OK</button>`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function showConfirmDialog(title, onConfirm) {
        const modal = document.createElement('div');
        modal.className = 'modal-confirm';
        modal.innerHTML = `<div class="modal-box"><h3>${title}</h3><div class="modal-buttons"><button id="confirmYes">Да</button><button id="confirmNo">Нет</button></div></div>`;
        document.body.appendChild(modal);
        document.getElementById('confirmYes').onclick = () => { onConfirm(); modal.remove(); };
        document.getElementById('confirmNo').onclick = () => modal.remove();
    }
    
    // ========== АВТОРИЗАЦИЯ ==========
    async function renderAuth() {
        document.getElementById('app').innerHTML = `
            <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center;">
                <div class="auth-box">
                    <h2>⚡ STORMLINK</h2>
                    <div class="modal-buttons" style="margin:20px 0">
                        <button id="showLoginBtn" class="auth-btn">Вход</button>
                        <button id="showRegBtn" class="auth-btn">Регистрация</button>
                    </div>
                    <div id="authForm"></div>
                </div>
            </div>
        `;
        document.getElementById('showLoginBtn').onclick = showLogin;
        document.getElementById('showRegBtn').onclick = showRegister;
        showLogin();
    }
    
    function showLogin() {
        const authForm = document.getElementById('authForm');
        if (!authForm) return;
        authForm.innerHTML = `<input type="text" id="login" placeholder="Логин"><input type="password" id="password" placeholder="Пароль"><button id="doLogin" class="auth-btn">Войти</button>`;
        document.getElementById('doLogin').onclick = async () => {
            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ login, password }) });
            const data = await res.json();
            if (data.error) showToast(data.error, true);
            else { currentUser = data.login; currentUserData = data.user; localStorage.setItem('authToken', data.user.token); startMessenger(); }
        };
    }
    
    function showRegister() {
        const authForm = document.getElementById('authForm');
        if (!authForm) return;

    // ========== ЗАГРУЗКА ДАННЫХ ==========
    async function loadAllData() {
        await Promise.all([
            fetch('/users').then(r => r.json()).then(data => { allUsersList = data.filter(u => u.login !== currentUser); }),
            fetch('/chats').then(r => r.json()).then(data => { 
                allChats = data; 
                groups = data.filter(c => c.isGroup === true); 
                channels = data.filter(c => c.isChannel === true); 
            }),
            fetch(`/friends/${currentUser}`).then(r => r.json()).then(data => { friends = data.friends || []; }),
            fetch(`/friend-requests/${currentUser}`).then(r => r.json()).then(data => { friendRequests = data.requests || []; }),
            fetch(`/group-requests/${currentUser}`).then(r => r.json()).then(data => { groupJoinRequests = data.requests || []; }),
            fetch(`/unread/${currentUser}`).then(r => r.json()).then(data => { unreadData = data.unread || {}; })
        ]);
        updateFriendRequestBadge();
        renderLeftPanelContent();
        renderJoinRequestsInMenu();
        applyTheme();
    }
    
    function updateFriendRequestBadge() {
        const friendIcon = document.getElementById('friendsIcon');
        if (!friendIcon) return;
        let badge = friendIcon.querySelector('.friend-request-count');
        const count = friendRequests.length;
        if (!badge) { badge = document.createElement('div'); badge.className = 'friend-request-count'; friendIcon.appendChild(badge); }
        if (count > 0) { badge.innerText = count > 9 ? '9+' : count; badge.style.display = 'flex'; }
        else { badge.style.display = 'none'; }
    }
    
    function getUnreadCount(chatId) {
        const count = unreadData[chatId] || 0;
        const isMuted = mutedChats[chatId];
        if (count === 0) return '';
        return `<span class="unread-badge ${isMuted ? 'muted' : ''}">${count}</span>`;
    }
    
    function renderJoinRequestsInMenu() {
        const container = document.getElementById('joinRequestsContainer');
        if (!container) return;
        if (groupJoinRequests.length === 0) { container.innerHTML = '<div class="empty-state" style="padding:8px;">Нет заявок в группы</div>'; return; }

        document.querySelectorAll('.decline-group').forEach(btn => { btn.onclick = async (e) => { e.stopPropagation(); await fetch('/respond-group-request', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ groupId: btn.dataset.group, fromUser: btn.dataset.user, toUser: currentUser, accept: false }) }); await loadAllData(); showToast(`Заявка отклонена`); }; });

    // ========== РЕНДЕР ЛЕВОЙ ПАНЕЛИ ==========

        if (!container) return;
        
        // Добавляем Избранное для текущего пользователя

        }
        
        const myChats = allChats.filter(chat => {
            if (chat.id === favoritesId) return true;
            if (chat.isGroup && chat.members?.includes(currentUser) && !groupBlacklist[chat.id]?.includes(currentUser)) return true;
            if (chat.isChannel && chat.members?.includes(currentUser)) return true;
            if (!chat.isGroup && !chat.isChannel && chat.members?.includes(currentUser) && !deletedChats.includes(chat.id)) return true;

        if (activeTab === 'chats') {

                        const otherUser = chat.members?.find(m => m !== currentUser);

                    }

            const myGroups = groups.filter(g => g.members?.includes(currentUser));
            if (myGroups.length === 0) { container.innerHTML = '<div class="empty-state">Нет групп</div>'; }
            else {
                container.innerHTML = myGroups.map(group => `<div class="list-item" data-group-id="${group.id}"><div class="list-avatar">${group.avatar || '👥'}</div><div class="list-info"><div class="list-title">${group.name}</div><div class="list-sub">${group.members?.length || 0} участников</div></div></div>`).join('');
                document.querySelectorAll('.list-item[data-group-id]').forEach(item => { item.onclick = () => { const group = groups.find(g => g.id === item.dataset.groupId); if(group){ currentChat = group.id; document.getElementById('chatTitle').innerText = group.name; loadMessages(); socket.emit('join', currentChat); if(window.innerWidth <= 768) document.querySelector('.left-menu').classList.remove('open'); } }; });
            }
        }
        else if (activeTab === 'channels') {
            document.getElementById('contentTitle').innerText = '📢 Каналы';
            const myChannels = channels.filter(c => c.members?.includes(currentUser));
            if (myChannels.length === 0) { container.innerHTML = '<div class="empty-state">Нет каналов</div>'; }
            else {
                container.innerHTML = myChannels.map(channel => `<div class="list-item" data-channel-id="${channel.id}"><div class="list-avatar">${channel.avatar || '📢'}</div><div class="list-info"><div class="list-title">${channel.name}</div><div class="list-sub">@${(channel.login || channel.id).replace(/^@+/, '')}</div></div></div>`).join('');

    // ========== ГЛОБАЛЬНЫЙ ПОИСК ==========
    function performGlobalSearch(query) {
        const searchQuery = query.toLowerCase().trim();
        const resultsContainer = document.getElementById('searchResultsContainer');
        if (!searchQuery) { resultsContainer.innerHTML = '<div class="no-results">🔍 Введите запрос</div>'; return; }
        
        const results = { chats: [], users: [], groups: [], channels: [], messages: [] };
        
        allChats.forEach(chat => {
            if (chat.isGroup || chat.isChannel) return;
            if (chat.name?.toLowerCase().includes(searchQuery)) results.chats.push(chat);
        });
        groups.forEach(group => { if (group.name?.toLowerCase().includes(searchQuery)) results.groups.push(group); });
        channels.forEach(channel => { if (channel.name?.toLowerCase().includes(searchQuery)) results.channels.push(channel); });
        allUsersList.forEach(user => { if (user.login.toLowerCase().includes(searchQuery)) results.users.push(user); });
        
        for (const chatId of Object.keys(messagesData)) {
            const chat = allChats.find(c => c.id === chatId);
            if (!chat) continue;
            messagesData[chatId].forEach((msg, idx) => {
                if (msg.text && msg.text.toLowerCase().includes(searchQuery)) {
                    results.messages.push({ chatId, chatName: chat.name, messageText: msg.text.substring(0, 60), messageFrom: msg.from, messageIndex: idx });
                }
            });
        }
        
        let html = '';
        if (results.chats.length) { html += `<div class="search-category"><div class="search-category-title">💬 ЧАТЫ</div>`; results.chats.forEach(chat => { html += `<div class="search-result-item" data-type="chat" data-id="${chat.id}"><div class="search-result-avatar">💬</div><div class="search-result-info"><div class="search-result-title">${chat.name}</div></div></div>`; }); html += `</div>`; }
        if (results.groups.length) { html += `<div class="search-category"><div class="search-category-title">👥 ГРУППЫ</div>`; results.groups.forEach(group => { html += `<div class="search-result-item" data-type="group" data-id="${group.id}"><div class="search-result-avatar">${group.avatar || '👥'}</div><div class="search-result-info"><div class="search-result-title">${group.name}</div></div></div>`; }); html += `</div>`; }
        if (results.channels.length) { html += `<div class="search-category"><div class="search-category-title">📢 КАНАЛЫ</div>`; results.channels.forEach(channel => { html += `<div class="search-result-item" data-type="channel" data-id="${channel.id}"><div class="search-result-avatar">${channel.avatar || '📢'}</div><div class="search-result-info"><div class="search-result-title">${channel.name}</div></div></div>`; }); html += `</div>`; }
        if (results.users.length) { html += `<div class="search-category"><div class="search-category-title">👤 ПОЛЬЗОВАТЕЛИ</div>`; results.users.forEach(user => { html += `<div class="search-result-item" data-type="user" data-login="${user.login}"><div class="search-result-avatar">👤</div><div class="search-result-info"><div class="search-result-title">${user.login}</div></div></div>`; }); html += `</div>`; }
        if (results.messages.length) { html += `<div class="search-category"><div class="search-category-title">💬 СООБЩЕНИЯ</div>`; results.messages.forEach(msg => { html += `<div class="search-result-item" data-type="message" data-chat-id="${msg.chatId}" data-message-index="${msg.messageIndex}"><div class="search-result-avatar">💬</div><div class="search-result-info"><div class="search-result-title">${msg.chatName}</div><div class="search-result-preview">${msg.messageFrom}: ${msg.messageText}...</div></div></div>`; }); html += `</div>`; }
        if (!html) html = '<div class="no-results">😔 Ничего не найдено</div>';
        resultsContainer.innerHTML = html;
        
        document.querySelectorAll('.search-result-item[data-type="chat"], .search-result-item[data-type="group"], .search-result-item[data-type="channel"]').forEach(el => { el.onclick = () => openChatById(el.dataset.id); });
        document.querySelectorAll('.search-result-item[data-type="user"]').forEach(el => { el.onclick = () => window.showUserProfile(el.dataset.login); });
        document.querySelectorAll('.search-result-item[data-type="message"]').forEach(el => { el.onclick = () => { openChatById(el.dataset.chatId, parseInt(el.dataset.messageIndex)); }; });
    }
    
    function openChatById(chatId, highlightIndex = null) {
        const chat = allChats.find(c => c.id === chatId);
        if (!chat) return;
        currentChat = chatId;
        document.getElementById('chatTitle').innerText = chat.name;
        loadMessages();
        socket.emit('join', currentChat);
        socket.emit('markRead', { chatId: currentChat, user: currentUser });
        unreadData[currentChat] = 0;
        if (highlightIndex !== null) {
            setTimeout(() => { const msgs = document.querySelectorAll('.message'); if(msgs[highlightIndex]) { msgs[highlightIndex].classList.add('highlight'); msgs[highlightIndex].scrollIntoView(); setTimeout(() => msgs[highlightIndex]?.classList.remove('highlight'), 3000); } }, 200);
        }
        if (window.innerWidth <= 768) document.querySelector('.left-menu').classList.remove('open');
        renderLeftPanelContent();
    }
    
    function clearSearch() {
        document.getElementById('globalSearchInput').value = '';
        document.getElementById('searchResultsContainer').style.display = 'none';
        document.getElementById('listContainer').style.display = 'flex';
        renderLeftPanelContent();
    }

    async function createGroup() {
        const name = prompt('Введите название группы:');
        if (!name) return;
        const login = prompt('Введите логин группы (например: my_group):');
        const res = await fetch('/create-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, login: login ? '@' + login.replace(/^@+/, '') : '@' + name, avatar: '👥', creator: currentUser, members: [currentUser], isGroup: true })
        });
        const data = await res.json();
        if (data.chatId) { 
            groupRoles[data.chatId] = { [currentUser]: 'owner' };
            saveGroupRoles();
            await loadAllData(); 
            showToast(`Группа "${name}" создана!`); 
        } else showToast('Ошибка создания', true);
    }

        const name = prompt('Введите название канала:');
        if (!name) return;
        const login = prompt('Введите логин канала (например: my_channel):');
        const res = await fetch('/create-chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

    // ========== ВИДЕОКРУЖОК С ПРЕВЬЮ ==========
    async function startVideoRecordingWithPreview() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const recorder = new MediaRecorder(stream);
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                currentVideoBlob = blob;
                const url = URL.createObjectURL(blob);
                showVideoPreview(url);
                stream.getTracks().forEach(t => t.stop());
            };
            recorder.start();
            showToast('🎥 Запись... (до 60 сек)', false);
            setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 60000);
            window.currentVideoRecorder = recorder;
        } catch(e) { showToast('Нет доступа к камере', true); }
    }
    
    function showVideoPreview(videoUrl) {
        const overlay = document.createElement('div');
        overlay.className = 'video-preview-overlay';
        overlay.innerHTML = `
            <div class="video-preview-circle"><video src="${videoUrl}" autoplay loop muted></video></div>
            <div class="video-preview-buttons"><button class="send-video-btn">📤 Отправить</button><button class="cancel-video-btn">✖ Отмена</button></div>
        `;
        document.body.appendChild(overlay);
        overlay.querySelector('.send-video-btn').onclick = () => {
            const reader = new FileReader();
            reader.onload = e => { socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<video src="${e.target.result}" controls style="max-width:200px; border-radius:50%;"></video>`, time: getFormattedTime() }); };
            reader.readAsDataURL(currentVideoBlob);
            overlay.remove();
        };
        overlay.querySelector('.cancel-video-btn').onclick = () => overlay.remove();
    }
    
    // ========== ОТПРАВКА ФАЙЛОВ С ПРОГРЕССОМ ==========
    function sendFileWithProgress(file) {
        const fileId = Date.now();
        fileUploads[fileId] = { progress: 0, cancelled: false };
        
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message my-message';
        msgDiv.style.position = 'relative';
        msgDiv.innerHTML = `<div class="message-content">📤 Загрузка: ${file.name}<div class="progress-bar-container"><div class="progress-bar" style="width:0%"></div></div><div class="cancel-upload" data-id="${fileId}">✖</div></div>`;
        document.getElementById('messagesList').appendChild(msgDiv);
        
        const reader = new FileReader();
        reader.onload = (e) => {
            if (fileUploads[fileId]?.cancelled) return;
            let html = '';
            if (file.type.startsWith('image/')) html = `<img src="${e.target.result}" class="media-content" onclick="viewMedia('${e.target.result}', 'image')" style="max-width:200px; border-radius:12px; cursor:pointer;">`;
            else if (file.type.startsWith('video/')) html = `<video src="${e.target.result}" class="media-content" controls style="max-width:200px; border-radius:12px;"></video>`;
            else html = `<div class="file-content" onclick="downloadFile('${e.target.result}', '${file.name}')">📎 ${file.name}</div>`;
            socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: html, time: getFormattedTime() });
            msgDiv.remove();
            delete fileUploads[fileId];
        };
        reader.readAsDataURL(file);
        
        let progress = 0;
        const interval = setInterval(() => {
            if (fileUploads[fileId]?.cancelled) { clearInterval(interval); return; }
            progress += 10;
            const progressBar = msgDiv.querySelector('.progress-bar');
            if (progressBar) progressBar.style.width = progress + '%';
            if (progress >= 100) clearInterval(interval);
        }, 100);
        
        msgDiv.querySelector('.cancel-upload').onclick = () => {
            fileUploads[fileId].cancelled = true;
            msgDiv.remove();
            showToast('Загрузка отменена');
        };
    }

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => { mediaRecorder = new MediaRecorder(stream); audioChunks = []; mediaRecorder.ondataavailable = e => audioChunks.push(e.data); mediaRecorder.onstop = () => { const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); const reader = new FileReader(); reader.onload = e => { socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text: `<audio src="${e.target.result}" controls style="max-width:200px;"></audio>`, time: getFormattedTime() }); }; reader.readAsDataURL(audioBlob); stream.getTracks().forEach(track => track.stop()); }; mediaRecorder.start(); isRecording = true; document.getElementById('msgInput').style.display = 'none'; document.getElementById('voiceRecBar').style.display = 'flex'; let elapsed = 0; const interval = setInterval(() => { if (!isRecording) { clearInterval(interval); return; } elapsed += 0.1; document.getElementById('voiceWaveFill').style.width = Math.min(100, (elapsed / 60) * 100) + '%'; }, 100); }).catch(() => showToast('Нет доступа к микрофону', true));
    }

            if (isEditing) {
                container.innerHTML += `<div class="message editing" data-idx="${idx}"><div class="message-avatar" onclick="window.showUserProfile('${msg.from}')">${getAvatarForUser(msg.from)}</div><div class="message-content"><input type="text" id="editMsgInput-${idx}" class="edit-input" value="${msg.text.replace(/"/g, '&quot;')}"><div style="display:flex; gap:8px; margin-top:6px;"><button class="save-edit-msg" data-idx="${idx}" style="background:#0af; border:none; border-radius:20px; padding:4px 12px;">💾 Сохранить</button><button class="cancel-edit-msg" style="background:#666; border:none; border-radius:20px; padding:4px 12px;">✖ Отмена</button></div></div></div>`;
            } else {
                container.innerHTML += `<div class="message ${msg.from === currentUser ? 'my-message' : ''} ${isPinned ? 'pinned' : ''}" data-idx="${idx}">${isPinned ? '<div class="pin-badge">📌</div>' : ''}<div class="message-avatar" onclick="window.showUserProfile('${msg.from}')">${getAvatarForUser(msg.from)}</div><div class="message-content"><strong>${msg.from}:</strong> ${msg.text}<br><small>${msg.time}</small><div class="message-actions"><span class="reply-action">↩️ Ответить</span><span class="forward-action">📤 Переслать</span><span class="pin-action">📌 Закрепить</span>${msg.from === currentUser ? '<span class="edit-action">✏️ Редактировать</span>' : ''}${msg.from === currentUser ? '<span class="delete-action">🗑️ Удалить</span>' : ''}</div></div></div>`;
            }
        });
        
        document.querySelectorAll('.reply-action').forEach(el => { el.onclick = () => { const idx = el.closest('.message').dataset.idx; const msg = messagesData[currentChat][idx]; replyTo = msg; document.getElementById('msgInput').focus(); document.getElementById('replyIndicator').innerHTML = `<span>↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"</span><button id="cancelReplyBtn" style="background:none; border:none; color:cyan; cursor:pointer;">✖ Отмена</button>`; document.getElementById('cancelReplyBtn').onclick = () => { replyTo = null; document.getElementById('replyIndicator').innerHTML = ''; }; }; });
        document.querySelectorAll('.forward-action').forEach(el => { el.onclick = () => showToast('Пересылка в разработке'); });
        document.querySelectorAll('.pin-action').forEach(el => { el.onclick = () => { const idx = parseInt(el.closest('.message').dataset.idx); const msg = messagesData[currentChat][idx]; if (!pinnedMessages[currentChat]) pinnedMessages[currentChat] = []; if (pinnedMessages[currentChat].some(p => p.messageIndex === idx)) { pinnedMessages[currentChat] = pinnedMessages[currentChat].filter(p => p.messageIndex !== idx); showToast('Откреплено'); } else { if (pinnedMessages[currentChat].length >= 3) { showToast('Нельзя закрепить более 3', true); return; } pinnedMessages[currentChat].push({ messageIndex: idx, text: msg.text, from: msg.from, time: msg.time }); showToast('Закреплено'); } savePinnedMessages(); renderMessages(); }; });
        document.querySelectorAll('.edit-action').forEach(el => { el.onclick = () => { const idx = parseInt(el.closest('.message').dataset.idx); const msg = messagesData[currentChat][idx]; if(msg && msg.from === currentUser) { editingMessage = { chatId: currentChat, messageIndex: idx, oldText: msg.text }; renderMessages(); } else showToast('Можно редактировать только свои сообщения', true); }; });
        document.querySelectorAll('.save-edit-msg').forEach(btn => { btn.onclick = () => { const idx = parseInt(btn.dataset.idx); const newText = document.getElementById(`editMsgInput-${idx}`).value.trim(); if(newText) { if(socket) socket.emit('editMessage', { chatId: currentChat, messageIndex: idx, newText, from: currentUser }); else messagesData[currentChat][idx].text = newText; } editingMessage = null; renderMessages(); }; });
        document.querySelectorAll('.cancel-edit-msg').forEach(btn => { btn.onclick = () => { editingMessage = null; renderMessages(); }; });
        document.querySelectorAll('.delete-action').forEach(el => { el.onclick = () => { const idx = el.closest('.message').dataset.idx; showConfirmDialog('Удалить сообщение?', () => { socket.emit('deleteMessage', { chatId: currentChat, messageIndex: idx }); }); }; });
        
        const searchMsgInput = document.getElementById('messageSearchInput');
        if (searchMsgInput) searchMsgInput.oninput = performSearchInMessages;
        document.getElementById('searchPrevBtn')?.addEventListener('click', () => navigateSearch(-1));
        document.getElementById('searchNextBtn')?.addEventListener('click', () => navigateSearch(1));
        document.getElementById('searchCloseBtn')?.addEventListener('click', closeSearch);
        
        container.scrollTop = container.scrollHeight;
    }
    
    function performSearchInMessages() {
        const query = document.getElementById('messageSearchInput')?.value.toLowerCase();
        const searchCountSpan = document.getElementById('searchCount');
        if (!query) { clearAllHighlights(); if (searchCountSpan) searchCountSpan.innerText = '0'; return; }
        const messages = document.querySelectorAll('.chat-messages .message');
        clearAllHighlights();
        currentMatches = [];
        messages.forEach(msg => { const text = msg.innerText.toLowerCase(); if (text.includes(query)) { msg.classList.add('highlight'); currentMatches.push(msg); } });
        if (searchCountSpan) searchCountSpan.innerText = currentMatches.length.toString();
        if (currentMatches.length > 0) { currentMatchIndex = 0; highlightCurrentMatch(); } else currentMatchIndex = -1;
    }
    
    function clearAllHighlights() { document.querySelectorAll('.chat-messages .message').forEach(msg => { msg.classList.remove('highlight', 'current-highlight'); }); currentMatches = []; currentMatchIndex = -1; }
    function highlightCurrentMatch() { document.querySelectorAll('.chat-messages .message').forEach(msg => msg.classList.remove('current-highlight')); if (currentMatchIndex >= 0 && currentMatches[currentMatchIndex]) { const currentMsg = currentMatches[currentMatchIndex]; currentMsg.classList.add('current-highlight'); currentMsg.scrollIntoView({ behavior: 'smooth', block: 'center' }); const searchCountSpan = document.getElementById('searchCount'); if (searchCountSpan) searchCountSpan.innerText = `${currentMatchIndex + 1}/${currentMatches.length}`; } }
    function navigateSearch(delta) { if (currentMatches.length === 0) return; currentMatchIndex += delta; if (currentMatchIndex < 0) currentMatchIndex = currentMatches.length - 1; if (currentMatchIndex >= currentMatches.length) currentMatchIndex = 0; highlightCurrentMatch(); }
    function openSearch() { document.getElementById('searchBar').style.display = 'flex'; document.getElementById('messageSearchInput').focus(); }
    function closeSearch() { document.getElementById('searchBar').style.display = 'none'; clearAllHighlights(); document.getElementById('messageSearchInput').value = ''; document.getElementById('searchCount').innerText = '0'; }
    
    // ========== ОТПРАВКА СООБЩЕНИЙ ==========
    function sendMessage() {
        const input = document.getElementById('msgInput');
        let text = input.value.trim();
        if (replyTo) { text = `↩️ Ответ ${replyTo.from}: "${replyTo.text.substring(0,40)}"\n${text}`; replyTo = null; document.getElementById('replyIndicator').innerHTML = ''; }
        if (text) { if (currentChat === `favorites_${currentUser}`) saveFavoriteMessage(text); else socket.emit('sendMessage', { chatId: currentChat, from: currentUser, text, time: getFormattedTime() }); input.value = ''; }
    }
    
    function saveFavoriteMessage(text) {
        const favKey = `favorites_${currentUser}`;
        let fav = JSON.parse(localStorage.getItem(favKey) || '[]');
        fav.push({ from: currentUser, text, time: getFormattedTime() });
        localStorage.setItem(favKey, JSON.stringify(fav));
        if (currentChat === `favorites_${currentUser}`) renderMessages();
    }
    
    async function loadMessages() {
        if (currentChat === `favorites_${currentUser}`) { const favKey = `favorites_${currentUser}`; messagesData[currentChat] = JSON.parse(localStorage.getItem(favKey) || '[]'); renderMessages(); return; }
        const res = await fetch(`/messages/${currentChat}`);
        messagesData[currentChat] = await res.json();
        renderMessages();
    }
    
    // ========== ЭМОДЗИ ==========
    function showEmojiPicker() {
        const emojis = ['😀','😂','😍','😎','🔥','⭐','🎮','⚡','💀','❤️','👍','🙈','✨','🎉','💔','✅','❌','🥹','😭','🤣','🥰','😱','🤔','😴','🥳','🎊','🌈','🍕','🎵','💪','🤝','👋'];
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal';
        modalDiv.innerHTML = `<div class="modal-box"><h3>😀 Эмодзи</h3><div class="emoji-picker" id="emojiGrid"></div><button id="closeEmoji" class="auth-btn">Закрыть</button></div>`;
        document.body.appendChild(modalDiv);
        const grid = modalDiv.querySelector('#emojiGrid');
        emojis.forEach(emoji => { const span = document.createElement('span'); span.className = 'emoji-option'; span.innerText = emoji; span.onclick = () => { document.getElementById('msgInput').value += emoji; modalDiv.remove(); }; grid.appendChild(span); });
        modalDiv.querySelector('#closeEmoji').onclick = () => modalDiv.remove();
    }
    
    // ========== ОФФЛАЙН-РЕЖИМ ==========
    function saveOfflineMessage(chatId, message) {
        if (!offlineMessages[chatId]) offlineMessages[chatId] = [];
        offlineMessages[chatId].push(message);
        saveOfflineMessages();
    }
    
    function syncOfflineMessages() {
        if (!socket || !currentUser) return;
        for (const chatId in offlineMessages) {
            for (const msg of offlineMessages[chatId]) {
                socket.emit('sendMessage', msg);
            }
        }
        offlineMessages = {};
        saveOfflineMessages();
    }
    
    // ========== ЗАПУСК МЕССЕНДЖЕРА ==========
    async function startMessenger() {
        await loadAllData();
        socket = io();
        
        socket.emit('userOnline', currentUser);
        socket.on('userOnline', (login) => { onlineUsers[login] = true; saveOnlineUsers(); renderLeftPanelContent(); if(currentChat !== `favorites_${currentUser}` && currentChat) renderMessages(); });
        socket.on('userOffline', (login) => { onlineUsers[login] = false; saveOnlineUsers(); renderLeftPanelContent(); if(currentChat !== `favorites_${currentUser}` && currentChat) renderMessages(); });
        socket.on('newMessage', (msg) => {
            if (currentChat === `favorites_${currentUser}`) return;
            if (!messagesData[currentChat]) messagesData[currentChat] = [];
            messagesData[currentChat].push(msg);
            if (currentChat === msg.chatId) renderMessages();
            loadAllData();
            const isChatMuted = mutedChats[currentChat];
            if (!isChatMuted && msg.from !== currentUser) {
                showToast(`📩 Новое сообщение от ${msg.from}`);
                const audio = new Audio('/sounds/notifica.mp3');
                audio.play().catch(()=>{});
                document.title = '🔔 Новое сообщение';
                setTimeout(() => document.title = 'StormLink', 3000);
            }
        });
        socket.on('messageDeleted', ({ chatId, messageIndex }) => { if (messagesData[chatId]) { messagesData[chatId].splice(messageIndex, 1); if (chatId === currentChat) renderMessages(); } });
        socket.on('messageEdited', ({ chatId, messageIndex, newText }) => { if (messagesData[chatId] && messagesData[chatId][messageIndex]) { messagesData[chatId][messageIndex].text = newText; if (chatId === currentChat) renderMessages(); } });
        socket.on('friendRequest', () => { loadAllData(); showToast('📨 Новая заявка в друзья!'); });
        socket.on('groupRequest', () => loadAllData());
        socket.on('updateUnread', () => loadAllData());
        socket.on('error', (msg) => showToast(msg, true));
        socket.on('disconnect', () => { showToast('Потеря соединения, переподключение...', true); setTimeout(() => socket.connect(), 1000); });
        
        document.getElementById('app').innerHTML = `
            <button class="burger-btn" id="burgerBtn">☰</button>
            <div class="messenger">
                <div class="left-menu" id="leftMenu">
                    <div class="menu-header">⚡ STORMLINK</div>
                    <div class="menu-items">
                        <div class="menu-item" id="menuProfile"><span>👤</span> Профиль</div>
                        <div class="menu-item" id="menuSettings"><span>⚙️</span> Настройки</div>
                        <div class="menu-item" id="menuFriends"><span>👥</span> Друзья</div>
                    </div>
                </div>
                <div class="content-panel" id="contentPanel">
                    <div class="global-search-header">
                        <div class="global-search-input-wrapper">
                            <span>🔍</span>
                            <input type="text" id="globalSearchInput" placeholder="Поиск...">
                            <button class="clear-search-btn" id="clearSearchBtn">✖</button>
                        </div>
                    </div>
                    <div class="nav-tabs">
                        <div class="nav-tab ${activeTab === 'chats' ? 'active' : ''}" data-tab="chats">💬 Чаты</div>
                        <div class="nav-tab ${activeTab === 'groups' ? 'active' : ''}" data-tab="groups">👥 Группы</div>
                        <div class="nav-tab ${activeTab === 'channels' ? 'active' : ''}" data-tab="channels">📢 Каналы</div>
                        <div class="nav-tab ${activeTab === 'contacts' ? 'active' : ''}" data-tab="contacts">👤 Контакты</div>
                    </div>
                    <div id="searchResultsContainer" class="search-results-container"></div>
                    <div id="listContainer" class="list-container"></div>
                    <div id="joinRequestsContainer" class="list-container" style="border-top:1px solid rgba(0,255,255,0.2); margin-top:8px; max-height:200px;"></div>
                    <div class="add-btn" id="createGroupBtn">👥 Создать группу</div>
                    <div class="add-btn" id="createChannelBtn">📢 Создать канал</div>
                </div>
                <div class="chat-panel">
                    <div class="chat-header">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <button class="mobile-back-btn" id="mobileBackBtn">←</button>
                            <span class="chat-title" id="chatTitle">Выберите чат</span>
                        </div>
                        <button class="chat-header-dots" id="chatMenuBtn">⋯</button>
                    </div>
                    <div class="chat-messages" id="messagesList"><div class="empty-state">💬 Выберите чат слева</div></div>
                    <div id="replyIndicator" class="reply-indicator" style="padding:0 16px;"></div>
                    <div class="chat-input" id="chatInputArea">
                        <button id="emojiBtn">😀</button>
                        <button id="attachBtn">📎</button>
                        <button id="videoMsgBtn">🎥</button>
                        <input type="text" id="msgInput" placeholder="Сообщение...">
                        <button id="voiceBtn">🎙️</button>
                        <button id="sendBtn">➤</button>
                        <div id="voiceRecBar" style="display:none; align-items:center; gap:12px; flex:1;">
                            <div class="voice-wave"><div id="voiceWaveFill" class="voice-wave-fill"></div></div>
                            <button id="cancelVoiceBtn">✖</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="friends-icon" id="friendsIcon">👥<div class="friend-request-count"></div></div>
        `;
        
        // Меню
        document.getElementById('menuProfile').onclick = () => window.showMyProfile();
        document.getElementById('menuSettings').onclick = () => showSettingsModal();
        document.getElementById('menuFriends').onclick = () => showFriendsList();
        document.getElementById('friendsIcon').onclick = () => showFriendsList();
        document.getElementById('burgerBtn').onclick = () => document.getElementById('leftMenu').classList.toggle('open');
        document.getElementById('mobileBackBtn').onclick = () => document.getElementById('leftMenu').classList.add('open');
        document.getElementById('createGroupBtn').onclick = () => createGroup();
        document.getElementById('createChannelBtn').onclick = () => createChannel();
        document.getElementById('emojiBtn').onclick = showEmojiPicker;
        document.getElementById('attachBtn').onclick = () => { const input = document.createElement('input'); input.type = 'file'; input.onchange = (e) => e.target.files[0] && sendFileWithProgress(e.target.files[0]); input.click(); };
        document.getElementById('videoMsgBtn').onclick = startVideoRecordingWithPreview;
        document.getElementById('voiceBtn').onclick = startVoiceRecording;
        document.getElementById('cancelVoiceBtn').onclick = cancelVoiceRecording;
        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').addEventListener('keypress', (e) => e.key === 'Enter' && sendMessage());
        document.getElementById('chatMenuBtn').onclick = (e) => { e.stopPropagation(); if(currentChat) showChatMenu(); else showToast('Выберите чат'); };
        document.getElementById('chatHeader').onclick = (e) => {
    if (e.target.closest('.chat-header-dots') || e.target.closest('.mobile-back-btn')) return;
    const chat = allChats.find(c => c.id === currentChat);
    if (!chat || !currentChat) return showToast('Выберите чат');
    if (chat.isChannel) window.showChannelProfile(chat.id);
    else if (chat.isGroup) window.showGroupProfile(chat.id);
    else {
        const otherUser = chat.members?.find(m => m !== currentUser);
        if (otherUser) window.showUserProfile(otherUser);
        else showToast('Профиль чата');
    }
};

// Поиск
const searchInput = document.getElementById('globalSearchInput');
const searchResults = document.getElementById('searchResultsContainer');
const listContainer = document.getElementById('listContainer');
searchInput.oninput = (e) => {
    if (e.target.value.trim()) { searchResults.style.display = 'block'; listContainer.style.display = 'none'; performGlobalSearch(e.target.value); }
    else { searchResults.style.display = 'none'; listContainer.style.display = 'flex'; renderLeftPanelContent(); }
};
document.getElementById('clearSearchBtn').onclick = () => { searchInput.value = ''; searchResults.style.display = 'none'; listContainer.style.display = 'flex'; renderLeftPanelContent(); };

// Вкладки
document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.onclick = () => {
        activeTab = tab.dataset.tab;
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        searchResults.style.display = 'none';
        listContainer.style.display = 'flex';
        renderLeftPanelContent();
    };
});

// Мобильное меню
function updateMobileUI() { const isMobile = window.innerWidth <= 768; if (isMobile) document.getElementById('leftMenu').classList.remove('open'); }
updateMobileUI(); window.addEventListener('resize', updateMobileUI);

renderLeftPanelContent();

// Восстановление оффлайн сообщений
window.addEventListener('online', () => syncOfflineMessages());

// Периодический пинг для онлайн-статуса
setInterval(() => { if (socket && currentUser && socket.connected) socket.emit('userOnline', currentUser); }, 30000);
}

// ========== ЗАПУСК ==========
const token = localStorage.getItem('authToken');
if (token) {
    fetch('/auto-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ token }) })
        .then(r => r.json()).then(data => { if (data.success) { currentUser = data.login; currentUserData = data.user; startMessenger(); } else renderAuth(); })
        .catch(() => renderAuth());
} else { renderAuth(); }
</script>
</body>
</html>
